      const f = prof.idle * (1 + r * (prof.range - 1)) * wobble * (crashed ? 0.55 : 1);
      v.o1.frequency.setTargetAtTime(f, t, 0.04);
      v.o2.frequency.setTargetAtTime(f * 0.5, t, 0.04);
      v.amOsc.frequency.setTargetAtTime(f * 0.5, t, 0.04);
      const load = clamp(v.thr * (1.05 - r * 0.25), 0, 1);
      const cut = prof.cut[0] + (prof.cut[1] - prof.cut[0]) * clamp(0.12 + 0.38 * r + 0.5 * load, 0, 1);
      v.lp.frequency.setTargetAtTime(crashed ? prof.cut[0] * 0.6 : cut, t, 0.05);
      const eg = crashed ? 0 : L.engine * (0.32 + 0.38 * load + 0.3 * r);
      v.eng.gain.setTargetAtTime(eg, t, crashed ? 0.5 : 0.05);
      v.raspF.frequency.setTargetAtTime(f * 5 + 300, t, 0.05);
      v.rasp.gain.setTargetAtTime(crashed ? 0 : prof.rasp * (0.15 + 0.85 * load), t, 0.05);
      if (v.whine) {
        v.whineO.frequency.setTargetAtTime(400 + speed * 95, t, 0.06);
        v.whine.gain.setTargetAtTime(crashed ? 0 : prof.whine * clamp(speed / 14, 0, 1) * (0.4 + 0.6 * load) * L.engine * 3, t, 0.08);
      }
      // Fehlzündungen nach Gaswegnehmen
      if (v.isPlayer && prof.pops > 0 && !crashed && v.liftT < 0.7 && r > 0.55 && Math.random() < prof.pops * dt * 6) {
        this.noise({ dur: 0.05, vol: 0.12 * prof.pops + 0.05, f: rnd(180, 420), q: 1.5, type: 'bandpass' });
        this.tone({ f: rnd(70, 110), f2: 40, dur: 0.07, type: 'square', vol: 0.05, lp: 500 });
      }

      // Rollgeräusch je Untergrund (nur mit Bodenkontakt)
      let contacts = 0;
      for (const w of veh.wheels) if (w.contact) contacts++;
      const g = contacts / veh.wheels.length;
      const sp = clamp(speed / 13, 0, 1.4);
      v.roadF.frequency.setTargetAtTime(surf.f * (0.7 + 0.45 * sp), t, 0.08);
      v.road.gain.setTargetAtTime(L.road * surf.gain * g * Math.pow(sp, 0.85) * 0.55, t, 0.06);
      // Kette (Kettenfahrzeug): rhythmisches Klackern
      const dx = Math.abs(veh.x - v.lastX); v.lastX = veh.x;
      if (v.isPlayer && g > 0) {
        // Körnung: Steinchen, Äste, Schneeknirschen
        v.gritAcc += dx * surf.grit * (this.lowPower ? 0.5 : 1);
        let n = 0;
        while (v.gritAcc > 1 && n < 3) {
          v.gritAcc -= rnd(0.6, 1.4); n++;
          this.noise({ dur: rnd(0.012, 0.03), vol: rnd(0.025, 0.06) * clamp(sp, 0.3, 1), f: surf.gritF * rnd(0.7, 1.3), q: rnd(2, 5), delay: rnd(0, 0.03) });
        }
        if (v.gritAcc > 3) v.gritAcc = 0;
        if (surf.seam) {
          v.seamAcc += dx;
          if (v.seamAcc > surf.seam) {
            v.seamAcc -= surf.seam;
            const wb = Math.abs(veh.wheels[veh.wheels.length - 1].def.x - veh.wheels[0].def.x);
            const gap = clamp(wb / Math.max(speed, 1), 0.04, 0.5);
            const vol = 0.05 + 0.05 * clamp(sp, 0, 1);
            this.noise({ dur: 0.04, vol, f: 1400, q: 6 }); this.tone({ f: 190, dur: 0.06, type: 'triangle', vol: vol * 0.7 });
            this.noise({ dur: 0.04, vol: vol * 0.8, f: 1300, q: 6, delay: gap });
          }
        }
        if (v.r.def.look === 'tracked' && speed > 0.6) {
          v.dist += dx;
          if (v.dist > 0.42) { v.dist = 0; this.noise({ dur: 0.025, vol: 0.035, f: 2400, q: 7 }); }
        }
      }

      // Federung: schnelles Einfedern → Dumpf-Schlag, Anschlag → Klonk
      if (v.isPlayer) {
        veh.wheels.forEach((w, i) => {
          const x = w.compress || 0;
          const cv = (x - v.comp[i]) / dt;
          v.comp[i] = x;
          v.compT[i] += dt;
          if (w.contact && cv > 1.1 && v.compT[i] > 0.12) {
            v.compT[i] = 0;
            const k = clamp((cv - 1.1) / 3.5, 0, 1);
            this.tone({ f: 95 - k * 30, f2: 45, dur: 0.12 + k * 0.1, vol: 0.06 + k * 0.16, type: 'sine' });
            this.noise({ dur: 0.06 + k * 0.06, vol: 0.03 + k * 0.08, f: 260, q: 0.9, type: 'lowpass' });
            const lim = w.pj && w.pj.getUpperLimit ? w.pj.getUpperLimit() : null;
            if (lim !== null && x > lim * 0.9 && k > 0.3) this.noise({ dur: 0.08, vol: 0.08 * k, f: 1700, q: 9, delay: 0.01 });
          }
        });
      }

      // Reifen: Bremsen mit Tempo / Durchdrehen
      if (v.sk) {
        let s = 0;
        if (brake && veh.brakingHard && g > 0) s = clamp((speed - 1.5) / 9, 0, 1);
        if (gas && g > 0 && veh.slip > 2.5) s = Math.max(s, clamp((veh.slip - 2.5) / 7, 0, 0.8));
        v.skF.frequency.setTargetAtTime((surf.squeal > 0.4 ? 1900 : 2600) + Math.sin(v.wob * 3) * 160 + speed * 20, t, 0.04);
        v.sk.gain.setTargetAtTime(L.skid * s * (0.35 + 0.65 * surf.squeal), t, s > 0 ? 0.03 : 0.08);
        // Fahrtwind; in der Luft lauter, Drehung erzeugt Rauschen
        const w = Math.abs(veh.chassis.getAngularVelocity());
        const air = veh.inAir ? 1 : 0;
        const wind = 0.04 * Math.pow(clamp(speed / 22, 0, 1.2), 2) + air * (0.05 * clamp(speed / 16, 0, 1) + 0.06 * clamp((w - 2) / 6, 0, 1));
        v.wF.frequency.setTargetAtTime(380 + speed * 38 + air * w * 60, t, 0.1);
        v.wd.gain.setTargetAtTime(L.wind * wind, t, 0.12);
      }
    },

    /* =================== Fahr-Ereignisse =================== */
    /** Landung: impact = Aufprallgeschwindigkeit (m/s), att 0..1 (Entfernung), pan */
    land(impact, air, att, pan) {
      if (!this.ok()) return;
      att = att === undefined ? 1 : att;
      if (att < 0.05 || !this._rate('land' + (att < 1 ? 'ai' : ''), 0.09)) return;
      const k = clamp(impact / 12, 0, 1);
      if (k < 0.12) { this.noise({ dur: 0.08, vol: 0.05 * att, f: 220, q: 0.8, type: 'lowpass', pan }); return; }
      this.tone({ f: 90 - 35 * k, f2: 34, dur: 0.18 + 0.32 * k, vol: (0.12 + 0.35 * k) * att, pan });
      this.noise({ dur: 0.12 + 0.25 * k, vol: (0.08 + 0.25 * k) * att, f: 240 + 140 * k, q: 0.8, type: 'lowpass', pan });
      if (k > 0.45) {
        // schwer: Metall klappert, Schotter/Erde fliegt
        this.noise({ dur: 0.14, vol: 0.12 * k * att, f: rnd(1100, 1500), q: 10, delay: 0.02, pan });
        this.noise({ dur: 0.1, vol: 0.08 * k * att, f: rnd(2200, 2800), q: 12, delay: 0.06, pan });
        this.noise({ dur: 0.35, vol: 0.05 * k * att, f: 900, q: 0.6, delay: 0.05, pan });
      }
    },
    takeoff(speed) {
      if (!this.ok() || !this._rate('takeoff', 0.4)) return;
      const k = clamp((speed || 8) / 18, 0.2, 1);
      this.noise({ dur: 0.45, vol: 0.035 * k, f: 380, f2: 900, q: 0.8, attack: 0.08 });
    },
    crash(reason, att, pan) {
      if (!this.ok()) return;
      att = att === undefined ? 1 : att;
      if (!this._rate('crash' + (att < 1 ? 'ai' : ''), 0.3)) return;
      this.noise({ dur: 0.45, vol: 0.4 * att, f: 900, q: 0.6, type: 'lowpass', pan });
      this.tone({ f: 85, f2: 32, dur: 0.45, vol: 0.32 * att, pan });
      [rnd(650, 800), rnd(1250, 1450), rnd(2300, 2700)].forEach((f, i) => this.noise({ dur: 0.3 + i * 0.12, vol: 0.13 * att, f, q: 14, delay: 0.015 * i, pan }));
      for (let i = 0; i < 4; i++) this.noise({ dur: 0.03, vol: 0.05 * att, f: rnd(4000, 7000), q: 8, delay: rnd(0.08, 0.45), pan });
      if (reason === 'flip') [0.28, 0.6].forEach((d, i) => { this.tone({ f: 70, f2: 35, dur: 0.25, vol: (0.18 - i * 0.05) * att, delay: d, pan }); this.noise({ dur: 0.2, vol: 0.12 * att, f: 500, q: 0.7, type: 'lowpass', delay: d, pan }); });
    },
    respawn() {
      if (!this.ok()) return;
      this.noise({ dur: 0.35, vol: 0.05, f: 1500, f2: 500, q: 1, attack: 0.05 });
      this.tone({ f: 660, dur: 0.18, type: 'triangle', vol: 0.05, delay: 0.12 });
      this.tone({ f: 990, dur: 0.25, type: 'triangle', vol: 0.045, delay: 0.2 });
    },
    /** Stunt-Belohnung aus den Teilen der Wertung (Rotationen, Richtung, Flugzeit, saubere Landung) */
    stunt(parts) {
      if (!this.ok() || !this._rate('stunt', 0.15)) return;
      let flips = 0, dir = 'back', air = false, perfect = false;
      for (const p of parts || []) {
        const l = p.label || '';
        const m = l.match(/^(\d+)×/);
        if (/Backflip/.test(l)) { flips = m ? +m[1] : 1; dir = 'back'; }
        if (/Frontflip/.test(l)) { flips = m ? +m[1] : 1; dir = 'front'; }
        if (/Flugzeit/.test(l)) air = true;
        if (/Saubere/.test(l)) perfect = true;
      }
      let d = 0;
      if (flips > 0) {
        // Backflip: Dur aufwärts; Frontflip: andere Klangfarbe und Lage; je Rotation ein Ton mehr
        const base = dir === 'back' ? 72 : 74;
        const steps = dir === 'back' ? [0, 4, 7, 12, 16, 19, 24] : [0, 5, 9, 12, 17, 21, 24];
        const n = Math.min(steps.length, 2 + flips);
        for (let i = 0; i < n; i++) {
          this.tone({ f: mtof(base + steps[i]), dur: 0.16, type: dir === 'back' ? 'triangle' : 'square', vol: dir === 'back' ? 0.08 : 0.04, delay: d, lp: 3500 });
          d += 0.065;
        }
        if (flips > 1) this.noise({ dur: 0.5, vol: 0.04, f: 6000, q: 1, type: 'highpass', delay: d, attack: 0.05 });
      }
      if (air) { this.tone({ f: mtof(79), f2: mtof(84), dur: 0.3, type: 'sine', vol: 0.05, delay: d, glide: 0.2 }); d += 0.12; }
      if (perfect) {
        this.tone({ f: 1568, dur: 0.7, type: 'sine', vol: 0.07, delay: d });
        this.tone({ f: 2349, dur: 0.5, type: 'sine', vol: 0.035, delay: d + 0.01 });
        this.tone({ f: 3136, dur: 0.35, type: 'sine', vol: 0.02, delay: d + 0.02 });
      }
    },
    coin() {
      if (!this.ok() || !this._rate('coin', 0.035)) return;
      const t = this.ctx.currentTime;
      this._coinStreak = t - (this._coinT || 0) < 0.4 ? Math.min(7, (this._coinStreak || 0) + 1) : 0;
      this._coinT = t;
      const f = 1320 * Math.pow(2, (this._coinStreak * 2) / 12);
      this.tone({ f, dur: 0.06, type: 'square', vol: 0.035, lp: 5000 });
      this.tone({ f: f * 1.5, dur: 0.12, type: 'square', vol: 0.03, delay: 0.05, lp: 5000 });
    },

    /* =================== Rennen =================== */
    count() { this.tone({ f: 587, dur: 0.18, type: 'square', vol: 0.06, lp: 2500 }); this.tone({ f: 293, dur: 0.18, type: 'sine', vol: 0.06 }); },
    go() {
      this.tone({ f: 1175, dur: 0.5, type: 'square', vol: 0.07, lp: 3500 });
      this.tone({ f: 587, dur: 0.5, type: 'sine', vol: 0.08 });
      this.noise({ dur: 0.5, vol: 0.06, f: 700, f2: 3000, q: 0.7, attack: 0.02 });
    },
    launch(q) {
      if (q === 'perfect') { this.tone({ f: 1568, dur: 0.25, type: 'triangle', vol: 0.06, delay: 0.12 }); this.tone({ f: 2093, dur: 0.35, type: 'triangle', vol: 0.05, delay: 0.2 }); }
      else if (q === 'high') this.noise({ dur: 0.7, vol: 0.12, f: 2300, q: 6, attack: 0.02 });
      else if (q === 'low') this.tone({ f: 70, f2: 45, dur: 0.4, type: 'sawtooth', vol: 0.06, lp: 400 });
    },
    fuel() {
      if (!this._rate('fuel', 0.3)) return;
      this.noise({ dur: 0.35, vol: 0.06, f: 600, f2: 1600, q: 2, attack: 0.02 });
      [880, 1175, 1568].forEach((f, i) => this.tone({ f, dur: 0.12, type: 'triangle', vol: 0.05, delay: 0.08 + i * 0.06 }));
    },
    /** Hindernisse: Knarren/Fallen (Baum), Tor-Motor/Warnton, Rollen, Steinschlag – leiser mit Entfernung */
    obstacle(kind, phase, near) {
      if (!this.ok()) return;
      const att = clamp(1 - (near || 0) / 45, 0.08, 1);
      if (kind === 'tree') {
        if (phase === 'warn') for (let i = 0; i < 3; i++) this.tone({ f: rnd(120, 200), f2: rnd(80, 140), dur: 0.35, type: 'sawtooth', vol: 0.05 * att, lp: 700, delay: i * 0.28, attack: 0.05 });
        if (phase === 'fall') { this.noise({ dur: 0.6, vol: 0.12 * att, f: 900, q: 1.5 }); this.noise({ dur: 1.4, vol: 0.06 * att, f: 3500, q: 0.6, delay: 0.1, attack: 0.3 }); }
        if (phase === 'land') { this.tone({ f: 70, f2: 35, dur: 0.6, vol: 0.3 * att }); this.noise({ dur: 0.5, vol: 0.18 * att, f: 400, q: 0.7, type: 'lowpass' }); }
      } else if (kind === 'gate') {
        if (phase === 'close' || phase === 'open') { this.tone({ f: 110, dur: 1.0, type: 'sawtooth', vol: 0.03 * att, lp: 500, attack: 0.1 }); }
        if (phase === 'close') for (let i = 0; i < 3; i++) this.tone({ f: 880, dur: 0.12, type: 'square', vol: 0.025 * att, lp: 2500, delay: i * 0.25 });
      } else if (kind === 'roller') {
        if (phase === 'roll') this.noise({ dur: 0.8, vol: 0.06 * att, f: 300, q: 0.8, type: 'lowpass', attack: 0.2 });
      } else if (kind === 'fall') {
        if (phase === 'warn') this.noise({ dur: 1.2, vol: 0.12 * att, f: 140, q: 0.7, type: 'lowpass', attack: 0.3 });
        if (phase === 'impact' && this._rate('rock', 0.08)) { this.tone({ f: 95, f2: 45, dur: 0.2, vol: 0.12 * att }); this.noise({ dur: 0.12, vol: 0.08 * att, f: 1400, q: 3 }); }
      }
    },
    checkpoint() { this.tone({ f: 880, dur: 0.12, type: 'triangle', vol: 0.07 }); this.tone({ f: 1319, dur: 0.2, type: 'triangle', vol: 0.06, delay: 0.08 }); },
    position(up) {
      if (!this.ok() || !this._rate('pos', 1.2)) return;
      if (up) { this.tone({ f: 784, dur: 0.1, type: 'triangle', vol: 0.06 }); this.tone({ f: 1175, dur: 0.16, type: 'triangle', vol: 0.06, delay: 0.07 }); }
      else { this.tone({ f: 523, dur: 0.12, type: 'triangle', vol: 0.045 }); this.tone({ f: 392, dur: 0.18, type: 'triangle', vol: 0.045, delay: 0.09 }); }
    },
    opponentFinish() { if (this._rate('ofin', 0.5)) this.tone({ f: 660, dur: 0.12, type: 'sine', vol: 0.04 }); },
    finish(place) {
      const win = place === 1, good = place <= 3;
      const seq = win ? [72, 76, 79, 84] : good ? [72, 76, 79] : [67, 72];
      seq.forEach((m, i) => {
        this.tone({ f: mtof(m), dur: i === seq.length - 1 ? 0.55 : 0.18, type: 'triangle', vol: 0.09, delay: i * 0.11 });
        if (win) this.tone({ f: mtof(m - 12), dur: 0.2, type: 'square', vol: 0.03, delay: i * 0.11, lp: 1800 });
      });
      if (win) this.noise({ dur: 0.8, vol: 0.04, f: 7000, q: 1, type: 'highpass', delay: 0.35, attack: 0.1 });
    },

    /* =================== Oberfläche & Belohnungen =================== */
    click() { if (this._rate('ui', 0.03)) { this.tone({ f: 1250, dur: 0.035, type: 'triangle', vol: 0.06 }); this.noise({ dur: 0.02, vol: 0.02, f: 3000, q: 2 }); } },
    nav() { if (this._rate('ui', 0.03)) { this.noise({ dur: 0.12, vol: 0.035, f: 900, f2: 2400, q: 1.2 }); this.tone({ f: 740, dur: 0.06, type: 'triangle', vol: 0.045, delay: 0.04 }); } },
    select() { this.tone({ f: 587, dur: 0.08, type: 'triangle', vol: 0.06 }); this.tone({ f: 880, dur: 0.14, type: 'triangle', vol: 0.06, delay: 0.06 }); },
    purchase() {
      [1047, 1319, 1568, 2093].forEach((f, i) => this.tone({ f, dur: 0.12, type: 'square', vol: 0.035, delay: i * 0.05, lp: 4500 }));
      this.noise({ dur: 0.4, vol: 0.03, f: 6000, q: 1, type: 'highpass', delay: 0.1 });
    },
    upgrade() {
      this.tone({ f: 220, f2: 880, dur: 0.32, type: 'sawtooth', vol: 0.04, lp: 1800, glide: 0.28 });
      this.noise({ dur: 0.06, vol: 0.08, f: 1500, q: 8, delay: 0.3 });
      this.tone({ f: 1319, dur: 0.22, type: 'triangle', vol: 0.06, delay: 0.32 });
    },
    error() { if (this._rate('err', 0.15)) { this.tone({ f: 196, dur: 0.11, type: 'square', vol: 0.045, lp: 1200 }); this.tone({ f: 165, dur: 0.16, type: 'square', vol: 0.045, delay: 0.1, lp: 1200 }); } },
    reward(n) {
      const k = Math.min(8, 3 + Math.floor((n || 0) / 150));
      for (let i = 0; i < k; i++) this.tone({ f: 1568 * Math.pow(2, (i % 4) / 12), dur: 0.07, type: 'square', vol: 0.025, delay: 0.25 + i * 0.06, lp: 5000 });
    },
    unlockFx() { [72, 76, 79, 83, 88].forEach((m, i) => this.tone({ f: mtof(m), dur: 0.3, type: 'sine', vol: 0.06, delay: 0.5 + i * 0.07 })); },
    achievement() { [79, 84, 88, 91].forEach((m, i) => this.tone({ f: mtof(m), dur: 0.22, type: 'triangle', vol: 0.06, delay: i * 0.06 })); },
    jump() { this.takeoff(); },
    brake() { /* laufend über Reifengeräusch */ },

    /* =================== Atmosphäre =================== */
    /** env = Welt-ID oder null; level = 1 im Rennen, leiser im Menü */
    setAmbience(env, level) {
      this._wantAmb = env ? { env, level } : null;
      if (!this.ctx) return;
      const cur = this.amb;
      if (cur && cur.env === env) { cur.level = level; cur.out.gain.setTargetAtTime(level * CA.levels.ambience * (this.paused ? 0.5 : 1), this.ctx.currentTime, 0.4); return; }
      if (cur) {
        const t = this.ctx.currentTime;
        cur.out.gain.setTargetAtTime(0, t, 0.35);
        setTimeout(() => { try { cur.nodes.forEach((n) => n.stop && n.stop()); cur.out.disconnect(); } catch (_) { /* ignorieren */ } }, 1800);
        this.amb = null;
      }
      if (!env || !CA.ambience[env]) return;
      const c = this.ctx, cfg = CA.ambience[env];
      const out = c.createGain(); out.gain.value = 0; out.connect(this.bus.amb);
      const nodes = [];
      const src = c.createBufferSource(); src.buffer = this.noiseBuf; src.loop = true; src.start(0, Math.random()); nodes.push(src);
      const wF = c.createBiquadFilter(); wF.type = 'bandpass'; wF.frequency.value = cfg.wind[1]; wF.Q.value = 0.6;
      const wG = c.createGain(); wG.gain.value = cfg.wind[0] * 0.5;
      src.connect(wF); wF.connect(wG); wG.connect(out);
      const a = { env, cfg, out, nodes, wF, wG, level, next: {} };
      if (cfg.leaves) { const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 2600; const g = c.createGain(); g.gain.value = cfg.leaves * 0.5; src.connect(f); f.connect(g); g.connect(out); a.leaves = g; }
      if (cfg.whistle) { const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 900; f.Q.value = 9; const g = c.createGain(); g.gain.value = cfg.whistle; src.connect(f); f.connect(g); g.connect(out); a.whF = f; a.whG = g; }
      if (cfg.rumble) { const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 90; const g = c.createGain(); g.gain.value = cfg.rumble * 3; src.connect(f); f.connect(g); g.connect(out); a.rmG = g; }
      if (cfg.hum) {
        [55, 110, 165].forEach((fq, i) => { const o = c.createOscillator(); o.frequency.value = fq * rnd(0.995, 1.005); const g = c.createGain(); g.gain.value = cfg.hum / (i + 1.5); o.connect(g); g.connect(out); o.start(); nodes.push(o); });
      }
      this.bus.echo.gain.setTargetAtTime(cfg.echo || 0, c.currentTime, 0.5);
      out.gain.setTargetAtTime(level * CA.levels.ambience * (this.paused ? 0.5 : 1), c.currentTime, 0.8);
      const now = c.currentTime;
      for (const k of Object.keys(cfg.events)) a.next[k] = now + rnd(1, 60 / cfg.events[k]);
      a.gustT = now + 1;
      this.amb = a;
    },
    _ambTick(t) {
      const a = this.amb;
      if (!a) return;
      const cfg = a.cfg;
      // Böen: Pegel und Klangfarbe wandern zufällig (nie identisch)
      if (t > a.gustT) {
        const gs = cfg.wind[2];
        a.wG.gain.setTargetAtTime(cfg.wind[0] * 0.5 * rnd(1 - gs * 0.8, 1 + gs), t, rnd(0.6, 2.2));
        a.wF.frequency.setTargetAtTime(cfg.wind[1] * rnd(0.7, 1.4), t, rnd(0.8, 2.5));
        if (a.whF) { a.whF.frequency.setTargetAtTime(rnd(600, 1500), t, rnd(0.8, 2)); a.whG.gain.setTargetAtTime(cfg.whistle * rnd(0.2, 1.2), t, 1); }
        if (a.leaves) a.leaves.gain.setTargetAtTime(cfg.leaves * 0.5 * rnd(0.4, 1.4), t, 1.2);
        if (a.rmG) a.rmG.gain.setTargetAtTime(cfg.rumble * 3 * rnd(0.6, 1.4), t, 1.5);
        a.gustT = t + rnd(1.5, 5);
      }
      for (const k of Object.keys(a.next)) {
        if (t < a.next[k]) continue;
        a.next[k] = t + (60 / cfg.events[k]) * rnd(0.4, 1.7);
        if (!this.lowPower || Math.random() < 0.6) this._ambEvent(k);
      }
    },
    _ambEvent(k) {
      const pan = rnd(-0.8, 0.8), B = 'amb';
      const far = rnd(0.35, 1);
      switch (k) {
        case 'songbird': {
          const n = Math.floor(rnd(3, 9)); const base = rnd(2600, 4200); let d = 0;
          for (let i = 0; i < n; i++) { const f = base * rnd(0.85, 1.25); this.tone({ f, f2: f * rnd(0.8, 1.35), dur: rnd(0.04, 0.11), vol: 0.03 * far, bus: B, pan, delay: d, echo: 0.3 }); d += rnd(0.06, 0.16); }
          break;
        }
        case 'twonote': { const f = rnd(2200, 3200), r = rnd(1.12, 1.3), n = Math.floor(rnd(2, 4)); for (let i = 0; i < n; i++) { this.tone({ f: f * r, dur: 0.1, vol: 0.025 * far, bus: B, pan, delay: i * 0.42, echo: 0.3 }); this.tone({ f, dur: 0.14, vol: 0.025 * far, bus: B, pan, delay: i * 0.42 + 0.16, echo: 0.3 }); } break; }
        case 'crickets': { const f = rnd(4200, 5200); for (let i = 0; i < Math.floor(rnd(4, 10)); i++) this.tone({ f, dur: 0.035, vol: 0.012, bus: B, pan, delay: i * rnd(0.09, 0.13) }); break; }
        case 'woodpecker': { const n = Math.floor(rnd(8, 16)); for (let i = 0; i < n; i++) this.noise({ dur: 0.02, vol: 0.05 * far, f: rnd(1300, 1700), q: 6, bus: B, pan, delay: i * 0.065, echo: 0.5 }); break; }
        case 'owl': { const f = rnd(330, 420); this.tone({ f, f2: f * 0.92, dur: 0.45, vol: 0.03 * far, bus: B, pan, attack: 0.08, echo: 0.6 }); this.tone({ f: f * 0.95, f2: f * 0.85, dur: 0.6, vol: 0.025 * far, bus: B, pan, attack: 0.1, delay: 0.7, echo: 0.6 }); break; }
        case 'hawk': { const f = rnd(1900, 2500); this.tone({ f, f2: f * 0.62, dur: rnd(0.7, 1.1), vol: 0.025 * far, bus: B, pan, attack: 0.05, echo: 0.7 }); break; }
        case 'cicada': { const f = rnd(5500, 7000); for (let i = 0; i < 18; i++) this.tone({ f, dur: 0.05, vol: 0.008, bus: B, pan, delay: i * 0.05 }); break; }
        case 'sandgust': this.noise({ dur: rnd(1.2, 2.4), vol: 0.06, f: rnd(2500, 4500), q: 0.6, bus: B, pan, attack: 0.5 }); break;
        case 'raven': { const f = rnd(450, 650); for (let i = 0; i < Math.floor(rnd(1, 4)); i++) this.noise({ dur: 0.18, vol: 0.04 * far, f, q: 4, bus: B, pan, delay: i * 0.35, echo: 0.5 }); break; }
        case 'creak': this.tone({ f: rnd(140, 260), f2: rnd(90, 200), dur: rnd(0.4, 0.9), type: 'sawtooth', vol: 0.012, lp: 900, bus: B, pan, attack: 0.1, echo: 0.4 }); break;
        case 'clank': { const f = rnd(500, 1300); this.noise({ dur: rnd(0.3, 0.6), vol: 0.06 * far, f, q: 18, bus: B, pan, echo: 0.8 }); this.noise({ dur: 0.25, vol: 0.04 * far, f: f * 2.7, q: 18, bus: B, pan, echo: 0.8 }); break; }
        case 'steam': this.noise({ dur: rnd(0.8, 1.6), vol: 0.035 * far, f: 5000, q: 0.5, type: 'highpass', bus: B, pan, attack: 0.03, echo: 0.4 }); break;
        case 'alarm': for (let i = 0; i < 3; i++) this.tone({ f: 880, f2: 660, dur: 0.35, type: 'square', vol: 0.008, lp: 1500, bus: B, pan, delay: i * 0.5, echo: 0.8 }); break;
        case 'rockfall': for (let i = 0; i < Math.floor(rnd(5, 12)); i++) this.noise({ dur: rnd(0.03, 0.08), vol: 0.035 * far, f: rnd(800, 2500), q: 3, bus: B, pan, delay: i * rnd(0.05, 0.14), echo: 0.6 }); break;
        case 'crackle': for (let i = 0; i < Math.floor(rnd(4, 12)); i++) this.noise({ dur: 0.012, vol: rnd(0.02, 0.05), f: rnd(1500, 4000), q: 2, bus: B, pan, delay: rnd(0, 0.5) }); break;
        case 'bubble': { const f = rnd(110, 220); for (let i = 0; i < Math.floor(rnd(2, 5)); i++) this.tone({ f: f * rnd(0.9, 1.2), f2: f * 1.8, dur: 0.09, vol: 0.03, bus: B, pan, delay: i * rnd(0.12, 0.25) }); break; }
        case 'boom': this.tone({ f: 55, f2: 28, dur: 1.4, vol: 0.12 * far, bus: B, pan, attack: 0.05, echo: 0.6 }); this.noise({ dur: 1.4, vol: 0.06 * far, f: 160, q: 0.7, type: 'lowpass', bus: B, pan, attack: 0.05 }); break;
      }
    },

    /* =================== Musik =================== */
    /** 'menu' | 'race' | null – blendet weich über */
    setMusic(name) {
      this._wantMusic = name;
      if (!this.ctx) return;
      const cur = this.music;
      if (cur && cur.name === name && !cur.ending) return;
      const c = this.ctx, t = c.currentTime;
      if (cur) {
        cur.ending = true;
        cur.out.gain.cancelScheduledValues(t);
        cur.out.gain.setTargetAtTime(0, t, CA.music.fade / 3);
        const old = cur;
        setTimeout(() => { old.dead = true; try { old.out.disconnect(); } catch (_) { /* ignorieren */ } }, CA.music.fade * 1000 + 600);
        if (this.music === cur) this.music = null;
        this._oldMusic = old;
      }
      if (!name) return;
      const out = c.createGain(); out.gain.value = 0.0001; out.connect(this.bus.music);
      out.gain.setTargetAtTime(1, t + 0.15, CA.music.fade / 3);
      const bpm = name === 'race' ? CA.music.raceBpm : CA.music.menuBpm;
      this.music = { name, out, bpm, step: 0, bar: 0, next: t + 0.12, sec16: 60 / bpm / 4, seed: Math.random(), phrase: null };
    },
    _musicTick(t) {
      for (const m of [this.music, this._oldMusic]) {
        if (!m || m.dead) continue;
        let n = 0;
        while (m.next < t + 0.18 && n < 16) {
          if (this.enabled && this.vol.music > 0.001) this._musicStep(m, m.next);
          m.next += m.sec16; m.step++; n++;
          if (m.step % 16 === 0) m.bar++;
        }
        if (m.next < t - 1) m.next = t + 0.05;   // nach Pause/Hintergrund nicht nachholen
      }
    },
    /* Musik-Bausteine (eigene Komposition, prozedural) */
    _mNote(m, time, midi, dur, type, vol, opt) {
      if (!this._mslot()) return;
      const c = this.ctx; opt = opt || {};
      const o = c.createOscillator(); o.type = type; o.frequency.setValueAtTime(mtof(midi), time);
      if (opt.detune) o.detune.value = opt.detune;
      const g = c.createGain();
      const atk = opt.attack || 0.005;
      g.gain.setValueAtTime(0.0001, time);
      g.gain.exponentialRampToValueAtTime(vol, time + atk);
      if (opt.sustain) g.gain.setValueAtTime(vol, time + Math.max(atk, dur - (opt.release || 0.1)));
      g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
      let node = o;
      if (opt.lp) { const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opt.lp; if (opt.q) f.Q.value = opt.q; o.connect(f); node = f; }
      node.connect(g); g.connect(m.out);
      this._mdone(o);
      o.start(time); o.stop(time + dur + 0.05);
    },
    _mNoise(m, time, dur, vol, f, type, q) {
      if (!this._mslot()) return;
      const c = this.ctx;
      const s = c.createBufferSource(); s.buffer = this.noiseBuf;
      const fl = c.createBiquadFilter(); fl.type = type || 'highpass'; fl.frequency.value = f; fl.Q.value = q || 0.7;
      const g = c.createGain(); g.gain.setValueAtTime(vol, time); g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
      s.connect(fl); fl.connect(g); g.connect(m.out);
      this._mdone(s);
      s.start(time, Math.random() * 1.5); s.stop(time + dur + 0.05);
    },
    _mKick(m, time, vol) {
      if (!this._mslot()) return;
      const c = this.ctx;
      const o = c.createOscillator(); o.frequency.setValueAtTime(140, time); o.frequency.exponentialRampToValueAtTime(42, time + 0.12);
      const g = c.createGain(); g.gain.setValueAtTime(vol, time); g.gain.exponentialRampToValueAtTime(0.0001, time + 0.28);
      o.connect(g); g.connect(m.out); this._mdone(o); o.start(time); o.stop(time + 0.3);
    },
    _musicStep(m, time) {
      const s = m.step % 16, bar = m.bar;
      // eigene Akkordfolgen (Grundton-MIDI + Akkordtöne)
      if (m.name === 'menu') {
        const progs = [[[48, 0, 4, 7], [45, 0, 3, 7], [41, 0, 4, 7], [43, 0, 4, 7]], [[45, 0, 3, 7], [41, 0, 4, 7], [48, 0, 4, 7], [43, 0, 4, 7]], [[41, 0, 4, 7, 11], [43, 0, 4, 7], [40, 0, 3, 7], [45, 0, 3, 7]]];
        const prog = progs[Math.floor(bar / 8) % progs.length];
        const ch = prog[bar % 4], root = ch[0];
        if (s === 0) {
          // Fläche: weiche, leicht verstimmte Dreiecke
          for (const iv of ch.slice(1)) for (const dt of [-7, 7]) this._mNote(m, time, root + 12 + iv, m.sec16 * 16 + 1.1, 'triangle', 0.018, { attack: 0.35, sustain: true, release: 1.1, detune: dt, lp: 1400 });
          this._mNote(m, time, root - 12, m.sec16 * 7, 'sine', 0.08, { attack: 0.02, sustain: true, release: 0.3 });
        }
        if (s === 8) this._mNote(m, time, root - 12 + (bar % 2 ? 7 : 0), m.sec16 * 7, 'sine', 0.06, { attack: 0.02, sustain: true, release: 0.3 });
        // Arpeggio (Muster wechselt alle 4 Takte)
        const pats = [[0, 1, 2, 3, 2, 1, 2, 3], [0, 2, 1, 3, 0, 2, 1, 3], [0, 1, 2, 1, 3, 2, 1, 2]];
        const pat = pats[Math.floor(bar / 4 + m.seed * 3) % pats.length];
        if (s % 2 === 0) {
          const tones = ch.slice(1).concat([12]);
          const iv = tones[pat[s / 2] % tones.length];
          this._mNote(m, time, root + 24 + iv, 0.32, 'triangle', 0.028, { lp: 2600 });
        }
        if (s % 4 === 2) this._mNoise(m, time, 0.05, 0.012, 7000);
        // Melodie in jeder zweiten Phrase: zufälliger, aber tonleitertreuer Verlauf
        if (Math.floor(bar / 4) % 2 === 1 && (s === 0 || s === 6 || s === 10) && Math.random() < 0.8) {
          const scale = [0, 2, 4, 7, 9, 12, 14, 16];
          m.mel = clamp((m.mel === undefined ? 3 : m.mel) + Math.floor(rnd(-2, 3)), 0, scale.length - 1);
          this._mNote(m, time, 60 + scale[m.mel], m.sec16 * (s === 10 ? 6 : 4), 'sine', 0.045, { attack: 0.02, sustain: true, release: 0.15 });
        }
      } else {
        const progs = [[[45, 0, 3, 7], [41, 0, 4, 7], [48, 0, 4, 7], [43, 0, 4, 7]], [[45, 0, 3, 7], [43, 0, 4, 7], [41, 0, 4, 7], [40, 0, 4, 7]]];
        const prog = progs[Math.floor(bar / 8) % progs.length];
        const ch = prog[bar % 4], root = ch[0];
        const fill = bar % 8 === 7;
        // weicher Akkordteppich (überlappend → kein Loch zwischen den Takten)
        if (s === 0) for (const iv of ch.slice(1)) this._mNote(m, time, root + 12 + iv, m.sec16 * 16 + 0.9, 'sawtooth', 0.009, { attack: 0.25, sustain: true, release: 0.9, lp: 900 });
        // Schlagzeug
        if (s % 4 === 0) this._mKick(m, time, 0.22);
        if (s === 4 || s === 12) { this._mNoise(m, time, 0.14, 0.09, 1800, 'bandpass', 0.9); this._mNote(m, time, 54, 0.08, 'triangle', 0.05); }
        if (fill && s >= 8 && s % 2 === 1) this._mNoise(m, time, 0.08, 0.05 + (s - 8) * 0.006, 2000, 'bandpass', 0.9);
        this._mNoise(m, time, s % 2 ? 0.03 : 0.05, s % 4 === 2 ? 0.03 : 0.016, 8000);
        // Bass: Achtel mit Oktavsprung
        if (s % 2 === 0) this._mNote(m, time, root - 12 + (s % 8 === 6 ? 12 : 0), m.sec16 * 1.8, 'sawtooth', 0.05, { lp: 520, q: 3 });
        // Akkord-Stabs auf den Off-Beats
        if (s === 2 || s === 10 || (s === 7 && bar % 2)) for (const iv of ch.slice(1)) this._mNote(m, time, root + 12 + iv, 0.16, 'square', 0.012, { lp: 2200 });
        // Leitmotiv alle 8 Takte in der zweiten Hälfte, mit Variation
        if (bar % 8 >= 4 && bar % 8 < 7 && (s === 0 || s === 3 || s === 6 || s === 10 || s === 12)) {
          const motif = [0, 3, 7, 10, 7, 12, 10, 7];
          const i = (s + bar * 3 + Math.floor(m.seed * 5)) % motif.length;
          this._mNote(m, time, 69 + motif[i] + (ch[2] === 4 ? 0 : 0), m.sec16 * 2.2, 'square', 0.025, { lp: 3200, attack: 0.01 });
        }
      }
    },

    /* ---------- gemeinsamer Takt für Musik & Atmosphäre ---------- */
    _tick() {
      if (!this.ctx || this.ctx.state !== 'running') return;
      const t = this.ctx.currentTime;
      this._musicTick(t);
      if (this.enabled) this._ambTick(t);
    },
  };

  GS.Audio = A;
})(window.GS = window.GS || {});

</script>
<script>
/* =====================================================================
   Benutzeroberfläche: Menüs, Garage, Fortschritt, Einstellungen,
   Ergebnisse, Cup-Übersicht und HUD. Reines DOM, keine Bibliotheken.
   ===================================================================== */
'use strict';
(function (GS) {
  const C = GS.CONFIG;
  const U = GS.U;
  const P = GS.Progress;
  const $ = (id) => document.getElementById(id);
  const D = () => GS.Save.data;

  function h(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    if (attrs) {
      for (const k in attrs) {
        const v = attrs[k];
        if (v === null || v === undefined || v === false) continue;
        if (k === 'class') e.className = v;
        else if (k === 'html') e.innerHTML = v;
        else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
        else e.setAttribute(k, v === true ? '' : v);
      }
    }
    for (const k of kids.flat()) {
      if (k === null || k === undefined || k === false) continue;
      e.appendChild(typeof k === 'string' || typeof k === 'number' ? document.createTextNode(String(k)) : k);
    }
    return e;
  }
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const LOCK = '<svg viewBox="0 0 16 16"><path d="M4 7V5a4 4 0 118 0v2h1v8H3V7h1zm2 0h4V5a2 2 0 10-4 0v2z"/></svg>';
  const coinHtml = (n) => '<i class="coin-ico"></i>' + U.fmt(n);
  const starStr = (n, max) => {
    let s = '';
    for (let i = 0; i < (max || 3); i++) s += '<span class="' + (i < n ? 'on' : '') + '">★</span>';
    return s;
  };

  const UI = {
    current: null,
    playTab: 'race',
    gIdx: 0,
    gTab: 'up',
    trackCache: new Map(),
    hudState: {},

    init(game) {
      this.game = game;
      this.screens = ['menu', 'play', 'garage', 'progress', 'settings', 'results', 'cup'];
      document.querySelectorAll('[data-go]').forEach((b) => b.addEventListener('click', () => {
        GS.Audio.unlock(); GS.Audio.click();
        this.show(b.getAttribute('data-go'));
      }));
      $('play-tabs').addEventListener('click', (e) => {
        const b = e.target.closest('button[data-tab]');
        if (!b) return;
        this.playTab = b.getAttribute('data-tab');
        GS.Audio.click();
        this.renderPlay();
      });
      $('g-tabs').addEventListener('click', (e) => {
        const b = e.target.closest('button[data-tab]');
        if (!b) return;
        this.gTab = b.getAttribute('data-tab');
        GS.Audio.click();
        this.renderGarage();
      });
      $('g-prev').addEventListener('click', () => { this.gIdx = (this.gIdx + C.vehicles.length - 1) % C.vehicles.length; GS.Audio.nav(); this.renderGarage(); });
      $('g-next').addEventListener('click', () => { this.gIdx = (this.gIdx + 1) % C.vehicles.length; GS.Audio.nav(); this.renderGarage(); });
      $('btn-pause').addEventListener('click', () => game.togglePause());
      $('btn-pause').addEventListener('pointerdown', (e) => e.stopPropagation());
      $('btn-reset').addEventListener('click', () => { GS.Audio.click(); game.session && game.session.requestReset(); });
      $('p-resume').addEventListener('click', () => { GS.Audio.click(); game.resume(); });
      $('p-restart').addEventListener('click', () => { GS.Audio.click(); game.restart(); });
      $('p-menu').addEventListener('click', () => { GS.Audio.click(); game.quitFromPause(); });
      this.gCanvas = $('garage-canvas');
      this.gCtx = this.gCanvas.getContext('2d');
      this.gTime = 0;
    },

    /* ---------------- Navigation ---------------- */
    show(name) {
      for (const s of this.screens) $('scr-' + s).hidden = s !== name;
      this.current = name;
      if (name === 'menu') this.renderMenu();
      if (name === 'play') this.renderPlay();
      if (name === 'garage') { this.gIdx = Math.max(0, C.vehicles.findIndex((v) => v.id === D().selected)); this.renderGarage(); }
      if (name === 'progress') this.renderProgress();
      if (name === 'settings') this.renderSettings();
      this.wallet();
      if (this.game) this.game.onScreen(name);
    },
    hideScreens() {
      for (const s of this.screens) $('scr-' + s).hidden = true;
      this.current = null;
    },
    wallet() {
      const html = '<span class="chip">' + coinHtml(D().coins) + '</span><span class="chip"><i class="star-ico">★</i>' + P.stars() + '/' + P.maxStars() + '</span>';
      document.querySelectorAll('.wallet').forEach((w) => { w.innerHTML = html; });
    },

    renderMenu() {
      const v = GS.VP.def(D().selected);
      $('menu-vehicle').textContent = v.name + ' · ' + v.klass;
    },

    /* ---------------- Spielen ---------------- */
    trackFor(key, def) {
      if (!this.trackCache.has(key)) this.trackCache.set(key, new GS.Track(Object.assign({ mode: 'race' }, def)));
      return this.trackCache.get(key);
    },
    profileSvg(track, dim) {
      const pts = track.profile(48);
      let lo = Infinity, hi = -Infinity;
      for (const p of pts) { lo = Math.min(lo, p); hi = Math.max(hi, p); }
      const span = Math.max(8, hi - lo);
      const y = (p) => (28 - ((p - lo) / span) * 24).toFixed(2);
      let d = 'M0 ' + y(pts[0]);
      pts.forEach((p, i) => { d += ' L' + ((i / (pts.length - 1)) * 100).toFixed(2) + ' ' + y(p); });
      const col = dim ? '#5b7680' : '#ffc629';
      return '<svg class="profile" viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true">' +
        '<path d="' + d + ' L100 30 L0 30 Z" fill="' + col + '" fill-opacity="0.14"/>' +
        '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>';
    },
    renderPlay() {
      document.querySelectorAll('#play-tabs button').forEach((b) => b.setAttribute('aria-selected', String(b.getAttribute('data-tab') === this.playTab)));
      // KI-Stärke wird automatisch aus dem Fortschritt bestimmt
      $('ai-seg').innerHTML = '<span class="ai-note">Gegner passen sich deinem Fortschritt an</span>';
      const list = $('play-list');
      list.innerHTML = '';
      list.scrollTop = 0;
      if (this.playTab === 'race') {
        for (const t of C.tracks) {
          const unlocked = P.trackUnlocked(t);
          const tr = this.trackFor('t:' + t.id, { env: t.env, seed: t.seed, length: t.length, difficulty: t.difficulty });
          const stars = D().stars.tracks[t.id] || 0;
          const best = D().best.tracks[t.id];
          const card = h('button', { class: 'card' + (unlocked ? '' : ' locked'), 'aria-disabled': unlocked ? null : 'true' });
          card.innerHTML =
            '<div class="row"><span class="env">' + esc(C.environments[t.env].name) + ' · Stufe ' + t.tier + '</span>' + (unlocked ? '<span class="stars">' + starStr(stars) + '</span>' : '') + '</div>' +
            '<h3>' + esc(t.name) + '</h3>' + this.profileSvg(tr, !unlocked) +
            '<div class="meta"><span><b>' + U.fmt(tr.length) + '</b> m</span><span>Steigung bis <b>' + Math.round(tr.maxGradient() * 100) + ' %</b></span>' +
            (best ? '<span>Bestzeit <b>' + U.fmtTime(best) + '</b></span>' : '') + '</div>' +
            (unlocked ? '' : '<span class="lock">' + LOCK + 'ab ' + t.reqStars + ' ★</span>');
          card.addEventListener('click', () => {
            if (!unlocked) { GS.Audio.error(); this.toast('Diese Strecke wird mit <b>' + t.reqStars + ' ★</b> freigeschaltet. Sterne gibt es für Top-3-Plätze.'); return; }
            GS.Audio.unlock(); GS.Audio.click();
            this.game.startRace(t);
          });
          list.appendChild(card);
        }
      } else if (this.playTab === 'cups') {
        for (const c of C.cups) {
          const unlocked = P.cupUnlocked(c);
          const stars = D().stars.cups[c.id] || 0;
          const run = D().cupRun && D().cupRun.id === c.id ? D().cupRun : null;
          const card = h('button', { class: 'card' + (unlocked ? '' : ' locked') });
          card.innerHTML =
            '<div class="row"><span class="env">4 Rennen · Punktewertung</span>' + (unlocked ? '<span class="stars">' + starStr(stars) + '</span>' : '') + '</div>' +
            '<h3>' + esc(c.name) + '</h3>' +
            '<div class="envchips">' + c.races.map((r) => '<span>' + esc(C.environments[r.env].name) + '</span>').join('') + '</div>' +
            '<div class="meta"><span>Siegprämie <b>' + U.fmt(Math.round(c.reward * P.aiBase().rewardMul / 10) * 10) + '</b> Münzen</span>' + (run ? '<span>Läuft: <b>Rennen ' + (run.idx + 1) + '/' + c.races.length + '</b></span>' : '') + '</div>' +
            (unlocked ? '' : '<span class="lock">' + LOCK + 'ab ' + c.reqStars + ' ★</span>');
          card.addEventListener('click', () => {
            if (!unlocked) { GS.Audio.error(); this.toast('Dieser Cup wird mit <b>' + c.reqStars + ' ★</b> freigeschaltet.'); return; }
            GS.Audio.unlock(); GS.Audio.click();
            this.game.openCup(c);
          });
          list.appendChild(card);
        }
      } else {
        for (const envId of Object.keys(C.environments)) {
          const env = C.environments[envId];
          const unlocked = P.envUnlocked(envId);
          const rec = D().records[envId];
          const req = Math.min.apply(null, C.tracks.filter((t) => t.env === envId).map((t) => t.reqStars));
          const tr = this.trackFor('a:' + envId, { env: envId, seed: 900 + envId.length * 13, length: Infinity });
          const card = h('button', { class: 'card' + (unlocked ? '' : ' locked') });
          card.innerHTML =
            '<div class="row"><span class="env">Endlos · Distanz</span>' + (rec && rec.dist > 0 ? '<span class="grade">' + U.fmt(rec.dist) + ' m</span>' : '') + '</div>' +
            '<h3>' + esc(env.name) + '</h3>' + this.profileSvg(tr, !unlocked) +
            '<div class="meta"><span>Rekord <b>' + (rec ? U.fmt(rec.dist) : 0) + ' m</b></span><span>Punkte <b>' + (rec ? U.fmt(rec.score) : 0) + '</b></span></div>' +
            (unlocked ? '' : '<span class="lock">' + LOCK + 'ab ' + req + ' ★</span>');
          card.addEventListener('click', () => {
            if (!unlocked) { GS.Audio.error(); this.toast('Diese Umgebung wird mit <b>' + req + ' ★</b> freigeschaltet.'); return; }
            GS.Audio.unlock(); GS.Audio.click();
            this.game.startAdventure(envId);
          });
          list.appendChild(card);
        }
      }
    },

    /* ---------------- Garage ---------------- */
    renderGarage() {
      const def = C.vehicles[this.gIdx];
      const owned = P.owned(def.id);
      const unlocked = P.vehicleUnlocked(def);
      const selected = D().selected === def.id;
      $('g-title').textContent = def.name;
      $('g-class').textContent = def.klass;
      $('g-desc').textContent = def.desc;
      const pm = $('g-pm');
      pm.innerHTML = '';
      if (def.plus) pm.appendChild(h('p', { class: 'pm plus' }, h('b', null, '+'), def.plus));
      if (def.minus) pm.appendChild(h('p', { class: 'pm minus' }, h('b', null, '−'), def.minus));
      const dots = $('g-dots');
      dots.innerHTML = '';
      C.vehicles.forEach((v, i) => dots.appendChild(h('i', { class: (i === this.gIdx ? 'on' : '') + (P.owned(v.id) ? ' own' : '') })));
      const act = $('g-action');
      act.innerHTML = '';
      if (owned) {
        if (selected) act.appendChild(h('button', { class: 'btn', disabled: true }, 'Ausgewählt'));
        else act.appendChild(h('button', { class: 'sign', onclick: () => { P.select(def.id); GS.Audio.select(); this.game.onVehicleChanged(); this.renderGarage(); } }, h('span', null, 'Auswählen')));
        act.appendChild(h('span', { class: 'note' }, 'Fahrzeug ' + (C.vehicles.indexOf(def) + 1) + ' von ' + C.vehicles.length));
      } else if (unlocked) {
        const afford = D().coins >= def.price;
        const b = h('button', { class: 'sign', disabled: !afford, onclick: () => {
          if (P.buyVehicle(def.id)) { GS.Audio.purchase(); this.toast('<b>' + esc(def.name) + '</b> gekauft und ausgewählt.'); this.game.onVehicleChanged(); this.game.checkAchievements(); this.wallet(); this.renderGarage(); }
        } });
        b.innerHTML = '<span>Kaufen · ' + U.fmt(def.price) + '</span>';
        act.appendChild(b);
        if (!afford) act.appendChild(h('span', { class: 'note' }, 'Dir fehlen ' + U.fmt(def.price - D().coins) + ' Münzen'));
      } else {
        act.appendChild(h('span', { class: 'chip', html: LOCK.replace('<svg', '<svg width="14" height="14" fill="currentColor"') + ' Freischaltung ab ' + def.reqStars + ' ★' }));
        act.appendChild(h('span', { class: 'note' }, 'Preis danach: ' + U.fmt(def.price) + ' Münzen'));
      }
      document.querySelectorAll('#g-tabs button').forEach((b) => b.setAttribute('aria-selected', String(b.getAttribute('data-tab') === this.gTab)));
      const box = $('g-content');
      box.innerHTML = '';
      if (this.gTab === 'up') {
        if (!owned) box.appendChild(h('p', { class: 'g-desc' }, 'Upgrades gibt es für Fahrzeuge in deinem Besitz. Jede Stufe verändert die echte Fahrphysik.'));
        const lv = P.levels(def.id);
        for (const cat of C.upgrades.categories) {
          const level = owned ? lv[cat.id] : 1;
          const cost = owned ? P.upgradeCost(def.id, cat.id) : null;
          const row = h('div', { class: 'up-row' });
          const pips = h('div', { class: 'pips', 'aria-label': 'Stufe ' + level + ' von ' + C.upgrades.maxLevel });
          for (let i = 1; i <= C.upgrades.maxLevel; i++) pips.appendChild(h('i', { class: i <= level ? 'on' : '' }));
          row.appendChild(h('h4', null, cat.name + ' · Stufe ' + level));
          let btn;
          if (!owned) btn = h('button', { class: 'btn small up-buy', disabled: true }, '–');
          else if (cost === null) btn = h('button', { class: 'btn small up-buy', disabled: true }, 'Max');
          else {
            btn = h('button', { class: 'btn small up-buy', disabled: D().coins < cost, html: '▲ ' + coinHtml(cost), onclick: () => {
              if (P.buyUpgrade(def.id, cat.id)) {
                GS.Audio.upgrade();

    /** Garage-Vorschau zeichnen (aus der Spielschleife) */
    garageFrame(dt) {
      if (this.current !== 'garage') return;
      this.gTime += dt;
      const cv = this.gCanvas;
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const w = cv.clientWidth, hh = cv.clientHeight;
      if (!w || !hh) return;
      if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(hh * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(hh * dpr); }
      const ctx = this.gCtx;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, hh);
      const def = C.vehicles[this.gIdx];
      const unlocked = P.vehicleUnlocked(def);
      const xs = def.wheels.map((q) => q.x);
      let pMinX = Infinity, pMaxX = -Infinity, pMaxY = -Infinity;
      for (const pg of def.chassis.parts.concat(def.chassis.crash)) for (const q of pg) { pMinX = Math.min(pMinX, q[0]); pMaxX = Math.max(pMaxX, q[0]); pMaxY = Math.max(pMaxY, q[1]); }
      if (def.head) pMaxY = Math.max(pMaxY, def.head.y + def.head.r);
      for (const sk of def.chassis.skids || []) pMinX = Math.min(pMinX, sk.x - sk.r);
      const minX = Math.min(-1.9, Math.min.apply(null, xs) - 0.9, pMinX - 0.3), maxX = Math.max(1.9, Math.max.apply(null, xs) + 0.9, pMaxX + 0.3);
      const top = Math.max(def.look === 'monster' ? 1.7 : 1.45, pMaxY + 0.2);
      const bottom = Math.min.apply(null, def.wheels.map((q) => q.y - q.r));
      const s = Math.min((w * 0.78) / (maxX - minX), (hh * 0.62) / (top - bottom));
      const groundY = hh * 0.8;
      const cx = w / 2 - ((minX + maxX) / 2) * s;
      const bob = Math.sin(this.gTime * 2.2) * 0.012;
      // Vorschau-Fahrzeug
      ctx.save();
      ctx.translate(cx, groundY + bottom * s - bob * s);
      ctx.scale(s, -s);
      const spin = -this.gTime * 0.8;
      const wheels = def.wheels.map((q) => ({ x: q.x, y: q.y + bob, rot: spin }));
      GS.drawVehicleLocal(ctx, def, wheels, { helmet: '#ffc629' });
      ctx.restore();
      if (!unlocked) {
        ctx.globalCompositeOperation = 'source-atop';
        ctx.fillStyle = 'rgba(14,24,30,0.92)';
        ctx.fillRect(0, 0, w, hh);
        ctx.globalCompositeOperation = 'source-over';
      }
      // Boden mit Höhenlinien
      ctx.globalCompositeOperation = 'destination-over';
      ctx.strokeStyle = 'rgba(255,198,41,0.16)';
      ctx.lineWidth = 1;
      for (let i = 0; i < 6; i++) {
        ctx.beginPath();
        ctx.ellipse(w / 2, groundY + 4, w * (0.12 + i * 0.07), 7 + i * 5, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath(); ctx.ellipse(w / 2, groundY + 2, (maxX - minX) * s * 0.48, 9, 0, 0, Math.PI * 2); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    },

    /* ---------------- Fortschritt ---------------- */
    renderProgress() {
      const body = $('progress-body');
      body.innerHTML = '';
      const st = P.stars(), mx = P.maxStars();
      const items = [];
      for (const t of C.tracks) items.push({ req: t.reqStars, name: 'Strecke ' + t.name, kind: C.environments[t.env].name });
      for (const c of C.cups) items.push({ req: c.reqStars, name: c.name, kind: 'Cup' });
      for (const v of C.vehicles) if (v.reqStars > 0) items.push({ req: v.reqStars, name: v.name, kind: v.klass + ' · ' + U.fmt(v.price) + ' Münzen' });
      items.sort((a, b) => a.req - b.req);
      const next = items.find((i) => i.req > st);
      const top = h('div', { class: 'panel' });
      top.innerHTML = '<div class="star-big"><span class="star-ico">★</span>' + st + '<small>von ' + mx + ' Sternen</small></div>' +
        '<div class="meter"><i style="width:' + Math.round((st / mx) * 100) + '%"></i></div>' +
        '<p class="g-desc" style="margin-top:8px">' + (next ? 'Nächste Freischaltung: <b>' + esc(next.name) + '</b> bei ' + next.req + ' ★.' : 'Alles freigeschaltet.') +
        ' Sterne gibt es für Platz 1–3 in Rennen (3/2/1) und in Cups.</p>';
      body.appendChild(top);

      body.appendChild(h('h3', null, 'Freischaltungen'));
      const ul = h('div', { class: 'list' });
      for (const i of items) {
        const done = st >= i.req;
        ul.appendChild(h('div', { class: 'li' + (done ? ' done' : ''), html:
          '<span class="t">' + esc(i.name) + '</span><span class="r">' + (done ? 'frei' : i.req + ' ★') + '</span><span class="d">' + esc(i.kind) + '</span>' }));
      }
      body.appendChild(ul);

      body.appendChild(h('h3', null, 'Rekorde'));

      }
      for (const env of Object.keys(C.environments)) {
        const r = D().records[env];

      }
      if (!rl.children.length) rl.appendChild(h('p', { class: 'g-desc' }, 'Noch keine Rekorde. Fahr dein erstes Rennen!'));
      body.appendChild(rl);

      body.appendChild(h('h3', null, 'Leistungen'));
      const al = h('div', { class: 'list' });
      for (const a of C.achievements) {
        const done = !!D().achievements[a.id];
        const v = Math.min(a.goal, P.statValue(a.stat));
        const pct = Math.round((v / a.goal) * 100);
        al.appendChild(h('div', { class: 'li' + (done ? ' done' : ''), html:
          '<span class="t">' + esc(a.name) + '</span><span class="r">' + (done ? '✓' : '+' + U.fmt(a.reward)) + '</span><span class="d">' + esc(a.desc) + '</span>' +

        const tr = session.track;
        for (const cx of tr.checkpoints) cps.appendChild(h('i', { style: 'left:calc((100% - 14px) * ' + ((cx - tr.startX) / tr.length).toFixed(4) + ')' }));
        const marks = document.querySelector('#hud-track .ht-marks');
        marks.innerHTML = '';
        hs.marks = session.racers.map((r) => {
          const m = h('i', { class: r.isPlayer ? 'me' : '', style: r.isPlayer ? '' : 'background:' + r.color });
          marks.appendChild(m);
          return m;
        });
        // Spieler-Markierung zuletzt (oben)
        const meIdx = session.racers.findIndex((r) => r.isPlayer);
        if (meIdx >= 0) marks.appendChild(hs.marks[meIdx]);
        hs.trackW = $('hud-track').clientWidth - 14;
      } else {
        const rec = D().records[session.track.envId];
        $('hud-dist').querySelector('small').textContent = rec && rec.dist > 0 ? 'Rekord ' + U.fmt(rec.dist) + ' m' : '';
      }
      // Tacho: Bögen einmalig berechnen (Drehzahl 0..1 → −115°..+115°)
      const arc = (a0, a1) => {
        const p = (r) => { const a = ((-115 + 230 * r) * Math.PI) / 180; return (60 + 46 * Math.sin(a)).toFixed(1) + ' ' + (60 - 46 * Math.cos(a)).toFixed(1); };
        return 'M' + p(a0) + ' A46 46 0 ' + ((a1 - a0) * 230 > 180 ? 1 : 0) + ' 1 ' + p(a1);
      };
      const g = $('hud-gauge');
      g.querySelector('.g-arc').setAttribute('d', arc(0, 1));
      g.querySelector('.g-band').setAttribute('d', arc(C.launch.band[0], C.launch.band[1]));
      g.querySelector('.g-red').setAttribute('d', arc(0.9, 1));
      hs.gauge = { el: g, needle: g.querySelector('.g-needle'), spd: g.querySelector('.g-spd b'), fuel: g.querySelector('.g-fuel i'), a: null, v: -1, f: -1, cls: '' };
      hs.air = $('hud-air'); hs.airOn = false;
      this.pedals(false, false);
    },
    hudHide() {
      $('hud').hidden = true;
      $('controls').hidden = true;
      $('hud-tip').hidden = true;
    },
    hudResize() {
      if (this.hudState) this.hudState.trackW = $('hud-track').clientWidth - 14;
    },
    pedals(g, b) {
      const hs = this.hudState;
      if (hs.g !== g) { document.querySelector('.pedal.gas').classList.toggle('on', g); hs.g = g; }
      if (hs.b !== b) { document.querySelector('.pedal.brake').classList.toggle('on', b); hs.b = b; }
    },
    hudUpdate(session, dt) {
      const hs = this.hudState;
      const p = session.player;
      if (!p) return;
      // Tacho: im Countdown die Startdrehzahl, sonst die Motordrehzahl
      const G = hs.gauge, v = p.vehicle;
      const cd = session.state === 'countdown';
      const rpm = cd ? v.launchRpm : U.clamp(v.rpm, 0, 1.05);
      const ang = Math.round((-115 + 230 * Math.min(rpm, 1)) * 2) / 2;
      if (ang !== G.a) { G.a = ang; G.needle.setAttribute('transform', 'rotate(' + ang + ' 60 60)'); }
      const kmh = Math.round(v.speed * 3.6);
      if (kmh !== G.v) { G.v = kmh; G.spd.textContent = kmh; }
      const f = Math.round(p.fuel * 100);
      if (f !== G.f) { G.f = f; G.fuel.style.transform = 'scaleX(' + (f / 100).toFixed(2) + ')'; }
      const L = C.launch;
      const cls = (cd ? 'launch ' : '') + (cd && rpm >= L.band[0] && rpm <= L.band[1] ? 'inband ' : '') + (rpm > 0.9 ? 'over ' : '') + (p.fuel < C.fuel.warn ? 'low' : '');
      if (cls !== G.cls) { G.cls = cls; G.el.className = 'gauge ' + cls; }
      // Flugzeit live
      const airT = v.inAir && !v.crashed ? v.airTimer : 0;
      if (airT > 0.7) { hs.air.textContent = 'Flugzeit ' + airT.toFixed(1).replace('.', ',') + ' s'; if (!hs.airOn) { hs.airOn = true; hs.air.classList.add('on'); } }
      else if (hs.airOn) { hs.airOn = false; hs.air.classList.remove('on'); }
      if (p.stats.coinValue !== hs.coins) { hs.coins = p.stats.coinValue; $('hud-coins').querySelector('b').textContent = U.fmt(hs.coins); }
      if (session.isRace) {
        const tr = session.track;
        const W = hs.trackW || 100;
        session.racers.forEach((r, i) => {
          const f = U.clamp((r.vehicle.x - tr.startX) / tr.length, 0, 1);
          hs.marks[i].style.transform = 'translateX(' + (f * W).toFixed(1) + 'px)';
        });
        if (p.place !== hs.pos) { hs.pos = p.place; $('hud-pos').querySelector('b').textContent = p.place; }
        hs.gapT -= dt;
        if (hs.gapT <= 0) {
          hs.gapT = 0.25;
          let txt = '';
          if (session.state === 'running' && session.order) {
            const idx = session.order.indexOf(p);
            const ahead = session.order[idx - 1];
            const behind = session.order[idx + 1];
            if (ahead && !ahead.finished) txt = U.fmt(Math.max(0, ahead.vehicle.x - p.vehicle.x)) + ' m hinter ' + ahead.name.split(' ')[0];
            else if (ahead && ahead.finished) txt = ahead.name.split(' ')[0] + ' ist im Ziel';
            else if (behind) txt = U.fmt(Math.max(0, p.vehicle.x - behind.vehicle.x)) + ' m vor ' + behind.name.split(' ')[0];
          }
          $('hud-gap').textContent = txt;
        }
        const stuck = session.playerStuck && session.state === 'running';
        if (stuck !== hs.stuck) { hs.stuck = stuck; $('btn-reset').hidden = !stuck; }
      } else {
        const d = Math.floor(session.distance());
        if (d !== hs.dist) { hs.dist = d; $('hud-dist').querySelector('b').textContent = U.fmt(d); }
        const idle = session.time - p.lastProgress;
        const warn = session.state === 'running' && !p.vehicle.crashed && idle > C.adventure.stuckTime - 5;
        if (warn) this.center('<span class="msg">Festgefahren?</span><span class="why">Fahrt endet in ' + Math.max(0, Math.ceil(C.adventure.stuckTime - idle)) + ' s – zurückrollen und Schwung holen</span>', 'stuck');
        else if (hs.centerKind === 'stuck') this.center('', null);
      }
    },
    center(html, kind) {
      const el = $('hud-center');
      if (this.hudState.centerKind === kind && kind === 'stuck') { el.firstChild && (el.innerHTML = html); return; }
      el.innerHTML = html;
      this.hudState.centerKind = kind;
      if (this._centerTimer) clearTimeout(this._centerTimer);
      if (kind && kind !== 'stuck' && kind !== 'sticky') this._centerTimer = setTimeout(() => { if (this.hudState.centerKind === kind) { el.innerHTML = ''; this.hudState.centerKind = null; } }, kind === 'count' ? 950 : 1700);
    },
    pop(parts, total) {
      const box = $('hud-pop');
      while (box.children.length > 3) box.removeChild(box.firstChild);
      const head = parts[0];
      const el = h('div', { class: 'pop', html: esc(head.label) + '<small>+' + U.fmt(total) + '</small>' });
      box.appendChild(el);
      for (let i = 1; i < parts.length; i++) box.appendChild(h('div', { class: 'pop sub', html: esc(parts[i].label) }));
      setTimeout(() => { for (const c of Array.from(box.children)) if (c === el || c.classList.contains('sub')) c.remove(); }, 1650);
    },
    popText(text) {
      const box = $('hud-pop');
      while (box.children.length > 3) box.removeChild(box.firstChild);
      const el = h('div', { class: 'pop sub', html: text });
      box.appendChild(el);
      setTimeout(() => el.remove(), 1650);
    },
    tip(html, ms) {
      const t = $('hud-tip');
      if (!html) { t.hidden = true; return; }
      t.innerHTML = html;
      t.hidden = false;
      if (this._tipTimer) clearTimeout(this._tipTimer);
      this._tipTimer = setTimeout(() => { t.hidden = true; }, ms || 5000);
    },
    toast(html) {
      const box = $('toasts');
      while (box.children.length > 2) box.removeChild(box.firstChild);
      const el = h('div', { class: 'toast', html });
      box.appendChild(el);
      setTimeout(() => el.remove(), 3300);
    },
  };

  GS.UI = UI;
})(window.GS = window.GS || {});

</script>
<script>
/* =====================================================================
   Spielsteuerung: Game Loop (fester Physik-Zeitschritt), Zustände,
   Rennen/Cup/Adventure starten und auswerten, Ereignisse → UI/Audio.
   ===================================================================== */
'use strict';
(function (GS) {
  const C = GS.CONFIG;
  const U = GS.U;
  const P = GS.Progress;
  const D = () => GS.Save.data;
  const $ = (id) => document.getElementById(id);

  const Game = {
    session: null,      // aktives Rennen / Adventure
    attract: null,      // Menü-Hintergrund
    ctx: null,          // was läuft: { kind: 'race'|'cup'|'adventure', ... }
    cup: null,
    paused: false,
    resultShown: false,
    acc: 0,
    last: 0,

    init() {
      GS.Save.load();
      GS.Audio.init(D().settings);
      GS.Audio.setLowPower(D().settings.quality === 'low');
      this.canvas = $('game');
      this.renderer = new GS.Renderer(this.canvas);
      this.cam = new GS.Camera();
      GS.Input.attach($('controls'));
      GS.Input.onPause = () => { if (this.session && this.session.state !== 'done') this.togglePause(); };
      GS.Input.onConfirm = () => {
        const b = document.querySelector('.screen:not([hidden]) #res-next');
        if (b) b.click();
      };
      GS.UI.init(this);
      // Stand wurde in einem anderen Tab gespeichert → Anzeige aktualisieren
      GS.Save.onExternalChange = () => {
        GS.Audio.setEnabled(D().settings.sound); GS.Audio.setVolume(D().settings.volume);
        GS.Audio.setMusicVolume(D().settings.musicVolume); GS.Audio.setSfxVolume(D().settings.sfxVolume);
        const cur = GS.UI.current;
        if (cur && ['menu', 'play', 'garage', 'progress', 'settings'].includes(cur)) GS.UI.show(cur); else GS.UI.wallet();
      };
      this.applyQuality();
      const onResize = () => this.resize();
      window.addEventListener('resize', onResize);
      window.addEventListener('orientationchange', () => setTimeout(onResize, 120));
      if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          GS.Save.flush();
          if (this.session && this.session.state !== 'done' && !this.paused) this.pause();
          GS.Audio.engineStop();
        }
      });
      window.addEventListener('pagehide', () => GS.Save.flush());
      this.resize();
      this.startAttract();
      GS.UI.show('menu');
      if (GS.Save.status === 'aus-backup') GS.UI.toast('Der Spielstand war beschädigt – die letzte Sicherung wurde geladen.');
      else if (GS.Save.status === 'defekt-gesichert') GS.UI.toast('Der Spielstand war nicht lesbar und wurde gesichert. Neuer Spielstand gestartet.');
      this.checkAchievements();
      requestAnimationFrame((t) => this.loop(t));
    },

    applyQuality() {
      this.renderer.quality = D().settings.quality;
      GS.Audio.setLowPower(D().settings.quality === 'low');
      this.resize();
    },
    resize() {
      const w = Math.max(1, window.innerWidth), h = Math.max(1, window.innerHeight);
      const maxDpr = D().settings.quality === 'low' ? 1.25 : 2;
      const dpr = Math.min(maxDpr, window.devicePixelRatio || 1);
      this.canvas.style.width = w + 'px';
      this.canvas.style.height = h + 'px';
      this.renderer.resize(w, h, dpr);
      this.cam.resize(w, h);
      GS.UI.hudResize();
    },
    toggleFullscreen() {
      try {
        const el = document.documentElement;
        if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
        else {
          const r = (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
          if (r && r.catch) r.catch(() => GS.UI.toast('Vollbild ist hier nicht verfügbar.'));
        }
      } catch (e) { GS.UI.toast('Vollbild ist hier nicht verfügbar.'); }
    },
    inRace() { return !!this.session && !this.paused && this.session.state !== 'done'; },

    /* ---------------- Menü-Hintergrund ---------------- */
    startAttract() {
      const envs = Object.keys(C.environments).filter((e) => P.envUnlocked(e));
      const env = envs[Math.floor(Math.random() * envs.length)] || 'meadow';
      const vid = D().selected;
      this.attract = new GS.Session({
        mode: 'attract',
        track: { env, seed: 1 + Math.floor(Math.random() * 9999), length: Infinity },
        player: { vehicleId: vid, levels: P.levels(vid) },
      });
      this.attractAge = 0;
      this.cam.ready = false;
      this.renderer.clearParticles();
      if (!this.session) { GS.Audio.setAmbience(env, 0.45); GS.Audio.setMusic('menu'); }
    },
    onVehicleChanged() {
      if (!this.session) this.startAttract();
      GS.UI.renderMenu();
    },
    onScreen(name) {
      if (name === 'menu' && !this.session && !this.attract) this.startAttract();
    },

    /* ---------------- Starten ---------------- */
    _begin(cfg, ctx) {
      this.session = new GS.Session(cfg);
      this.ctx = ctx;
      this.paused = false;
      this.resultShown = false;
      this.acc = 0;
      this.attract = null;
      $('ovl-pause').hidden = true;
      GS.UI.hideScreens();
      GS.UI.hudSetup(this.session);
      GS.Input.reset();
      this.renderer.clearParticles();
      this.cam.ready = false;
      GS.Audio.unlock();
      GS.Audio.stopDrive();
      GS.Audio.setPaused(false);
      GS.Audio.setMusic('race');
      GS.Audio.setAmbience(this.session.track.envId, 1);
      this.lastPlace = null; this.placeT = 0;
      const st = D().settings;
      if (st.hints || !D().tutorialSeen) {
        GS.UI.tip(cfg.mode === 'race'
          ? '<b>Rechts halten</b> = Gas · <b>Links halten</b> = Bremse/Rückwärts<br>Vor dem Start: Drehzahl im <b>grünen Bereich</b> halten. In der Luft ausbalancieren, sauber landen.'
          : 'Fahr so weit du kannst – <b>Kanister</b> füllen den Tank. <b>Kopf am Boden</b> beendet die Fahrt.<br>Startdrehzahl im grünen Bereich · in der Luft ausbalancieren', D().tutorialSeen ? 4200 : 7000);
      }
    },
    startRace(track) {
      const opponents = P.opponentsFor(track.opponents, track.seed);
      const vid = D().selected;
      this._begin({
        mode: 'race',
        track: { env: track.env, seed: track.seed, length: track.length, difficulty: track.difficulty },
        player: { vehicleId: vid, levels: P.levels(vid) },
        opponents,
      }, { kind: 'race', track, opponents });
    },
    startAdventure(env) {
      const vid = D().selected;
      this._begin({
        mode: 'adventure',
        track: { env, seed: 900 + env.length * 13, length: Infinity },
        player: { vehicleId: vid, levels: P.levels(vid) },
      }, { kind: 'adventure', env });
    },
    openCup(def) {
      const run = D().cupRun;
      if (run && run.id === def.id) {
        // gespeicherten Cup-Fortschritt fortsetzen (z. B. nach Neuladen)
        this.cup = {
          def, idx: run.idx, opponents: run.opponents, points: Object.assign({}, run.points), places: run.places.slice(),
          lastOrder: run.lastOrder.slice(), final: false, playerName: '__du__',
          names: ['__du__'].concat(run.opponents.map((o) => o.name)),
        };
        GS.UI.toast('Cup wird fortgesetzt: <b>Rennen ' + (run.idx + 1) + ' von ' + def.races.length + '</b>');
        GS.UI.showCup(this.cup);
        return;
      }
      const seed = def.races[0].seed;
      const opponents = P.opponentsFor(def.opponents, seed);
      this.cup = {
        def, idx: 0, opponents, points: {}, places: [], final: false, playerName: '__du__',
        names: ['__du__'].concat(opponents.map((o) => o.name)),
      };
      GS.UI.showCup(this.cup);
    },
    /** Cup-Fortschritt im Spielstand ablegen bzw. löschen */
    _storeCupRun() {
      const cup = this.cup;
      D().cupRun = cup && !cup.final && cup.idx > 0
        ? { id: cup.def.id, idx: cup.idx, opponents: cup.opponents, points: cup.points, places: cup.places, lastOrder: cup.lastOrder || [] }
        : null;
      GS.Save.save();
    },
    _clearCupRun() { if (D().cupRun) { D().cupRun = null; GS.Save.save(); } },
    showCup() { if (this.cup) GS.UI.showCup(this.cup); else this.toMenu('play'); },
    startCupRace() {
      const cup = this.cup;
      if (!cup || cup.final) return;
      const r = cup.def.races[cup.idx];
      const vid = D().selected;
      this._begin({
        mode: 'race',
        track: { env: r.env, seed: r.seed, length: r.length, difficulty: r.difficulty, obstacles: 'cup' },
        player: { vehicleId: vid, levels: P.levels(vid) },
        opponents: cup.opponents,
      }, { kind: 'cup', race: r });
    },
    abortCup() { this.cup = null; this._clearCupRun(); this.toMenu('play'); },

    restart() {
      const c = this.ctx;
      if (!c) return;
      if (c.kind === 'race') this.startRace(c.track);
      else if (c.kind === 'adventure') this.startAdventure(c.env);
      else if (c.kind === 'cup') this.startCupRace();
    },

    /* ---------------- Pause / Verlassen ---------------- */
    pause() {
      if (!this.session || this.session.state === 'done') return;
      this.paused = true;
      GS.Input.reset();
      GS.Audio.setPaused(true);
      $('ovl-pause').hidden = false;
      $('p-menu').textContent = this.ctx && this.ctx.kind === 'cup' ? 'Cup abbrechen' : (this.ctx && this.ctx.kind === 'adventure' ? 'Fahrt beenden' : 'Zum Menü');
    },
    resume() {
      this.paused = false;
      GS.Audio.setPaused(false);
      this.acc = 0;
      $('ovl-pause').hidden = true;
    },
    togglePause() { if (this.paused) this.resume(); else this.pause(); },
    quitFromPause() {
      $('ovl-pause').hidden = true;
      this.paused = false;
      if (this.ctx && this.ctx.kind === 'adventure' && this.session && this.session.distance() > 1) {
        // Adventure: Fahrt regulär beenden, Münzen bleiben erhalten
        this.session.endReason = 'quit';
        this.session.state = 'done';
        return;
      }
      if (this.ctx && this.ctx.kind === 'cup') { this.cup = null; this._clearCupRun(); }
      this.toMenu('menu');
    },
    toMenu(screen) {
      this.session = null;
      this.ctx = null;
      this.paused = false;
      GS.Audio.stopDrive();
      GS.Audio.setPaused(false);
      GS.UI.hudHide();
      $('ovl-pause').hidden = true;
      this.startAttract();
      GS.UI.show(screen || 'menu');
    },
    toGarage() { this.toMenu('garage'); },

    /* ---------------- Auswertung ---------------- */
    onSessionDone() {
      this.resultShown = true;
      GS.Audio.stopDrive();
      GS.Audio.setMusic('menu');
      GS.UI.hudHide();
      const s = this.session;
      const res = s.result();
      const c = this.ctx;
      if (c.kind === 'race') {
        const applied = P.applyRace(c.track, res);
        GS.UI.showRaceResult({ res, applied, title: c.track.name });
      } else if (c.kind === 'cup') {
        const cup = this.cup;
        const applied = P.applyCupRace(res);
        // Punkte nach Zieleinlauf (nicht angekommene Fahrer nach Distanz)
        res.order.forEach((r, i) => {
          const name = r.isPlayer ? cup.playerName : r.name;
          cup.points[name] = (cup.points[name] || 0) + C.cupPoints[Math.min(i, C.cupPoints.length - 1)];
        });
        cup.places[cup.idx] = res.finished ? res.place : s.racers.length;
        cup.lastOrder = res.order.map((r) => (r.isPlayer ? cup.playerName : r.name));
        cup.idx += 1;
        if (cup.idx >= cup.def.races.length) {
          const rows = cup.names.map((n) => ({ n, p: cup.points[n] || 0, last: cup.lastOrder.indexOf(n) }));
          rows.sort((a, b) => b.p - a.p || a.last - b.last);
          const place = rows.findIndex((r) => r.n === cup.playerName) + 1;
          cup.final = true;
          cup.finalInfo = Object.assign({ place }, P.applyCupEnd(cup.def, place));
        }
        this._storeCupRun();
        GS.UI.showRaceResult({ res, applied, title: cup.def.name + ' · Rennen ' + cup.idx, cup: true });
      } else if (c.kind === 'adventure') {
        const applied = P.applyAdventure(c.env, res);
        GS.UI.showAdventureResult({ res, applied, envName: C.environments[c.env].name });
      }
      if (!D().tutorialSeen) { D().tutorialSeen = true; GS.Save.save(); }
      this.checkAchievements();
      GS.UI.wallet();
    },
    checkAchievements() {
      const got = P.checkAchievements();
      got.forEach((a, i) => setTimeout(() => {
        GS.UI.toast('Leistung: <b>' + a.name + '</b> <span class="plus">+' + U.fmt(a.reward) + '</span>');
        GS.Audio.achievement();
        GS.UI.wallet();
      }, 400 + i * 900));
    },

    /** Platzwechsel im Rennen hörbar machen (erst wenn der neue Platz kurz stabil ist) */
    _placeSound(dt) {
      const s = this.session;
      if (!s || !s.isRace || s.state !== 'running' || !s.player || s.player.finished) return;
      const p = s.player.place;
      if (this.lastPlace === null) { this.lastPlace = p; this.placeT = 0; return; }
      if (p === this.lastPlace) { this.placeT = 0; return; }
      this.placeT += dt;
      if (this.placeT > 0.6) { GS.Audio.position(p < this.lastPlace); this.lastPlace = p; this.placeT = 0; }
    },

    /* ---------------- Ereignisse ---------------- */
    handleEvents(s) {
      const R = this.renderer;
      const UI = GS.UI;
      const look = s.track.env.look;
      for (const e of s.events) {
        switch (e.type) {
          case 'count': UI.center('<span class="big">' + e.n + '</span>', 'count'); GS.Audio.count(); break;
          case 'launch': this._launchQ = e.quality; break;
          case 'go': {
            const q = { perfect: 'Perfekter Start!', good: 'Guter Start', low: 'Zu wenig Drehzahl – abgewürgt', high: 'Zu viel Drehzahl – Räder drehen durch' }[this._launchQ];
            UI.tip(null);   // Hinweis weg, damit die Startbewertung lesbar ist
            UI.center('<span class="big go">Los!</span>' + (q ? '<span class="why">' + q + '</span>' : ''), 'count');
            GS.Audio.go(); if (this._launchQ) GS.Audio.launch(this._launchQ);
            this._launchQ = null;
            break;
          }
          case 'fuel': UI.popText('Tank voll'); GS.Audio.fuel(); R.burst(e.x, e.y, 5, '#e2332f', 2.5, 0.12); break;
          case 'fuelOut': UI.center('<span class="msg">Tank leer!</span><span class="why">' + (s.isAdventure ? 'Die Fahrt endet' : 'Nicht im Ziel') + '</span>', 'sticky'); break;
          case 'obstacle': GS.Audio.obstacle(e.kind, e.phase, e.near); if (e.phase === 'land' || e.phase === 'impact') R.burst(e.x + (e.kind === 'tree' ? 3 : 0), s.track.heightAt(e.x) + 0.2, 8, look.dust, 3, 0.25); break;
          case 'badLanding': UI.popText('Schlechte Landung −' + e.kmh + ' km/h'); break;
          case 'opponentOut': UI.popText(e.name.split(' ')[0] + ': ' + (e.why === 'fuel' ? 'Tank leer' : 'ausgeschieden')); break;
          case 'coin':
            GS.Audio.coin();
            R.burst(e.x, e.y, 4, '#ffd23f', 3, 0.08);
            break;
          case 'stunt': UI.pop(e.parts, e.total); GS.Audio.stunt(e.parts); break;
          case 'takeoff': { const pv = s.player.vehicle.chassis.getLinearVelocity(); GS.Audio.takeoff(Math.hypot(pv.x, pv.y)); break; }
          case 'land':
            if (e.player) GS.Audio.land(e.impact, e.air);
            else {
              // KI-Landung: leiser und seitlich je nach Entfernung
              const dx = e.x - s.player.vehicle.x;
              GS.Audio.land(e.impact, e.air, Math.pow(U.clamp(1 - Math.abs(dx) / C.audio.aiRange, 0, 1), 2) * C.audio.levels.ai, U.clamp(dx / 22, -0.85, 0.85));
            }
            if (e.impact > 3) R.burst(e.x, e.y - 0.6, Math.min(14, 4 + Math.round(e.impact)), look.dust, 2 + e.impact * 0.3, 0.22);
            break;
          case 'crash':
            GS.Audio.crash(e.reason);
            if (navigator.vibrate) try { navigator.vibrate(60); } catch (_) { /* ignorieren */ }
            if (e.adventure) UI.center('<span class="msg">Fahrer K.O.!</span><span class="why">' + (e.reason === 'flip' ? 'Überschlagen und liegen geblieben' : e.reason === 'tree' ? 'Vom umstürzenden Baum getroffen' : 'Der Kopf hat den Boden berührt') + '</span>', 'sticky');
            else UI.center('<span class="msg">Fahrer K.O.!</span><span class="why">' + (e.reason === 'flip' ? 'Überschlagen' : e.reason === 'tree' ? 'Vom Baum getroffen' : 'Kopf am Boden') + ' – weiter am letzten sicheren Punkt</span>', 'crash');
            break;
          case 'respawn': UI.center('', null); this.cam.ready = false; GS.Audio.respawn(); break;
          case 'checkpoint':
            GS.Audio.checkpoint();
            UI.popText('Abschnitt ' + e.idx + '/' + e.total + ' · Platz ' + e.place + (e.gap !== null ? ' · ' + U.fmtGap(e.gap) : ' · Führung'));
            break;
          case 'opponentFinish': UI.popText(e.name.split(' ')[0] + ' ist im Ziel (' + e.place + '.)'); GS.Audio.opponentFinish(); break;
          case 'finish':
            GS.Audio.finish(e.place);
            UI.center('<span class="msg">Ziel!</span><span class="why">Platz ' + e.place + ' · ' + U.fmtTime(e.time) + '</span>', 'sticky');
            break;
          case 'advEnd':
            if (e.reason === 'stuck') UI.center('<span class="msg">Festgefahren</span><span class="why">Kein Vorankommen mehr</span>', 'sticky');
            break;
        }
      }
      s.events.length = 0;
    },

    /* ---------------- Hauptschleife ---------------- */
    loop(ts) {
      requestAnimationFrame((t) => this.loop(t));
      let dt = (ts - this.last) / 1000;
      this.last = ts;
      if (!(dt > 0)) dt = 1 / 60;
      dt = Math.min(dt, 0.1);
      const DT = C.physics.dt;
      const s = this.session || this.attract;
      if (!s) return;
      const run = this.session ? (!this.paused && this.session.state !== 'done') : (GS.UI.current === 'menu' || GS.UI.current === 'play');
      if (run) {
        this.acc += dt;
        let n = 0;
        while (this.acc >= DT && n < C.physics.maxSubSteps) {
          if (this.session) this.session.setPlayerInput(GS.Input.gas, GS.Input.brake);
          s.step(DT);
          this.acc -= DT;
          n++;
        }
        if (n >= C.physics.maxSubSteps) this.acc = 0;
        if (this.session) this.handleEvents(this.session);
        else { s.events.length = 0; this.attractAge += dt; if (this.attractAge > 240) this.startAttract(); }
      }
      const target = s.player.vehicle;
      // Welt nur zeichnen, wenn sie sichtbar ist (nicht hinter Garage/Fortschritt/Einstellungen)
      const covered = !this.session && (GS.UI.current === 'garage' || GS.UI.current === 'progress' || GS.UI.current === 'settings');
      if (!covered || !this.cam.ready) {
        this.cam.follow(target, s.track, run ? dt : 0, !this.cam.ready);
        if (run) for (const r of s.racers) this.renderer.vehicleFx(r.vehicle, s.track.env, dt);
        this.renderer.frame(s, this.cam, run ? dt : 0);
      }

      if (this.session) {
        const v = this.session.player.vehicle;
        const active = run && this.session.state !== 'countdown' && !v.crashed;
        GS.UI.pedals(GS.Input.gas, GS.Input.brake);
        GS.UI.hudUpdate(this.session, dt);
        GS.Audio.updateDrive(this.session, dt, { run: run && (active || this.session.state === 'countdown' || this.session.state === 'finished' || v.crashed) });
        this._placeSound(dt);
        if (this.session.state === 'done' && !this.resultShown) this.onSessionDone();
      }
      if (GS.UI.current === 'garage') GS.UI.garageFrame(dt);
    },
  };

  GS.Game = Game;

  function start() {
    try { Game.init(); } catch (e) {
      console.error(e);
      document.body.insertAdjacentHTML('beforeend', '<p style="position:fixed;inset:auto 16px 16px;padding:12px;background:#15232b;color:#f3efe3;border-radius:12px;font-family:sans-serif;z-index:99">Das Spiel konnte nicht starten: ' + String(e && e.message || e) + '</p>');
    }
  }
  // Live-Updates im Viewer: Spielstand vorher sichern
  try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => { GS.Save.flush(); return {}; }); } catch (_) { /* ignorieren */ }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => boot());
  else boot();
  function boot() {
    const hot = window.claude && window.claude.hot;
    if (hot && hot.ready) hot.ready(start); else start();
  }
})(window.GS = window.GS || {});

</script>

</body>
</html>
