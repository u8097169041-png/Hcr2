<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Gipfelsturm</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1a20">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Barlow:wght@500;600;700&display=swap">
<style>
/* =====================================================================
   GIPFELSTURM – Oberfläche
   Layout: Die Spielwelt füllt immer den ganzen Schirm. Menüs liegen als
   dunkle Schiefer-Paneele darüber; Akzent ist das Gelb der Wanderweg-
   schilder, primäre Knöpfe haben die Pfeilform eines Wegweisers.
   Bewusst ein einziges, dunkles Erscheinungsbild (Spiel-UI).
   ===================================================================== */
:root {
  --ink: #0f1a20;
  --panel: #15232b;
  --panel-2: #1c2f39;
  --line: #2d4552;
  --text: #f3efe3;
  --muted: #9cb0b6;
  --signal: #ffc629;
  --signal-ink: #16232b;
  --go: #3fcf6f;
  --stop: #ff5b4d;
  --coin: #ffcf3f;
  --scrim: rgba(12, 21, 26, 0.72);
  --scrim-2: rgba(12, 21, 26, 0.9);
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", "Liberation Sans Narrow", "DejaVu Sans Condensed", sans-serif;
  --font-body: "Barlow", "Segoe UI", Roboto, system-ui, sans-serif;
  --r: 14px;
  --gutter: 16px;
  color-scheme: dark;
}

html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  overscroll-behavior: none;
  background: var(--ink);
  color: var(--text);
  font-family: var(--font-body);
  font-weight: 500;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  touch-action: manipulation;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; touch-action: manipulation; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }
svg { display: block; }

#app { position: fixed; inset: 0; overflow: hidden; background: var(--ink); }
#game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* ---------------- Knöpfe ---------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
  min-height: 48px; padding: 0.7rem 1.1rem;
  background: var(--panel-2); color: var(--text);
  border: 1px solid var(--line); border-radius: 12px;
  font-weight: 700; font-size: 1.02rem; cursor: pointer;
  transition: transform 0.08s ease, background 0.15s ease;
}
.btn:hover { background: #233a46; }
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.45; cursor: default; transform: none; }
.btn.small { min-height: 40px; padding: 0.45rem 0.8rem; font-size: 0.92rem; }
.btn.wide { justify-content: space-between; }
.btn.wide small { color: var(--muted); font-weight: 600; font-size: 0.85rem; }
.btn.danger { border-color: #6b2e2a; color: #ffb3aa; }

/* Wegweiser-Knopf */
.sign {
  position: relative; display: inline-flex; align-items: center; justify-content: flex-start;
  min-height: 54px; padding: 0.4rem 2.6rem 0.4rem 1.2rem;
  background: var(--signal); color: var(--signal-ink); border: 0; cursor: pointer;
  clip-path: polygon(0 0, calc(100% - 24px) 0, 100% 50%, calc(100% - 24px) 100%, 0 100%);
  border-radius: 6px 0 0 6px;
  font-family: var(--font-display); font-weight: 800; font-style: italic;
  font-size: 1.5rem; letter-spacing: 0.02em; text-transform: uppercase; white-space: nowrap;
  transition: transform 0.08s ease, filter 0.15s ease;
}
.sign::after {
  content: ""; position: absolute; left: 1.2rem; right: 2.8rem; bottom: 9px; height: 3px;
  background: var(--signal-ink); opacity: 0.85; border-radius: 2px;
}
.sign:hover { filter: brightness(1.06); }
.sign:active { transform: scale(0.97); }
.sign:disabled { filter: grayscale(0.8) brightness(0.7); cursor: default; }
.sign.big { min-height: 76px; font-size: 2.4rem; padding-left: 1.4rem; }

/* ---------------- Chips ---------------- */
.wallet { display: flex; gap: 0.5rem; justify-content: flex-end; flex-wrap: wrap; }
.chip {
  display: inline-flex; align-items: center; gap: 0.4rem; height: 34px; padding: 0 0.75rem;
  background: rgba(16, 26, 32, 0.78); border: 1px solid var(--line); border-radius: 999px;
  font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.coin-ico {
  width: 16px; height: 16px; border-radius: 50%; display: inline-block; flex: none;
  background: radial-gradient(circle at 40% 35%, #ffe68a 0 25%, var(--coin) 26% 62%, #d99a12 63%);
}
.star-ico { color: var(--signal); font-style: normal; }

/* ---------------- Bildschirme ---------------- */
.screen {
  position: absolute; inset: 0; z-index: 10;
  display: flex; flex-direction: column;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) calc(env(safe-area-inset-right, 0px) + var(--gutter)) calc(env(safe-area-inset-bottom, 0px) + 10px) calc(env(safe-area-inset-left, 0px) + var(--gutter));
  background: linear-gradient(90deg, var(--scrim-2) 0%, var(--scrim) 55%, rgba(12, 21, 26, 0.45) 100%);
  gap: 10px;
}
.screen.results { background: rgba(10, 18, 22, 0.66); align-items: center; justify-content: center; }
#scr-garage, #scr-progress, #scr-settings { background: rgba(12, 21, 26, 0.9); }
.topbar { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; min-height: 44px; }
.topbar h2 {
  margin: 0; font-family: var(--font-display); font-weight: 800; font-style: italic;
  font-size: 1.7rem; letter-spacing: 0.01em; text-transform: uppercase; text-wrap: balance;
}
.back {
  width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--panel-2); display: grid; place-items: center; cursor: pointer;
}
.back svg, .g-nav svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }

/* ---------------- Hauptmenü ---------------- */
.menu .topbar { grid-template-columns: 1fr auto; }
.menu-main {
  flex: 1; min-height: 0; display: grid; align-content: center; gap: 22px;
  grid-template-columns: minmax(0, 1fr);
  max-width: 980px; width: 100%;
}
@media (min-aspect-ratio: 1/1) {
  .menu-main { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); align-items: center; }
}
.logo { display: grid; gap: 4px; }
.logo-mark { width: clamp(84px, 14vw, 140px); height: auto; overflow: visible; }
.logo-mark path { fill: none; stroke-linejoin: round; stroke-linecap: round; }
.logo-mark .c1 { stroke: var(--signal); stroke-width: 3.4; }
.logo-mark .c2 { stroke: var(--signal); stroke-width: 2; opacity: 0.6; }
.logo-mark .c3 { stroke: var(--signal); stroke-width: 1.4; opacity: 0.35; }
.logo-mark circle { fill: var(--text); }
.logo h1 {
  margin: 0; font-family: var(--font-display); font-weight: 800; font-style: italic;
  font-size: clamp(2.4rem, 12vw, 5.2rem); line-height: 0.88; letter-spacing: -0.01em; text-transform: uppercase;
  font-stretch: condensed; overflow-wrap: anywhere;
}
@media (min-aspect-ratio: 1/1) { .logo h1 { font-size: clamp(2.4rem, 6.6vw, 5.2rem); } }
.logo .tag {
  margin: 0; color: var(--muted); font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; font-size: 0.82rem;
}
.menu-actions { display: grid; gap: 10px; max-width: 420px; width: 100%; }
.menu-actions .sign.big { width: 100%; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.hint-rotate { margin: 0; color: var(--muted); font-size: 0.85rem; }
@media (min-aspect-ratio: 1/1) { .hint-rotate { display: none; } }

/* ---------------- Tabs / Segmente ---------------- */
.play-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.tabs, .seg {
  display: inline-flex; padding: 4px; gap: 4px; border-radius: 12px;
  background: rgba(16, 26, 32, 0.85); border: 1px solid var(--line);
}
.tabs button, .seg button {
  min-height: 40px; padding: 0 1rem; border: 0; border-radius: 9px; background: transparent; cursor: pointer;
  font-weight: 700; color: var(--muted);
}
.tabs button[aria-selected="true"], .seg button[aria-pressed="true"] { background: var(--text); color: var(--ink); }
.tabs.small button { min-height: 36px; padding: 0 0.85rem; }
.seg .seg-label { align-self: center; padding: 0 0.4rem 0 0.5rem; color: var(--muted); font-size: 0.85rem; font-weight: 600; }

/* ---------------- Karten ---------------- */
.cards {
  flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 232px), 1fr));
  gap: 12px; align-content: start; padding-bottom: 8px;
}
.card {
  position: relative; display: grid; gap: 6px; text-align: left; align-content: start;
  padding: 12px 14px 12px; border-radius: var(--r);
  background: var(--panel); border: 1px solid var(--line); cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease;
}
.card:hover { border-color: #46636f; }
.card:active { transform: scale(0.985); }
.card.locked { cursor: default; }
.card.locked > *:not(.lock) { opacity: 0.4; }
.card h3 { margin: 0; font-family: var(--font-display); font-weight: 800; font-style: italic; font-size: 1.45rem; line-height: 1; text-transform: uppercase; }
.card .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card .env { font-size: 0.74rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.card .stars { font-size: 1rem; letter-spacing: 0.08em; color: #3d5560; }
.card .stars .on { color: var(--signal); }
.card .profile { width: 100%; height: 44px; }
.card .profile path { stroke-linejoin: round; }
.card .meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 0.86rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.card .meta b { color: var(--text); font-weight: 700; }
.card .lock {
  position: absolute; right: 12px; top: 10px; display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 999px; background: var(--ink); border: 1px solid var(--line);
  font-weight: 700; font-size: 0.85rem;
}
.lock svg { width: 14px; height: 14px; fill: currentColor; }
.grade {
  display: inline-block; padding: 1px 6px; border-radius: 4px; background: var(--signal); color: var(--signal-ink);
  font-family: var(--font-display); font-weight: 800; font-size: 0.95rem;
}
.envchips { display: flex; flex-wrap: wrap; gap: 4px; }
.envchips span { font-size: 0.74rem; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--panel-2); color: var(--muted); }

/* ---------------- Garage ---------------- */
.garage { flex: 1; min-height: 0; display: grid; gap: 12px; grid-template-rows: minmax(150px, 0.9fr) minmax(0, 1.1fr); }
@media (min-aspect-ratio: 1/1) { .garage { grid-template-rows: none; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); } }
.g-stage {
  position: relative; min-height: 0; border-radius: var(--r); overflow: hidden;
  background: radial-gradient(ellipse at 50% 80%, #24414d 0%, #13222a 70%); border: 1px solid var(--line);
}
#garage-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.g-nav {
  position: absolute; top: 50%; transform: translateY(-50%); width: 46px; height: 46px; border-radius: 50%;
  border: 1px solid var(--line); background: rgba(16, 26, 32, 0.8); display: grid; place-items: center; cursor: pointer;
}
.g-nav.prev { left: 10px; }
.g-nav.next { right: 10px; }
.g-name { position: absolute; left: 14px; top: 10px; }
.g-name h3 { margin: 0; font-family: var(--font-display); font-weight: 800; font-style: italic; font-size: 2rem; line-height: 1; text-transform: uppercase; }
.g-name span { color: var(--muted); font-weight: 600; font-size: 0.9rem; }
.g-dots { position: absolute; left: 0; right: 0; bottom: 10px; display: flex; justify-content: center; gap: 6px; }
.g-dots i { width: 8px; height: 8px; border-radius: 50%; background: #3d5560; }
.g-dots i.on { background: var(--signal); }
.g-dots i.own { box-shadow: inset 0 0 0 2px var(--text); }
.g-panel { min-height: 0; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; touch-action: pan-y; overscroll-behavior: contain; }
.g-head { display: grid; gap: 8px; }
.g-desc { margin: 0; color: var(--muted); font-size: 0.95rem; line-height: 1.35; max-width: 60ch; }
.g-pm { display: grid; gap: 2px; }
.g-pm .pm { margin: 0; display: grid; grid-template-columns: 1.1em minmax(0, 1fr); gap: 4px; font-size: 0.88rem; line-height: 1.3; }
.g-pm .pm b { font-weight: 800; text-align: center; }
.g-pm .plus b { color: var(--go); }
.g-pm .minus b { color: var(--stop); }
.g-action { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.g-action .note { color: var(--muted); font-weight: 600; font-size: 0.9rem; }
.g-content { flex: none; display: grid; gap: 8px; align-content: start; padding-bottom: 6px; }
.up-row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center;
  padding: 10px 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line);
}
.up-row h4 { margin: 0; font-size: 1rem; font-weight: 700; }
.up-row p { margin: 0; color: var(--muted); font-size: 0.82rem; line-height: 1.3; }
.pips { display: flex; gap: 4px; margin-top: 4px; }
.pips i { width: 22px; height: 7px; border-radius: 3px; background: #2d4552; }
.pips i.on { background: var(--signal); }
.up-buy { grid-row: span 3; min-width: 92px; }
.up-buy .coin-ico { width: 14px; height: 14px; }
.stat-row { display: grid; grid-template-columns: 9.5em minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 0.92rem; }
.stat-row .bar { height: 8px; border-radius: 4px; background: #2d4552; overflow: hidden; }
.stat-row .bar i { display: block; height: 100%; background: var(--text); border-radius: 4px; }
.stat-row .v { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 600; min-width: 6em; text-align: right; }

/* ---------------- Fortschritt & Einstellungen ---------------- */
.pane {
  flex: 1; min-height: 0; overflow-y: auto; touch-action: pan-y; display: grid; gap: 14px; align-content: start;
  max-width: 820px; width: 100%; padding-bottom: 10px;
  grid-template-columns: minmax(0, 1fr);
}
.pane h3 { margin: 6px 0 0; font-family: var(--font-display); font-weight: 800; font-style: italic; font-size: 1.3rem; text-transform: uppercase; letter-spacing: 0.02em; }
.panel { padding: 12px 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
.star-big { display: flex; align-items: baseline; gap: 8px; font-family: var(--font-display); font-weight: 800; font-style: italic; font-size: 2.4rem; }
.star-big small { font-size: 1.1rem; color: var(--muted); font-style: normal; font-weight: 700; }
.meter { height: 10px; border-radius: 5px; background: #2d4552; overflow: hidden; margin-top: 8px; }
.meter i { display: block; height: 100%; background: var(--signal); }
.list { display: grid; gap: 6px; }
.li {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center;
  padding: 9px 12px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line);
}
.li .t { font-weight: 700; }
.li .d { color: var(--muted); font-size: 0.84rem; grid-column: 1; }
.li .r { grid-row: span 2; font-variant-numeric: tabular-nums; font-weight: 700; text-align: right; }
.li.done { border-color: #3c6a4a; }
.li.done .r { color: var(--go); }
.li .meter { grid-column: 1 / -1; margin-top: 4px; height: 6px; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; padding: 12px 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
.set-row .lbl { display: grid; gap: 2px; min-width: 0; }
.set-row .lbl b { font-weight: 700; }
.set-row .lbl span { color: var(--muted); font-size: 0.84rem; }
.toggle { position: relative; width: 58px; height: 34px; border-radius: 17px; border: 1px solid var(--line); background: #2d4552; cursor: pointer; flex: none; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: var(--muted); transition: transform 0.15s ease, background 0.15s ease; }
.toggle[aria-pressed="true"] { background: #2f6b47; }
.toggle[aria-pressed="true"]::after { transform: translateX(24px); background: var(--text); }
input[type="range"] { width: min(220px, 100%); accent-color: var(--signal); touch-action: pan-x; }
.keys { color: var(--muted); font-size: 0.9rem; line-height: 1.5; margin: 0; }
kbd { font-family: var(--font-body); font-weight: 700; padding: 1px 6px; border-radius: 5px; background: var(--panel-2); border: 1px solid var(--line); color: var(--text); }

/* ---------------- Ergebnis / Cup ---------------- */
.res-cols { display: grid; gap: 12px; }
.res-col { display: grid; gap: 10px; align-content: start; min-width: 0; }
@media (min-aspect-ratio: 1/1) and (max-height: 620px) {
  .res-card { width: min(900px, 100%); }
  .res-cols { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
}
.res-card {
  width: min(560px, 100%); max-height: 100%; overflow-y: auto; touch-action: pan-y;
  background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px;
  display: grid; gap: 12px;
}
.res-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.res-place { display: flex; align-items: baseline; gap: 8px; font-family: var(--font-display); font-weight: 800; font-style: italic; line-height: 0.9; }
.res-place b { font-size: 4.6rem; color: var(--signal); }
.res-place span { font-size: 1.6rem; text-transform: uppercase; }
.res-sub { color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.res-sub b { color: var(--text); }
.badge { display: inline-block; padding: 2px 8px; border-radius: 6px; background: var(--signal); color: var(--signal-ink); font-weight: 800; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; }
.order { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.order li { display: grid; grid-template-columns: 1.6em 12px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 10px; border-radius: 8px; background: var(--panel-2); font-variant-numeric: tabular-nums; }
.order li.me { outline: 2px solid var(--signal); }
.order .dot { width: 10px; height: 10px; border-radius: 50%; }
.order .n { font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.order .n small { color: var(--muted); font-weight: 600; }
.order .tm { color: var(--muted); font-weight: 600; }
.rewards { display: grid; gap: 4px; padding: 10px 12px; border-radius: 12px; background: var(--ink); font-variant-numeric: tabular-nums; }
.rewards div { display: flex; justify-content: space-between; gap: 12px; }
.rewards .tot { border-top: 1px solid var(--line); padding-top: 6px; margin-top: 2px; font-weight: 800; font-size: 1.15rem; }
.rewards .plus { color: var(--coin); font-weight: 700; }
.stars-row { font-size: 1.8rem; letter-spacing: 0.1em; color: #3d5560; }
.stars-row .on { color: var(--signal); }
.unlocks { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.unlocks li { padding: 8px 10px; border-radius: 8px; background: #233d2e; color: #c9f2d6; font-weight: 700; font-size: 0.92rem; }
.res-actions {
  display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end;
  position: sticky; bottom: -18px; margin: 0 -18px -18px; padding: 10px 18px 18px;
  background: linear-gradient(180deg, rgba(21, 35, 43, 0) 0%, var(--panel) 30%);
}
.cup-races { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.cup-races div { padding: 8px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line); text-align: center; font-size: 0.82rem; color: var(--muted); }
.cup-races div b { display: block; color: var(--text); font-family: var(--font-display); font-size: 1.15rem; font-style: italic; }
.cup-races div.cur { border-color: var(--signal); }
.cup-races div.done b { color: var(--go); }
table.stand { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.stand td { padding: 6px 8px; border-bottom: 1px solid var(--line); }
table.stand tr.me td { color: var(--signal); font-weight: 700; }
table.stand td.p { text-align: right; font-weight: 700; }

/* ---------------- Overlay / Pause ---------------- */
.overlay { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(10, 18, 22, 0.7); padding: var(--gutter); }
.dialog { width: min(360px, 100%); display: grid; gap: 10px; padding: 18px; border-radius: 18px; background: var(--panel); border: 1px solid var(--line); }
.dialog h2 { margin: 0 0 4px; font-family: var(--font-display); font-weight: 800; font-style: italic; font-size: 2rem; text-transform: uppercase; }
.dialog .sign { width: 100%; }

/* ---------------- HUD ---------------- */
.hud { position: absolute; inset: 0; z-index: 6; pointer-events: none; }
.hud button { pointer-events: auto; }
.hud-top {
  position: absolute; top: calc(env(safe-area-inset-top, 0px) + 8px);
  left: calc(env(safe-area-inset-left, 0px) + 10px); right: calc(env(safe-area-inset-right, 0px) + 10px);
  display: flex; align-items: center; gap: 10px;
}
.hud-btn { width: 44px; height: 44px; flex: none; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.18); background: rgba(16, 26, 32, 0.66); display: grid; place-items: center; cursor: pointer; }
.hud-btn svg { width: 20px; height: 20px; fill: var(--text); }
.bib {
  flex: none; display: flex; align-items: baseline; gap: 1px; padding: 2px 10px 0; min-width: 62px; height: 44px;
  background: var(--text); color: var(--ink); border-radius: 8px; justify-content: center;
  font-family: var(--font-display); font-weight: 800; font-style: italic; box-shadow: 0 2px 0 rgba(0, 0, 0, 0.25);
}
.bib b { font-size: 2.2rem; line-height: 1.15; }
.bib span { font-size: 1.1rem; }
.hud-track { position: relative; flex: 1; min-width: 60px; height: 30px; }
.ht-line { position: absolute; left: 0; right: 14px; top: 50%; height: 4px; margin-top: -2px; border-radius: 2px; background: rgba(16, 26, 32, 0.6); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.18); }
.ht-cps i { position: absolute; top: 50%; width: 2px; height: 12px; margin-top: -6px; background: rgba(255, 255, 255, 0.55); }
.ht-marks i { position: absolute; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; border: 2px solid rgba(16, 26, 32, 0.8); will-change: transform; }
.ht-marks i.me { width: 18px; height: 18px; margin: -9px 0 0 -9px; background: var(--signal); border-color: var(--ink); z-index: 2; }
.ht-flag { position: absolute; right: 0; top: 50%; width: 16px; height: 16px; margin-top: -12px; color: var(--text); }
.hud-dist { flex: 1; display: flex; align-items: baseline; gap: 2px; font-family: var(--font-display); font-weight: 800; font-style: italic; text-shadow: 0 2px 0 rgba(0, 0, 0, 0.35); font-variant-numeric: tabular-nums; }
.hud-dist b { font-size: 2.1rem; }
.hud-dist span { font-size: 1.2rem; }
.hud-dist small { margin-left: 12px; font-size: 1rem; font-style: normal; font-weight: 700; color: var(--text); opacity: 0.8; }
.hud .chip { flex: none; }
.hud-gap { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 58px); left: 0; right: 0; text-align: center; font-weight: 700; font-size: 0.95rem; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7); font-variant-numeric: tabular-nums; }
.hud-reset { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 84px); left: 50%; transform: translateX(-50%); }
.hud-pop { position: absolute; top: 24%; left: 0; right: 0; display: grid; justify-items: center; gap: 4px; }
.pop {
  font-family: var(--font-display); font-weight: 800; font-style: italic; font-size: clamp(1.4rem, 4.2vw, 2.2rem);
  color: var(--text); text-shadow: 0 2px 0 var(--ink), 0 0 12px rgba(0, 0, 0, 0.5); text-transform: uppercase;
  animation: pop 1.6s ease forwards;
}
.pop small { color: var(--coin); font-size: 0.7em; margin-left: 0.3em; }
.pop.sub { font-size: clamp(1rem, 2.8vw, 1.35rem); text-transform: none; font-style: normal; font-weight: 700; }
@keyframes pop { 0% { transform: scale(0.6); opacity: 0; } 12% { transform: scale(1.08); opacity: 1; } 22% { transform: scale(1); } 80% { opacity: 1; } 100% { transform: translateY(-14px); opacity: 0; } }
.hud-center {
  position: absolute; left: 0; right: 0; top: 38%; transform: translateY(-50%); text-align: center;
  font-family: var(--font-display); font-weight: 800; font-style: italic; text-transform: uppercase;
  text-shadow: 0 3px 0 var(--ink), 0 0 18px rgba(0, 0, 0, 0.45);
}
.hud-center .big { font-size: clamp(4rem, 16vw, 8rem); line-height: 1; display: block; animation: count 0.9s ease forwards; }
.hud-center .msg { font-size: clamp(2rem, 7vw, 3.6rem); line-height: 1; display: block; }
.hud-center .why { display: block; margin-top: 6px; font-family: var(--font-body); font-style: normal; text-transform: none; font-weight: 700; font-size: 1rem; }
.hud-center .go { color: var(--signal); }
@keyframes count { 0% { transform: scale(1.6); opacity: 0; } 20% { transform: scale(1); opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0.0; } }
.hud-tip {
  position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 96px); transform: translateX(-50%);
  width: min(460px, calc(100% - 220px)); min-width: 180px; padding: 8px 12px; border-radius: 12px;
  background: rgba(16, 26, 32, 0.78); border: 1px solid var(--line); text-align: center; font-size: 0.88rem; line-height: 1.35;
}
.hud-tip b { color: var(--signal); }

/* ---------------- Tacho ---------------- */
.gauge {
  position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); transform: translateX(-50%);
  width: 118px; display: grid; justify-items: center; opacity: 0.92; pointer-events: none;
}
.gauge svg { width: 118px; height: auto; display: block; overflow: visible; }
.gauge path { fill: none; stroke-linecap: round; }
.gauge .g-arc { stroke: rgba(16, 26, 32, 0.72); stroke-width: 9; }
.gauge .g-band { stroke: var(--go); stroke-width: 9; opacity: 0.35; transition: opacity 0.2s ease; }
.gauge.launch .g-band { opacity: 1; }
.gauge .g-red { stroke: var(--stop); stroke-width: 9; opacity: 0.55; }
.gauge .g-needle line { stroke: var(--text); stroke-width: 3; stroke-linecap: round; }
.gauge .g-needle circle { fill: var(--text); }
.gauge.inband .g-needle line { stroke: var(--go); }
.gauge.over .g-needle line { stroke: var(--stop); }
.g-spd { margin-top: -30px; display: flex; align-items: baseline; gap: 2px; font-family: var(--font-display); font-weight: 800; font-style: italic; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6); font-variant-numeric: tabular-nums; }
.g-spd b { font-size: 1.35rem; line-height: 1; }
.g-spd small { font-size: 0.7rem; font-style: normal; opacity: 0.85; }
.g-fuel { display: flex; align-items: center; gap: 4px; margin-top: 3px; }
.g-fuel svg { width: 13px; height: 13px; fill: none; stroke: var(--text); stroke-width: 1.6; stroke-linejoin: round; }
.g-fuel span { width: 74px; height: 7px; border-radius: 4px; background: rgba(16, 26, 32, 0.75); border: 1px solid rgba(255, 255, 255, 0.18); overflow: hidden; }
.g-fuel i { display: block; height: 100%; width: 100%; background: var(--signal); transform-origin: left; }
.gauge.low .g-fuel i { background: var(--stop); animation: fuelblink 0.8s steps(2) infinite; }
@keyframes fuelblink { 50% { opacity: 0.35; } }
.hud-air { position: absolute; left: 50%; top: 34%; transform: translateX(-50%); font-family: var(--font-display); font-weight: 800; font-style: italic; font-size: 1.5rem; color: var(--text); text-shadow: 0 2px 3px rgba(0, 0, 0, 0.6); opacity: 0; transition: opacity 0.15s ease; font-variant-numeric: tabular-nums; }
.hud-air.on { opacity: 0.9; }
.res-card .dnf { color: var(--stop); font-weight: 700; }

/* ---------------- Touch-Pedale ---------------- */
.controls { position: absolute; inset: 0; z-index: 5; touch-action: none; }
.pedal {
  position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  width: clamp(66px, 10vw, 98px); display: grid; justify-items: center; gap: 2px;
  opacity: 0.62; transition: opacity 0.08s ease, transform 0.08s ease; pointer-events: none;
}
.pedal svg { width: 100%; height: auto; }
.pedal rect { fill: rgba(16, 26, 32, 0.7); stroke-width: 3; }
.pedal path { stroke-width: 4; stroke-linecap: round; fill: none; }
.pedal span { font-weight: 700; font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8); }
.pedal.brake { left: calc(env(safe-area-inset-left, 0px) + 16px); }
.pedal.brake rect { stroke: var(--stop); }
.pedal.brake path { stroke: var(--stop); }
.pedal.gas { right: calc(env(safe-area-inset-right, 0px) + 16px); }
.pedal.gas rect { stroke: var(--go); }
.pedal.gas path { stroke: var(--go); }
.pedal.on { opacity: 1; transform: scale(0.94) translateY(3px); }
.pedal.brake.on rect { fill: rgba(255, 91, 77, 0.55); }
.pedal.gas.on rect { fill: rgba(63, 207, 111, 0.55); }

/* ---------------- Toasts ---------------- */
.toasts { position: absolute; z-index: 30; top: calc(env(safe-area-inset-top, 0px) + 60px); right: calc(env(safe-area-inset-right, 0px) + 16px); display: grid; gap: 6px; width: min(380px, calc(100% - 32px)); pointer-events: none; }
.toast { padding: 10px 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35); font-weight: 600; font-size: 0.92rem; animation: toast 3.2s ease forwards; }
.toast b { color: var(--signal); }
.toast .plus { color: var(--coin); font-weight: 700; }
@keyframes toast { 0% { transform: translateY(-10px); opacity: 0; } 8% { transform: none; opacity: 1; } 88% { opacity: 1; } 100% { opacity: 0; } }

/* ---------------- Kompakt (Querformat-Smartphone) ---------------- */
@media (max-height: 460px) {
  .screen { gap: 8px; padding-top: calc(env(safe-area-inset-top, 0px) + 8px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); }
  .topbar h2 { font-size: 1.4rem; }
  .logo h1 { font-size: clamp(2.4rem, 6.4vw, 4.4rem); }
  .sign.big { min-height: 64px; font-size: 2rem; }
  .btn { min-height: 46px; }
  .card .profile { height: 34px; }
  .res-place b { font-size: 3.6rem; }
  .res-card { padding: 14px; gap: 10px; }
  .hud-gap { top: calc(env(safe-area-inset-top, 0px) + 56px); }
  .g-desc { font-size: 0.85rem; }
  .g-name h3 { font-size: 1.6rem; }
}
@media (max-width: 520px) {
  .wallet { flex-wrap: nowrap; gap: 0.35rem; }
  .topbar { gap: 8px; }
  .topbar h2 { font-size: 1.35rem; min-width: 0; overflow-wrap: anywhere; }
  .hud-top { gap: 6px; }
  .bib { min-width: 52px; padding: 2px 6px 0; }
  .bib b { font-size: 1.8rem; }
  .chip { font-size: 1rem; padding: 0 0.6rem; }
  .hud-dist b { font-size: 1.7rem; }
  .hud-dist small { display: none; }
  .hud-tip { width: calc(100% - 32px); bottom: calc(env(safe-area-inset-bottom, 0px) + 120px); }
  .stat-row { grid-template-columns: 8em minmax(0, 1fr); }
  .stat-row .v { grid-column: 2; text-align: left; }
}

/* sehr schmale Hochformat-Geräte: Münzen/Sterne in eigener Zeile, damit der Titel lesbar bleibt */
@media (max-width: 400px) and (max-aspect-ratio: 1/1) {
  .screen:not(.menu) > .topbar { grid-template-columns: auto minmax(0, 1fr); row-gap: 6px; }
  .screen:not(.menu) > .topbar .wallet { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  .pop, .toast, .hud-center .big { animation: none; }
}
.seg .ai-note { align-self: center; padding: 0 0.75rem; color: var(--muted); font-size: 0.82rem; font-weight: 600; }

</style>

<body>
<div id="app">
  <canvas id="game" aria-label="Spielwelt"></canvas>

  <!-- Touch-Steuerung: linke Hälfte Bremse, rechte Hälfte Gas -->
  <div id="controls" class="controls" hidden>
    <div class="pedal brake" aria-hidden="true">
      <svg viewBox="0 0 64 80"><rect x="6" y="6" width="52" height="68" rx="12"/><path d="M18 26h28M18 40h28M18 54h28"/></svg>
      <span>Bremse</span>
    </div>
    <div class="pedal gas" aria-hidden="true">
      <svg viewBox="0 0 64 80"><rect x="10" y="4" width="44" height="72" rx="12"/><path d="M22 20v40M32 20v40M42 20v40"/></svg>
      <span>Gas</span>
    </div>
  </div>

  <!-- HUD während der Fahrt -->
  <div id="hud" class="hud" hidden>
    <div class="hud-top">
      <button id="btn-pause" class="hud-btn" aria-label="Pause">
        <svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      </button>
      <div id="hud-pos" class="bib"><b>1</b><span>/4</span></div>
      <div id="hud-track" class="hud-track">
        <div class="ht-line"></div>
        <div class="ht-cps"></div>
        <div class="ht-marks"></div>
        <svg class="ht-flag" viewBox="0 0 16 16"><path d="M2 1v14" stroke="currentColor" stroke-width="2"/><path d="M3 2h10v7H3z" fill="currentColor"/></svg>
      </div>
      <div id="hud-dist" class="hud-dist"><b>0</b><span> m</span><small></small></div>
      <div id="hud-coins" class="chip coin"><i class="coin-ico"></i><b>0</b></div>
    </div>
    <div id="hud-gap" class="hud-gap"></div>
    <button id="btn-reset" class="btn small hud-reset" hidden>Zurücksetzen</button>
    <div id="hud-pop" class="hud-pop" aria-live="polite"></div>
    <div id="hud-center" class="hud-center" aria-live="assertive"></div>
    <div id="hud-tip" class="hud-tip" hidden></div>
    <!-- Tacho: Drehzahl (mit Startfenster), Tempo, Tank -->
    <div id="hud-gauge" class="gauge" aria-hidden="true">
      <svg viewBox="0 0 120 70">
        <path class="g-arc" d=""/>
        <path class="g-band" d=""/>
        <path class="g-red" d=""/>
        <g class="g-needle"><line x1="60" y1="60" x2="60" y2="18"/><circle cx="60" cy="60" r="4"/></g>
      </svg>
      <div class="g-spd"><b>0</b><small>km/h</small></div>
      <div class="g-fuel"><svg viewBox="0 0 16 16"><path d="M3 2h6v12H3z M9 5l3 2v6a1 1 0 0 0 2 0V6l-2-2"/></svg><span><i></i></span></div>
    </div>
    <div id="hud-air" class="hud-air" aria-live="off"></div>
  </div>

  <!-- Hauptmenü -->
  <section id="scr-menu" class="screen menu" hidden>
    <header class="topbar">
      <span></span>
      <div class="wallet"></div>
    </header>
    <div class="menu-main">
      <div class="logo">
        <svg class="logo-mark" viewBox="0 0 120 54" aria-hidden="true">
          <path class="c1" d="M2 52 L34 18 L46 30 L66 6 L118 52"/>
          <path class="c2" d="M14 52 L34 30 L46 40 L66 18 L104 52"/>
          <path class="c3" d="M28 52 L36 44 L46 50 L66 30 L90 52"/>
          <circle cx="66" cy="6" r="3"/>
        </svg>
        <h1>Gipfelsturm</h1>
        <p class="tag">Physik-Bergrennen</p>
      </div>
      <nav class="menu-actions">
        <button class="sign big" data-go="play"><span>Spielen</span></button>
        <button class="btn wide" data-go="garage"><span>Garage</span><small id="menu-vehicle"></small></button>
        <div class="btn-row">
          <button class="btn" data-go="progress">Fortschritt</button>
          <button class="btn" data-go="settings">Einstellungen</button>
        </div>
      </nav>
    </div>
    <p class="hint-rotate">Tipp: Im Querformat siehst du mehr von der Strecke.</p>
  </section>

  <!-- Spielmodus wählen -->
  <section id="scr-play" class="screen" hidden>
    <header class="topbar">
      <button class="back" data-go="menu" aria-label="Zurück"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h2>Spielen</h2>
      <div class="wallet"></div>
    </header>
    <div class="play-bar">
      <div class="tabs" role="tablist" id="play-tabs">
        <button role="tab" data-tab="race" aria-selected="true">Rennen</button>
        <button role="tab" data-tab="cups" aria-selected="false">Cups</button>
        <button role="tab" data-tab="adv" aria-selected="false">Adventure</button>
      </div>
      <div class="seg" id="ai-seg" aria-label="KI-Stärke"></div>
    </div>
    <div id="play-list" class="cards scroll"></div>
  </section>

  <!-- Garage -->
  <section id="scr-garage" class="screen" hidden>
    <header class="topbar">
      <button class="back" data-go="menu" aria-label="Zurück"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h2>Garage</h2>
      <div class="wallet"></div>
    </header>
    <div class="garage">
      <div class="g-stage">
        <canvas id="garage-canvas"></canvas>
        <button class="g-nav prev" id="g-prev" aria-label="Vorheriges Fahrzeug"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button class="g-nav next" id="g-next" aria-label="Nächstes Fahrzeug"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
        <div class="g-name"><h3 id="g-title"></h3><span id="g-class"></span></div>
        <div class="g-dots" id="g-dots"></div>
      </div>
      <div class="g-panel scroll">
        <div class="g-head">
          <p class="g-desc" id="g-desc"></p>
          <div class="g-pm" id="g-pm"></div>
          <div class="g-action" id="g-action"></div>
        </div>
        <div class="tabs small" id="g-tabs">
          <button data-tab="up" aria-selected="true">Upgrades</button>
          <button data-tab="stats" aria-selected="false">Werte</button>
        </div>
        <div class="g-content scroll" id="g-content"></div>
      </div>
    </div>
  </section>

  <!-- Fortschritt -->
  <section id="scr-progress" class="screen" hidden>
    <header class="topbar">
      <button class="back" data-go="menu" aria-label="Zurück"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h2>Fortschritt</h2>
      <div class="wallet"></div>
    </header>
    <div id="progress-body" class="pane scroll"></div>
  </section>

  <!-- Einstellungen -->
  <section id="scr-settings" class="screen" hidden>
    <header class="topbar">
      <button class="back" data-go="menu" aria-label="Zurück"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h2>Einstellungen</h2>
      <div class="wallet"></div>
    </header>
    <div id="settings-body" class="pane scroll"></div>
  </section>

  <!-- Ergebnis -->
  <section id="scr-results" class="screen results" hidden>
    <div class="res-card scroll" id="res-card"></div>
  </section>

  <!-- Cup-Übersicht -->
  <section id="scr-cup" class="screen results" hidden>
    <div class="res-card scroll" id="cup-card"></div>
  </section>

  <!-- Pause -->
  <div id="ovl-pause" class="overlay" hidden>
    <div class="dialog">
      <h2>Pause</h2>
      <button class="sign" id="p-resume"><span>Fortsetzen</span></button>
      <button class="btn" id="p-restart">Neustart</button>
      <button class="btn" id="p-menu">Zum Menü</button>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
</div>

<script>
/* Hilfsfunktionen: Mathe, Zufall, Formatierung */
'use strict';
(function (GS) {
  const U = {};

  U.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  U.lerp = (a, b, t) => a + (b - a) * t;
  U.smooth = (t) => t * t * (3 - 2 * t);
  /** Winkel auf (-π, π] bringen */
  U.wrapAngle = (a) => {
    a = (a + Math.PI) % (2 * Math.PI);
    if (a < 0) a += 2 * Math.PI;
    return a - Math.PI;
  };
  /** framerate-unabhängige Glättung */
  U.damp = (cur, target, rate, dt) => target + (cur - target) * Math.exp(-rate * dt);

  /** deterministischer Zufallsgenerator (mulberry32) */
  U.rng = function (seed) {
    let s = (seed >>> 0) || 1;
    const r = function () {
      s = (s + 0x6D2B79F5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    r.range = (a, b) => a + (b - a) * r();
    r.int = (a, b) => Math.floor(a + (b - a + 1) * r());
    r.pick = (arr) => arr[Math.floor(r() * arr.length)];
    r.weighted = (pairs) => {
      let sum = 0;
      for (const p of pairs) sum += p[1];
      let v = r() * sum;
      for (const p of pairs) { v -= p[1]; if (v <= 0) return p[0]; }
      return pairs[pairs.length - 1][0];
    };
    r.normal = () => {
      let u = 0, v = 0;
      while (u === 0) u = r();
      while (v === 0) v = r();
      return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    };
    return r;
  };

  /** glattes 1D-Wertrauschen (deterministisch) */
  U.noise1D = function (seed) {
    const r = U.rng(seed);
    const N = 512;
    const vals = new Float32Array(N);
    for (let i = 0; i < N; i++) vals[i] = r() * 2 - 1;
    return function (x) {
      const i = Math.floor(x);
      const f = x - i;
      const a = vals[((i % N) + N) % N];
      const b = vals[(((i + 1) % N) + N) % N];
      return a + (b - a) * U.smooth(f);
    };
  };

  const nf = (typeof Intl !== 'undefined') ? new Intl.NumberFormat('de-DE') : null;
  U.fmt = (n) => (nf ? nf.format(Math.round(n)) : String(Math.round(n)));
  U.fmtTime = (t) => {
    if (!isFinite(t)) return '–';
    t = Math.round(t * 10) / 10;
    const m = Math.floor(t / 60);
    const s = t - m * 60;
    const ss = s.toFixed(1).replace('.', ',');
    return m + ':' + (s < 10 ? '0' : '') + ss;
  };
  U.fmtGap = (t) => (t >= 0 ? '+' : '−') + Math.abs(t).toFixed(1).replace('.', ',') + ' s';

  GS.U = U;
})(window.GS = window.GS || {});

</script>

      this.nextDecoX = 6;
      this.startX = C.terrain.startFlat;
      this.finishX = this.adventure ? Infinity : this.startX + this.length;
      this.checkpoints = this.adventure ? [] : C.race.checkpoints.map((f) => this.startX + this.length * f);
      this.markers = [];
      // Treibstoff-Kanister (nicht im Menü-Hintergrund)
      this.fuels = [];
      this.fuelRng = U.rng(this.seed * 53 + 11);
      // Rennen: auf schweren (langsamen) Strecken liegen Kanister dichter
      this.fuelScale = this.adventure ? 1 : 1.1 - C.fuel.raceDiffTighten * U.clamp(this.baseDifficulty, 0, 1);
      this.fuelGap = this.adventure ? this.fuelRng.range(C.fuel.advSpacing[0], C.fuel.advSpacing[1]) : this.fuelRng.range(C.fuel.raceSpacing[0], C.fuel.raceSpacing[1]) * this.fuelScale;
      this.nextFuelX = this.startX + this.fuelGap;
      // Hindernisse planen (Modus: none | race | cup | adventure)
      this.obstacles = [];
      const OB = C.obstacles;
      this.obsMode = this.mode === 'attract' ? 'none' : (opts.obstacles || (this.adventure ? 'adventure' : 'race'));
      this.obsRng = U.rng(this.seed * 71 + 29);
      this.obsTargets = [];
      if (this.obsMode === 'adventure') this.nextObsX = this.startX + this.obsRng.range(OB.advFirst[0], OB.advFirst[1]);

      this._emit('start', this.startX, () => 0, () => 0, false);
      if (!this.adventure && (this.obsMode === 'race' || this.obsMode === 'cup')) {
        const OB = C.obstacles;
        if (this.obsRng() < OB.chance[this.obsMode]) {
          const n = this.obsRng.int(OB.count[this.obsMode][0], OB.count[this.obsMode][1]);
          for (let i = 0; i < n; i++) this.obsTargets.push(this.startX + this.length * (0.22 + (0.66 * (i + this.obsRng.range(0.15, 0.85))) / n));
        }
      }
      if (!this.adventure) {
        this.ensure(this.startX + this.length - 25);
        // Ziel liegt immer auf einem flachen Stück
        const fx = this.genX + 14;
        this._emit('finish', 70, () => 0, () => 0.3, false);
        this.finishX = fx;
        this.length = fx - this.startX;
        this.checkpoints = C.race.checkpoints.map((f) => this.startX + this.length * f);
        this.ensure(this.finishX + C.terrain.finishRunout);
      } else {
        this.ensure(400);
      }
    }

    /* ---------- Abfragen ---------- */
    heightAt(x) {
      const fi = x / this.dx;
      let i = Math.floor(fi);
      const h = this.h;
      if (i < 0) return h[0];
      if (i >= h.length - 1) return h[h.length - 1];
      const f = fi - i;
      return h[i] + (h[i + 1] - h[i]) * f;
    }
    slopeAt(x) {
      return (this.heightAt(x + 0.5) - this.heightAt(x - 0.5));
    }
    angleAt(x) {
      return Math.atan(this.slopeAt(x));
    }
    difficultyAt(x) {
      if (this.adventure) {
        const A = C.adventure;
        const t = U.clamp((x - this.startX) / A.difficultyDistance, 0, 1);
        return U.lerp(A.difficultyRange[0], A.difficultyRange[1], t);
      }
      const p = U.clamp((x - this.startX) / this.length, 0, 1);
      return U.clamp(this.baseDifficulty * (0.7 + 0.45 * p), 0, 1);
    }
    ensure(x) {
      let guard = 0;
      while (this.genX < x && guard++ < 5000) this._nextSegment();
    }
    /** Höhenprofil für Vorschaugrafiken */
    profile(n) {
      const end = this.adventure ? 600 : this.finishX;
      const out = [];
      for (let i = 0; i <= n; i++) out.push(this.heightAt((end * i) / n));
      return out;
    }
    maxGradient() {
      let m = 0;
      const end = this.adventure ? 600 : this.finishX;
      for (let x = 0; x < end; x += 2) m = Math.max(m, Math.abs(this.slopeAt(x)));
      return m;
    }

    /* ---------- Generierung ---------- */
    _emit(type, L, f, mask, coinsOk) {
      const dx = this.dx;
      const n = Math.max(1, Math.round(L / dx));
      const L2 = n * dx;
      const x0 = this.genX;
      const nz = this.env.noise;
      for (let k = 1; k <= n; k++) {
        const xl = k * dx;
        const xg = x0 + xl;
        const m = mask ? mask(xl, L2) : 1;
        const noise = nz.amp > 0 ? this.noise(xg / nz.len) * nz.amp * m : 0;
        this.h.push(this.baseY + f(xl) + noise);
      }
      this.baseY += f(L2);
      this.genX = x0 + L2;
      this.segments.push({ type, x0, x1: this.genX });
      if (coinsOk) this._placeCoins(x0, this.genX);
      this._placeFuel(type, x0, this.genX);
      this._planObstacle(type, x0, this.genX);
      this._placeDecos(x0, this.genX);
      if (this.adventure) {
        for (let m = Math.ceil((x0 - this.startX) / 100) * 100; m + this.startX < this.genX; m += 100) {
          if (m > 0) this.markers.push({ x: this.startX + m, label: m + ' m' });
        }
      }
    }

    _nextSegment() {
      const env = this.env;
      const r = this.rng;
      const x = this.genX;
      const d = this.difficultyAt(x);
      const maxS = U.lerp(env.maxSlope[0], env.maxSlope[1], d);

      // Gewichte mit Höhenausgleich (neue Formen: Standardgewichte, falls die Welt keine eigenen hat)
      const w = Object.assign({}, C.terrain.extraWeights, env.weights);
      // anspruchsvolle Formen erst mit steigender Schwierigkeit häufiger
      for (const k of ['drop', 'twin', 'steep', 'gap', 'combo']) if (w[k]) w[k] *= U.clamp(0.35 + d * 1.3, 0, 1.4);
      // weicher Höhenausgleich: Strecke soll im Mittel leicht ansteigen (Bergrennen), nie endlos abfallen
      const dev = this.baseY - (x - this.startX) * C.terrain.riseTrend;
      const up = Math.exp(U.clamp(-dev / 22, -2.5, 2.5));
      for (const k of ['climb', 'steep', 'mesa']) if (w[k]) w[k] *= up;
      for (const k of ['descent', 'drop', 'jump', 'kicker', 'gap']) if (w[k]) w[k] /= up;
      // ruhiger Einstieg nach dem Start
      if (x < this.startX + 60) { w.jump = 0; w.kicker = 0; w.climb *= 0.5; w.descent *= 0.5; w.rough *= 0.3; w.drop = 0; w.gap = 0; w.steep = 0; w.combo = 0; w.twin = 0; }
      // Wiederholungen begrenzen
      if (this.typeCount >= 1 && w[this.lastType] !== undefined && this.lastType !== 'waves' && this.lastType !== 'flat') w[this.lastType] *= 0.25;
      if (this.typeCount >= 2) w[this.lastType] = 0;
      const pairs = Object.keys(w).map((k) => [k, w[k]]).filter((p) => p[1] > 0);
      const type = r.weighted(pairs);
      if (type === this.lastType) this.typeCount++; else { this.typeCount = 0; this.lastType = type; }

      const amp = env.amp;
      const T = C.terrain;
      const kMax = U.lerp(T.crestCurv[0], T.crestCurv[1], d);   // max. Krümmung von Kuppen/Senken (höher = wirft bei Tempo eher ab)
      const capByCurv = (H, L) => Math.min(H, (2 * kMax) / Math.pow(TAU / L, 2));
      const jumpMask = (xl, L) => U.clamp(Math.min(xl, L - xl) / 4, 0, 1) * 0.15;

      switch (type) {
        case 'flat': {
          this._emit(type, r.range(10, 26), () => 0, null, true);
          break;
        }
        case 'waves': {
          const lam = r.range(9, 14);
          const n = r.int(2, 4);
          let A = (0.6 + 1.6 * d) * amp * r.range(0.7, 1.15);
          A = Math.min(A, (0.75 * maxS * lam) / Math.PI);
          A = capByCurv(A, lam);
          this._emit(type, n * lam, (xl) => (A * (1 - Math.cos((TAU * xl) / lam))) / 2, null, true);
          break;
        }
        case 'rollers': {
          const lam = r.range(26, 44);
          const n = r.int(1, 2);
          const sign = r() < 0.62 ? 1 : -1;
          let A = (2.5 + 6 * d) * amp * r.range(0.75, 1.15);
          A = Math.min(A, (0.85 * maxS * lam) / Math.PI);
          A = capByCurv(A, lam);
          this._emit(type, n * lam, (xl) => (sign * A * (1 - Math.cos((TAU * xl) / lam))) / 2, null, true);
          break;
        }
        case 'hill':
        case 'valley': {
          const L = r.range(30, 66);
          let H = (5 + 15 * d) * amp * r.range(0.75, 1.15);
          H = Math.min(H, (maxS * L) / Math.PI);
          H = capByCurv(H, L) * (type === 'valley' ? 0.9 : 1);
          const s = type === 'valley' ? -1 : 1;
          this._emit(type, L, (xl) => (s * H * (1 - Math.cos((TAU * xl) / L))) / 2, null, true);
          break;
        }
        case 'climb':
        case 'descent': {
          const L = r.range(30, 66);
          let H = (7 + 20 * d) * amp * r.range(0.7, 1.15);
          H = Math.min(H, (maxS * 2 * L) / Math.PI);
          const s = type === 'descent' ? -1 : 1;
          this._emit(type, L, (xl) => (s * H * (1 - Math.cos((Math.PI * xl) / L))) / 2, null, true);
          break;
        }
        case 'mesa': {
          const L1 = r.range(16, 26), Lp = r.range(10, 24), L2 = r.range(16, 26);
          let H = (2.5 + 6 * d) * amp * r.range(0.8, 1.1);
          H = Math.min(H, (maxS * 2 * Math.min(L1, L2)) / Math.PI);
          const L = L1 + Lp + L2;
          this._emit(type, L, (xl) => {
            if (xl < L1) return (H * (1 - Math.cos((Math.PI * xl) / L1))) / 2;
            if (xl < L1 + Lp) return H;
            const t = xl - L1 - Lp;
            return H - (H * (1 - Math.cos((Math.PI * t) / L2))) / 2;
          }, null, true);
          break;
        }
        case 'kicker': {
          const Lr = r.range(6, 9);
          const H = r.range(0.5, 1.0) * (0.7 + 0.9 * d);
          const Ll = r.range(9, 15);
          const D = r.range(0.2, 1.0);
          this._emit(type, Lr + Ll, (xl) => {
            if (xl <= Lr) { const t = xl / Lr; return H * t * t; }
            return H - (H + D) * U.smooth(U.clamp((xl - Lr) / Ll, 0, 1));
          }, jumpMask, false);
          this._emit('flat', r.range(6, 12), () => 0, null, true);
          break;
        }
        case 'jump': {
          const H = (2.6 + 4.6 * d) * r.range(0.85, 1.15);
          const sLip = Math.min(0.85, r.range(0.42, 0.6) + 0.18 * d);
          const Lr = (2 * H) / sLip;
          const D = (3 + 11 * d) * amp * r.range(0.7, 1.1);
          const maxSL = Math.min(maxS + 0.12, 0.95);
          const Ll = Math.max(r.range(30, 48), (1.5 * (H + D)) / maxSL);
          this._emit(type, Lr + Ll, (xl) => {
            if (xl <= Lr) { const t = xl / Lr; return H * t * t; }
            return H - (H + D) * U.smooth(U.clamp((xl - Lr) / Ll, 0, 1));
          }, jumpMask, false);
          // Auslauf nach jedem großen Sprung (Fairness)
          this._emit('flat', r.range(12, 20), () => 0, null, true);
          break;
        }
        case 'rough': {
          const L = r.range(18, 34);
          const k = r.int(3, 6);
          const bumps = [];
          for (let i = 0; i < k; i++) {
            const wdt = r.range(2.4, 4.5);
            const c = wdt + ((L - 2 * wdt) * (i + 0.5)) / k + r.range(-1, 1);
            const A = r.range(0.22, 0.6) * (0.75 + 0.9 * d) * (r() < 0.8 ? 1 : -0.6);
            bumps.push([c, wdt, A]);
          }
          this._emit(type, L, (xl) => {
            let y = 0;
            for (const b of bumps) {
              const u = (xl - b[0]) / b[1];
              if (u > -1 && u < 1) y += (b[2] * (1 + Math.cos(Math.PI * u))) / 2;
            }
            return y;
          }, null, true);
          break;
        }
        case 'drop': {
          // Abbruchkante: flache Anfahrt, enge Kante, steiles Gefälle, weicher Auslauf.
          // Mit Tempo fliegt man über die Kante und muss die Nase senken – langsam rollt man sicher hinab.
          const La = r.range(6, 10);
          const sD = Math.min(maxS + 0.1, 0.95) * r.range(0.8, 1);
          const D = (4 + 9 * d) * amp * r.range(0.8, 1.15);
          const Lk = r.range(1.6, 2.6);                       // Kantenrundung (Steigung 0 → -sD)
          const Lo = r.range(8, 12);                          // Auslauf (Steigung -sD → 0)
          const Ls = Math.max(0, (D - (sD * (Lk + Lo)) / 2) / sD);
          const y1 = (-sD * Lk) / 2, y2 = y1 - sD * Ls;
          this._emit(type, La + Lk + Ls + Lo, (xl) => {
            if (xl <= La) return 0;
            const u = xl - La;
            if (u <= Lk) return (-sD * u * u) / (2 * Lk);
            if (u <= Lk + Ls) return y1 - sD * (u - Lk);
            const w2 = Math.min(Lo, u - Lk - Ls);
            return y2 - sD * (w2 - (w2 * w2) / (2 * Lo));
          }, (xl) => U.clamp((xl - La) / 3, 0, 1) * 0.3, true);
          this._emit('flat', r.range(6, 10), () => 0, null, true);
          break;
        }
        case 'twin': {
          // Doppelhügel: zu viel Tempo über den ersten wirft in die Flanke des zweiten
          const L1 = r.range(22, 34), L2 = r.range(22, 34);
          let H1 = (3 + 7 * d) * amp * r.range(0.8, 1.1), H2 = H1 * r.range(0.8, 1.25);
          H1 = capByCurv(Math.min(H1, (maxS * L1) / Math.PI), L1);
          H2 = capByCurv(Math.min(H2, (maxS * L2) / Math.PI), L2);
          this._emit(type, L1 + L2, (xl) => (xl < L1 ? (H1 * (1 - Math.cos((TAU * xl) / L1))) / 2 : (H2 * (1 - Math.cos((TAU * (xl - L1)) / L2))) / 2), null, true);
          break;
        }
        case 'steep': {
          // Steilwand mit Kuppe: Gas dosieren (sonst steigt die Front), oben wartet eine Kante
          const L = r.range(20, 34) * (0.6 + 0.4 * d);
          const s1 = Math.min(maxS + 0.08 * d, 0.98) * r.range(0.92, 1.03);
          const H = (s1 * 2 * L) / Math.PI * r.range(0.85, 1);
          this._emit(type, L, (xl) => (H * (1 - Math.cos((Math.PI * xl) / L))) / 2, null, true);
          const Lt = r.range(14, 22);
          const Hd = Math.min(H * r.range(0.25, 0.5), (maxS * 2 * Lt) / Math.PI);
          this._emit('crest', Lt, (xl) => (-Hd * (1 - Math.cos((Math.PI * xl) / Lt))) / 2, null, true);
          break;
        }
        case 'gap': {
          // Sprung über eine Senke: Rampe, Grube (befahrbar, falls zu kurz), Landehang abwärts
          const H = (1.8 + 2.6 * d) * r.range(0.9, 1.1);
          const sLip = Math.min(0.75, r.range(0.4, 0.55) + 0.12 * d);
          const Lr = (2 * H) / sLip;
          const P = r.range(1.2, 2.2) + 1.2 * d;                  // Grubentiefe unter Ausgangsniveau
          const Hc = H * r.range(0.45, 0.6);                      // Kuppe des Landehangs
          const Lb = Math.max(4, (Math.PI * (H + P)) / 2.4);      // Rampenrückseite
          const Lf = r.range(2, 5) + 4 * d;                       // Grubenboden
          const Lu = Math.max(6, (Math.PI * (P + Hc)) / (2 * Math.min(maxS, 0.7)));
          const Lland = r.range(22, 30);
          const Dl = (2 + 6 * d) * amp;
          const xa = Lr, xb = xa + Lb, xc = xb + Lf, xd = xc + Lu, L = xd + Lland;
          const half = (a0, a1, t) => a0 + (a1 - a0) * (1 - Math.cos(Math.PI * U.clamp(t, 0, 1))) / 2;
          this._emit(type, L, (xl) => {
            if (xl <= xa) { const t = xl / Lr; return H * t * t; }
            if (xl <= xb) return half(H, -P, (xl - xa) / Lb);
            if (xl <= xc) return -P;
            if (xl <= xd) return half(-P, Hc, (xl - xc) / Lu);
            return half(Hc, Hc - Dl, (xl - xd) / Lland);
          }, jumpMask, false);
          this._emit('flat', r.range(10, 16), () => 0, null, true);
          break;
        }
        case 'combo': {
          // Kombination ohne Pause: Welle → Kicker → Gefälle oder Hügel → Sprung
          const pickC = r.pick(['wk', 'hj', 'rd']);
          if (pickC === 'wk') {
            const lam = r.range(8, 11); const A = capByCurv(Math.min((0.7 + 1.3 * d) * amp, (0.7 * maxS * lam) / Math.PI), lam);
            this._emit('waves', 2 * lam, (xl) => (A * (1 - Math.cos((TAU * xl) / lam))) / 2, null, true);
            const Lr = r.range(6, 8), Hk = r.range(0.7, 1.2) * (0.8 + d), Ll = r.range(14, 20), D = (3 + 6 * d) * amp;
            this._emit('kicker', Lr + Ll, (xl) => (xl <= Lr ? Hk * (xl / Lr) * (xl / Lr) : Hk - (Hk + D) * U.smooth(U.clamp((xl - Lr) / Ll, 0, 1))), jumpMask, false);
          } else if (pickC === 'hj') {
            const L = r.range(28, 40); const H = capByCurv(Math.min((4 + 8 * d) * amp, (maxS * L) / Math.PI), L);
            this._emit('hill', L, (xl) => (H * (1 - Math.cos((TAU * xl) / L))) / 2, null, true);
            const Hj = (2.2 + 3 * d), sLip = Math.min(0.75, 0.45 + 0.15 * d), Lr = (2 * Hj) / sLip, D = (3 + 8 * d) * amp;
            const Ll = Math.max(30, (1.5 * (Hj + D)) / Math.min(maxS + 0.12, 0.95));
            this._emit('jump', Lr + Ll, (xl) => (xl <= Lr ? Hj * (xl / Lr) * (xl / Lr) : Hj - (Hj + D) * U.smooth(U.clamp((xl - Lr) / Ll, 0, 1))), jumpMask, false);
          } else {
            const L = r.range(26, 40); let A = Math.min((3 + 6 * d) * amp, (0.85 * maxS * L) / Math.PI); A = capByCurv(A, L);
            this._emit('rollers', L, (xl) => (A * (1 - Math.cos((TAU * xl) / L))) / 2, null, true);
            const Ld = r.range(26, 44); const Hd = Math.min((6 + 12 * d) * amp, (maxS * 2 * Ld) / Math.PI);
            this._emit('descent', Ld, (xl) => (-Hd * (1 - Math.cos((Math.PI * xl) / Ld))) / 2, null, true);
          }
          this._emit('flat', r.range(8, 14), () => 0, null, true);
          break;
        }
      }
    }

    _placeFuel(type, x0, x1) {
      if (this.mode === 'attract' || this.nextFuelX > x1) return;
      if (!this.adventure && this.nextFuelX > this.finishX - 60) return;
      // nicht in Sprung-/Kantenstücken; dort wird der Kanister auf das nächste ruhige Stück verschoben
      if (['jump', 'gap', 'drop', 'kicker', 'start', 'finish'].includes(type)) return;
      for (let x = Math.max(x0 + 1, this.nextFuelX); x < x1 - 1; x += 0.5) {
        if (Math.abs(this.slopeAt(x)) > 0.32) continue;
        this.fuels.push({ x, y: this.heightAt(x) + 0.9 });
        const F = C.fuel;
        if (this.adventure) this.fuelGap = Math.min(F.advMax, this.fuelGap * F.advGrowth);
        else this.fuelGap = this.fuelRng.range(F.raceSpacing[0], F.raceSpacing[1]) * this.fuelScale;
        this.nextFuelX = x + this.fuelGap;
        return;
      }
    }

    _planObstacle(type, x0, x1) {
      if (this.obsMode === 'none' || ['start', 'finish', 'jump', 'gap', 'drop', 'kicker'].includes(type)) return;
      const OB = C.obstacles;
      let want = false;
      if (this.obsMode === 'adventure') want = x1 > this.nextObsX;
      else want = this.obsTargets.length > 0 && x1 > this.obsTargets[0];
      if (!want) return;
      const opts = OB.env[this.envId] || [];
      if (!opts.length) return;
      const r = this.obsRng;
      const [kind, look] = r.pick(opts).split(':');
      const from = Math.max(x0 + 2, this.obsMode === 'adventure' ? this.nextObsX : this.obsTargets[0]);
      const clearOk = (x) => {
        if (Math.abs(x - this.startX) < 60) return false;
        if (!this.adventure && (x > this.finishX - 50 || this.checkpoints.some((c) => Math.abs(c - x) < OB.keepClear))) return false;
        if (this.fuels.some((f) => Math.abs(f.x - x) < OB.keepClear)) return false;
        if (this.obstacles.some((o) => Math.abs(o.x - x) < 120)) return false;
        return true;
      };
      const flatAround = (x, a, b, lim) => { for (let u = x + a; u <= x + b; u += 0.5) if (Math.abs(this.slopeAt(u)) > lim) return false; return true; };
      let spot = null;
      for (let x = from; x < x1 - 2 && spot === null; x += 0.5) {
        if (!clearOk(x)) continue;
        if (kind === 'tree' && flatAround(x, -4, 8, 0.28)) spot = x;
        else if (kind === 'gate' && flatAround(x, -6, 6, 0.16)) spot = x;
        else if (kind === 'fall' && flatAround(x, -3, 6, 0.35)) spot = x;
        else if (kind === 'roller') {
          // Hang, der zur Anfahrt hin abfällt (Brocken rollt dem Fahrer entgegen)
          let ok = true;
          for (let u = x - 10; u <= x; u += 1) { const sl = this.slopeAt(u); if (sl < 0.18 || sl > 0.85) { ok = false; break; } }
          if (ok) spot = x;
        }
      }
      if (spot === null) return;   // nächstes Segment versuchen
      const o = { kind, look: look || kind, x: spot };
      if (kind === 'tree') { const T = OB.tree; Object.assign(o, { h: r.range(T.h[0], T.h[1]), r: T.r, trigger: T.trigger, shake: T.shake, fallT: T.fallT, logR: T.logR, hitW: T.hitW, crown: r.range(1.2, 1.6) }); }
      else if (kind === 'gate') { const G = OB.gate; Object.assign(o, { h: G.h, openY: G.openY, move: G.move, openT: r.range(G.openT[0], G.openT[1]), warnT: G.warnT, closedT: r.range(G.closedT[0], G.closedT[1]), clear: G.clear, phase: r.range(0, 3) }); }
      else if (kind === 'roller') Object.assign(o, OB.rollers[o.look]);
      else if (kind === 'fall') { const F = OB.fall[o.look]; Object.assign(o, { n: r.int(F.n[0], F.n[1]), rMin: F.r[0], rMax: F.r[1], height: F.height, trigger: F.trigger, warn: F.warn, lava: o.look === 'lava' }); }
      this.obstacles.push(o);
      if (this.obsMode === 'adventure') {
        this.nextObsX = spot + r.range(OB.advGap[0], OB.advGap[1]);
        if (r() < OB.advSkip) this.nextObsX += r.range(OB.advGap[0], OB.advGap[1]);   // unregelmäßig: manchmal länger nichts
      } else this.obsTargets.shift();
    }

    _placeCoins(x0, x1) {
      const r = this.coinRng;
      const chance = this.adventure ? C.adventure.coinGroupChance : C.economy.coinGroupChanceRace;
      if (this.mode === 'attract') return;
      if (x0 < this.startX + 8) return;
      if (!this.adventure && x1 > this.finishX - 6) return;
      if (r() > chance) return;
      const n = this.adventure ? r.int(4, 7) : r.int(5, 8);
      const sp = 1.7;
      const len = (n - 1) * sp;
      if (x1 - x0 < len + 4) return;
      const sx = r.range(x0 + 2, x1 - len - 2);
      const value = this._coinValue(sx);
      for (let i = 0; i < n; i++) {
        const cx = sx + i * sp;
        this.coins.push({ x: cx, y: this.heightAt(cx) + 0.95, v: value, taken: false });
      }
    }
    _coinValue(x) {
      if (!this.adventure) return C.economy.coinValueRace;
      const dist = x - this.startX;
      let v = 5;
      for (const p of C.adventure.coinValues) if (dist >= p[0]) v = p[1];
      return v;
    }

    _placeDecos(x0, x1) {
      const r = this.decoRng;
      const env = this.env;
      const dens = env.decoDensity;
      while (this.nextDecoX < x1) {
        const x = this.nextDecoX;
        this.nextDecoX += r.range(2.5, 2 / dens);
        if (x < x0) continue;
        if (!this.adventure && Math.abs(x - this.finishX) < 8) continue;
        if (Math.abs(x - this.startX) < 5) continue;
        const sl = Math.abs((this.heightAt(x + 0.5) - this.heightAt(x - 0.5)));
        if (sl > 0.45) continue;
        this.decos.push({ x, kind: r.weighted(env.deco), s: r.range(0.8, 1.25), flip: r() < 0.5, depth: r.range(0, 1) });
      }
    }
  }

  GS.Track = Track;
})(window.GS = window.GS || {});

</script>
<script>
/* =====================================================================
   Physikwelt: Planck (Box2D) + Streckenstücke als Kettenformen
   ===================================================================== */
'use strict';
(function (GS) {
  const C = GS.CONFIG;

  class Physics {
    constructor(track) {
      const pl = window.planck;
      this.pl = pl;
      this.track = track;
      this.world = new pl.World({ gravity: pl.Vec2(0, -C.physics.gravity) });
      this.chunks = new Map();
      this.minChunk = 0;
      // Wand am Streckenanfang
      const h0 = track.heightAt(0);
      const wall = this.world.createBody({ userData: { terrain: true } });
      wall.createFixture(new pl.Edge(pl.Vec2(0, h0 - 2), pl.Vec2(0, h0 + 60)), { friction: 0.2, userData: { terrain: true } });
    }

    /** Physik-Strecke im Bereich [minX, maxX] bereitstellen, alte Stücke entfernen */
    sync(minX, maxX) {
      const CL = C.terrain.chunkLength;
      const i0 = Math.max(0, Math.floor(minX / CL));
      const i1 = Math.max(0, Math.floor(maxX / CL));
      this.track.ensure((i1 + 1) * CL + 4);
      for (let i = i0; i <= i1; i++) if (!this.chunks.has(i)) this._createChunk(i);
      if (this.track.adventure) {
        for (const [i, body] of this.chunks) {
          if (i < i0) { this.world.destroyBody(body); this.chunks.delete(i); }
        }
      }
    }

    _createChunk(i) {
      const pl = this.pl;
      const tr = this.track;
      const dx = tr.dx;
      const n = Math.round(C.terrain.chunkLength / dx);
      const s0 = i * n, s1 = (i + 1) * n;
      const verts = [];
      for (let s = s0; s <= s1; s++) verts.push(pl.Vec2(s * dx, tr.h[s]));
      const chain = new pl.Chain(verts, false);
      if (s0 > 0) chain.setPrevVertex(pl.Vec2((s0 - 1) * dx, tr.h[s0 - 1]));
      chain.setNextVertex(pl.Vec2((s1 + 1) * dx, tr.h[s1 + 1]));
      const body = this.world.createBody({ userData: { terrain: true } });
      body.createFixture(chain, { friction: tr.env.grip, restitution: 0, userData: { terrain: true } });
      this.chunks.set(i, body);
    }

    step(dt) {
      this.world.step(dt, C.physics.velocityIterations, C.physics.positionIterations);
    }
  }

  GS.Physics = Physics;
})(window.GS = window.GS || {});

</script>
<script>
/* =====================================================================
   Hindernisse: selten, umgebungspassend, physikalisch und fair.
   - Planung (wo) passiert im Streckengenerator (Track._planObstacle).
   - Hier: Physikkörper erzeugen/entfernen, Auslöser, Bewegung.
   Arten:
     tree     Wald: Baum am Fahrbahnrand knarrt, wackelt und kippt quer über die Straße (zum Betrachter hin);
              danach liegt der Stamm als runder Buckel auf der Fahrbahn. Wer beim Aufschlag darunter ist, wird getroffen.
     gate     Industrie: Rolltor mit Warnlicht, schließt nie auf ein Fahrzeug (Sicherheitsstopp)
     roller   Heuballen / Felsbrocken / Schneeball / Fass rollen einen Hang herab
     fall     Steinschlag (Gebirge) bzw. Lavabrocken (Vulkan) mit Vorwarnung
   Alle Körper zählen als Untergrund (Räder fahren darauf, Kopfkontakt = Unfall).
   ===================================================================== */
'use strict';
(function (GS) {
  const C = GS.CONFIG;
  const U = GS.U;

  class Obstacles {
    constructor(session) {
      this.s = session;
      this.track = session.track;
      this.world = session.phys.world;
      this.pl = window.planck;
      this.list = this.track.obstacles;   // Planungsdaten aus dem Generator
      this.track.live = this;               // KI liest Tore über die Strecke
    }

    /** Körper in Reichweite anlegen, weit zurückliegende (Adventure) entfernen */
    sync(minX, maxX) {
      for (const o of this.list) {
        if (!o.made && o.x < maxX && o.x > minX - 20) this._make(o);
        else if (o.made && !o.gone && this.track.adventure && o.x < minX - C.terrain.keepBehind) this._remove(o);
      }
    }

    _body(type, x, y, angle) {
      const b = this.world.createBody({ type, position: this.pl.Vec2(x, y), angle: angle || 0, allowSleep: type !== 'dynamic' });
      b.setUserData({ terrain: true, obstacle: true });
      return b;
    }
    _fix(b, shape, o) {
      return b.createFixture(shape, Object.assign({ friction: 0.8, restitution: 0.05, userData: { terrain: true, obstacle: true } }, o || {}));
    }

    _make(o) {
      o.made = true;
      const pl = this.pl, V = pl.Vec2, tr = this.track;
      const gy = tr.heightAt(o.x);
      if (o.kind === 'tree') {
        // steht am Fahrbahnrand (kein Körper); der liegende Stamm entsteht beim Aufschlag
        Object.assign(o, { state: 'stand', t: 0, fall: 0 });
      } else if (o.kind === 'gate') {
        const b = this._body('kinematic', o.x, gy + o.openY + o.h / 2);
        this._fix(b, new pl.Box(0.18, o.h / 2), { friction: 0.6 });
        Object.assign(o, { body: b, gy, y: o.openY, state: 'open', t: o.phase });
      } else if (o.kind === 'roller') {
        const b = this._body('dynamic', o.x, tr.heightAt(o.x) + o.r + 0.02);
        this._fix(b, new pl.Circle(o.r), { density: o.mass / (Math.PI * o.r * o.r), friction: o.friction, restitution: 0.12 });
        b.setAwake(false);
        b.setAngularDamping(0.1);
        b.setLinearDamping(0.05);
        // bis zum Auslösen festhalten
        b.setType('static');
        Object.assign(o, { body: b, state: 'wait', t: 0 });
      } else if (o.kind === 'fall') {
        Object.assign(o, { state: 'wait', t: 0, rocks: [] });
      }
    }

    _remove(o) {
      o.gone = true;
      const w = this.world;
      try {
        if (o.joint) w.destroyJoint(o.joint);
        if (o.anchor) w.destroyBody(o.anchor);
        if (o.body) w.destroyBody(o.body);
        for (const r of o.rocks || []) w.destroyBody(r.body);
      } catch (_) { /* ignorieren */ }
      o.body = null; o.rocks = [];
    }

    /** nächster Fahrer vor dem Hindernis (Abstand in m, nur von links kommend) */
    _approach(o) {
      let best = Infinity;
      for (const r of this.s.racers) {
        const d = o.x - r.vehicle.x;
        if (d > -2 && d < best) best = d;
      }
      return best;
    }
    _playerDist(o) { return this.s.player ? Math.abs(o.x - this.s.player.vehicle.x) : 999; }

    step(dt) {
      const V = this.pl.Vec2;
      for (const o of this.list) {
        if (!o.made || o.gone) continue;
        o.t += dt;
        const near = this._approach(o);
        if (o.kind === 'tree') {
          if (o.state === 'stand' && near < o.trigger) { o.state = 'shake'; o.t = 0; this._ev(o, 'warn'); }
          else if (o.state === 'shake' && o.t > o.shake) { o.state = 'fall'; o.t = 0; this._ev(o, 'fall'); }
          else if (o.state === 'fall') {
            // Kippen wie ein umfallender Stab: langsam beginnend, dann immer schneller (0 → 90°)
            o.fall = Math.min(1, Math.pow(o.t / o.fallT, 2));
            if (o.fall >= 1) this._treeDown(o);
          }
        } else if (o.kind === 'gate') {
          this._gate(o, dt);
        } else if (o.kind === 'roller') {
          if (o.state === 'wait' && near < o.trigger) {
            o.state = 'roll'; o.t = 0;
            o.body.setType('dynamic');
            o.body.setAwake(true);
            o.body.setLinearVelocity(V(-o.push, 0));
            o.body.setAngularVelocity(o.push / o.r);
            this._ev(o, 'roll');
          }
        } else if (o.kind === 'fall') {
          if (o.state === 'wait' && near < o.trigger) { o.state = 'warn'; o.t = 0; this._ev(o, 'warn'); }
          else if (o.state === 'warn' && o.t > o.warn) {
            o.state = 'drop'; o.t = 0;
            const tr = this.track, rng = U.rng(Math.round(o.x * 7) + 3);
            for (let i = 0; i < o.n; i++) {
              const rx = o.x + rng.range(-1.5, 5);
              const r = rng.range(o.rMin, o.rMax);
              const b = this._body('dynamic', rx + (o.lava ? 6 : 0), tr.heightAt(rx) + o.height + rng.range(0, 3));
              this._fix(b, new this.pl.Circle(r), { density: 1.2 / (Math.PI * r * r) * (r / 0.4), friction: 0.9, restitution: 0.15 });
              b.setLinearVelocity(V(o.lava ? rng.range(-4.5, -2.5) : rng.range(-1.2, 0.4), o.lava ? rng.range(2, 5) : 0));
              b.setAngularVelocity(rng.range(-3, 3));
              o.rocks.push({ body: b, r, landed: false });
            }
          } else if (o.state === 'drop') {
            for (const rk of o.rocks) {
              if (rk.landed) continue;
              for (let ce = rk.body.getContactList(); ce; ce = ce.next) {
                const ud = ce.other.getUserData();
                if (ce.contact.isTouching() && ud && ud.terrain && !ud.obstacle) { rk.landed = true; this._ev(o, 'impact', rk.body.getPosition().x); break; }
              }
            }
          }
        }
      }
    }

    /** Baum schlägt auf: wer direkt darunter ist, wird getroffen; danach liegt der Stamm als Buckel quer */
    _treeDown(o) {
      o.state = 'down';
      for (const r of this.s.racers) {
        const v = r.vehicle;
        if (!v.crashed && Math.abs(v.x - o.x) < o.hitW) v._crash('tree');
      }
      const gy = this.track.heightAt(o.x);
      const b = this._body('static', o.x, gy + o.logR * 0.8);
      this._fix(b, new this.pl.Circle(o.logR), { friction: 1.0 });
      o.body = b;
      this._ev(o, 'land');
    }

    /** Rolltor: offen → (Warnlicht) → schließt → zu → öffnet. Schließt nie, solange ein Fahrzeug darunter ist. */
    _gate(o, dt) {
      const under = this.s.racers.some((r) => Math.abs(r.vehicle.x - o.x) < o.clear);
      const sp = o.h / o.move;
      let vy = 0;
      if (o.state === 'open') { if (o.t > o.openT) { o.state = 'warn'; o.t = 0; } }
      else if (o.state === 'warn') { if (o.t > o.warnT) { o.state = 'closing'; o.t = 0; this._ev(o, 'close'); } }
      else if (o.state === 'closing') {
        if (under) { o.state = 'opening'; o.t = 0; }      // Sicherheitsstopp: fährt wieder hoch
        else { vy = -sp; if (o.y <= 0.02) { o.y = 0.02; o.state = 'closed'; o.t = 0; vy = 0; } }
      } else if (o.state === 'closed') { if (o.t > o.closedT) { o.state = 'opening'; o.t = 0; this._ev(o, 'open'); } }
      else if (o.state === 'opening') { vy = sp; if (o.y >= o.openY) { o.y = o.openY; o.state = 'open'; o.t = 0; vy = 0; } }
      o.y = U.clamp(o.y + vy * dt, 0.02, o.openY);
      o.body.setLinearVelocity(this.pl.Vec2(0, vy));
      // Lage exakt nachführen (kinematisch, keine Drift)
      o.body.setTransform(this.pl.Vec2(o.x, o.gy + o.y + o.h / 2), 0);
    }

    _ev(o, phase, x) {
      this.s.events.push({ type: 'obstacle', kind: o.kind, look: o.look, phase, x: x !== undefined ? x : o.x, near: this._playerDist(o) });
    }

    /** Für die KI: kippender Baum voraus (Abstand) – dann abwarten, bis er liegt */
    treeAhead(x, dist) {
      for (const o of this.list) {
        if (o.kind !== 'tree' || !o.made || (o.state !== 'shake' && o.state !== 'fall')) continue;
        const d = o.x - x;
        if (d > 0 && d < dist) return d;
      }
      return null;
    }

    /** Für die KI: Tor in diesem Bereich, das (bald) geschlossen ist? */
    gateAhead(x, dist) {
      for (const o of this.list) {
        if (o.kind !== 'gate' || !o.made || o.gone) continue;
        const d = o.x - x;
        if (d < 0 || d > dist) continue;
        const shut = o.state === 'warn' || o.state === 'closing' || o.state === 'closed' || (o.state === 'opening' && o.y < 2.2);
        if (shut) return d;
      }
      return null;
    }

    destroy() { for (const o of this.list) if (o.made && !o.gone) this._remove(o); this.track.live = null; }
  }

  GS.Obstacles = Obstacles;
})(window.GS = window.GS || {});

</script>
<script>
/* =====================================================================
   Fahrzeug: Karosserie + Achsen (Prismatic mit Federweg-Grenzen)
   + Räder (Revolute mit Motor). Feder/Dämpfer wirkt als Kraft.
   Steuerung: Gas/Bremse am Boden, Rotation in der Luft.
   ===================================================================== */
'use strict';
(function (GS) {
  const C = GS.CONFIG;
  const U = GS.U;

  /* ---------------- Werte aus Fahrzeug + Upgrades ---------------- */
  const VP = {};
  VP.def = (id) => C.vehicles.find((v) => v.id === id) || C.vehicles[0];
  VP.levelsOf = (levels) => {
    const out = {};
    for (const c of C.upgrades.categories) out[c.id] = U.clamp((levels && levels[c.id]) | 0 || 1, 1, C.upgrades.maxLevel);
    return out;
  };
  VP.uniformLevels = (lvl) => {
    const out = {};
    for (const c of C.upgrades.categories) out[c.id] = U.clamp(lvl | 0 || 1, 1, C.upgrades.maxLevel);
    return out;
  };
  VP.compute = function (def, levels) {
    const E = C.upgrades.effects;
    const lv = VP.levelsOf(levels);
    const k = (id) => lv[id] - 1;
    let unsprung = 0;
    for (const w of def.wheels) unsprung += w.mass * 1.3;
    return {
      torque: def.engine.torque * (1 + E.engineTorque * k('engine')),
      topSpeed: def.engine.topSpeed * (1 + E.engineSpeed * k('engine')),
      suspHz: def.susp.hz,
      suspDamp: Math.min(1.2, def.susp.damp + E.suspDamp * k('suspension')),
      suspUp: def.susp.up * (1 + E.suspTravel * k('suspension')),
      suspDown: def.susp.down * (1 + E.suspTravel * k('suspension')),
      grip: def.grip * (1 + E.tireGrip * k('tires')),
      comY: def.chassis.comY - E.stabCom * k('stability'),
      angDamp: E.stabAngDamp * k('stability'),
      airAccel: def.air.accel * (1 + E.airAccel * k('air')),
      airSpin: def.air.spin * (1 + E.airSpin * k('air')),
      brakeTorque: def.brake.torque * (1 + E.brakeTorque * k('brakes')),
      reverse: def.brake.reverse * (1 + E.brakeReverse * k('brakes')),
      groundTilt: def.groundTilt,
      lift: (def.balance ? def.balance.lift : 0) * Math.max(0, 1 - E.stabLift * k('stability')),
      liftAngle: def.balance ? def.balance.angle : 0.4,
      liftOver: def.balance && def.balance.over !== undefined ? def.balance.over : 1,
      totalMass: def.chassis.mass + unsprung,
      fuelUse: def.fuel || 1,
      drag: def.drag || 1,
    };
  };

  /** Anzeige-Werte (echte Einheiten) + Balken 0..1, abgeleitet aus der Physik */
  VP.stats = function (def, levels) {
    const p = VP.compute(def, levels);
    const g = C.physics.gravity;
    const rDrive = def.wheels.reduce((a, w) => a + w.r * w.drive, 0) / def.wheels.reduce((a, w) => a + w.drive, 0);
    const rAvg = def.wheels.reduce((a, w) => a + w.r, 0) / def.wheels.length;
    const accel = p.torque / rDrive / p.totalMass;             // m/s²
    const climb = Math.min(1, accel / g);                      // max. Steigfähigkeit (sin)
    const brake = p.brakeTorque / rAvg / p.totalMass;
    const travel = p.suspUp + p.suspDown;
    const n = (v, a, b) => U.clamp((v - a) / (b - a), 0.04, 1);
    return [
      { id: 'power', label: 'Motor', value: Math.round(p.torque * 10) + ' Nm', bar: n(climb, 0.35, 1.0) },
      { id: 'speed', label: 'Geschwindigkeit', value: Math.round(p.topSpeed * 3.6) + ' km/h', bar: n(p.topSpeed, 12, 32) },
      { id: 'accel', label: 'Beschleunigung', value: accel.toFixed(1).replace('.', ',') + ' m/s²', bar: n(accel, 3, 12) },
      { id: 'grip', label: 'Grip', value: p.grip.toFixed(2).replace('.', ','), bar: n(p.grip, 0.85, 1.65) },
      { id: 'susp', label: 'Federung', value: Math.round(travel * 100) + ' cm', bar: n(travel * (0.6 + p.suspDamp * 0.6), 0.15, 0.95) },
      { id: 'weight', label: 'Gewicht', value: U.fmt(p.totalMass * 100) + ' kg', bar: n(p.totalMass, 3, 28) },
      { id: 'air', label: 'Luftkontrolle', value: Math.round((p.airSpin * 180) / Math.PI) + ' °/s', bar: n(p.airAccel * p.airSpin, 8, 70) },
