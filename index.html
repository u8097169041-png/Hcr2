      { id: 'brake', label: 'Bremsen', value: brake.toFixed(1).replace('.', ',') + ' m/s²', bar: n(brake, 2, 11) },
      { id: 'fuel', label: 'Sparsamkeit', value: Math.round((1 / (C.fuel.idle + C.fuel.gas) / p.fuelUse)) + ' s Vollgas', bar: n(1 / p.fuelUse, 0.6, 1.6) },
    ];
  };

  function polyArea(poly) {
    let a = 0;
    for (let i = 0; i < poly.length; i++) {
      const p = poly[i], q = poly[(i + 1) % poly.length];
      a += p[0] * q[1] - q[0] * p[1];
    }
    return Math.abs(a) / 2;
  }

  function isTerrain(fixtureOrBody) {
    const ud = fixtureOrBody && fixtureOrBody.getUserData();
    return !!(ud && ud.terrain);
  }

  /* ---------------- Fahrzeug ---------------- */
  class Vehicle {
    constructor(physics, def, levels, opts) {
      opts = opts || {};
      const pl = window.planck;
      const V = pl.Vec2;
      this.pl = pl;
      this.phys = physics;
      this.world = physics.world;
      this.def = def;
      this.levels = VP.levelsOf(levels);
      this.p = VP.compute(def, this.levels);
      this.input = { gas: false, brake: false };
      this.controlEnabled = true;
      this.events = [];
      this.time = 0;

      const P = C.physics;
      const world = this.world;
      const ch = world.createBody({ type: 'dynamic', position: V(0, 60), allowSleep: false });
      this.chassis = ch;
      let area = 0;
      for (const poly of def.chassis.parts) area += polyArea(poly);
      for (const poly of def.chassis.crash) area += polyArea(poly);
      const dens = def.chassis.mass / area;
      const fopts = (kind) => ({ density: dens, friction: 0.45, restitution: 0.08, filterGroupIndex: -1, userData: { kind } });
      for (const poly of def.chassis.parts) ch.createFixture(new pl.Polygon(poly.map((v) => V(v[0], v[1]))), fopts('body'));
      for (const poly of def.chassis.crash) ch.createFixture(new pl.Polygon(poly.map((v) => V(v[0], v[1]))), fopts('crash'));
      for (const sk of def.chassis.skids || []) {
        ch.createFixture(new pl.Circle(V(sk.x, sk.y), sk.r), { density: 0, friction: 0.05, restitution: 0.1, filterGroupIndex: -1, userData: { kind: 'skid' } });
      }
      if (def.head && def.head.crash) {
        ch.createFixture(new pl.Circle(V(def.head.x, def.head.y), def.head.r), { density: 0, isSensor: true, filterGroupIndex: -1, userData: { kind: 'crash' } });
      }
      // Schwerpunkt verschieben (Stabilität)
      const md = { mass: 0, center: V(0, 0), I: 0 };
      ch.getMassData(md);
      const c0 = md.center;
      const Icom = md.I - md.mass * (c0.x * c0.x + c0.y * c0.y);
      const nc = V(c0.x, c0.y + this.p.comY);
      ch.setMassData({ mass: md.mass, center: nc, I: Icom + md.mass * (nc.x * nc.x + nc.y * nc.y) });
      this.com = { x: nc.x, y: nc.y };

      // Räder
      this.wheels = [];
      const xs = def.wheels.map((w) => w.x);
      const xr = Math.min.apply(null, xs), xf = Math.max.apply(null, xs);
      let Isys = Icom;
      const omega = 2 * Math.PI * this.p.suspHz;
      for (let i = 0; i < def.wheels.length; i++) {
        const wd = def.wheels[i];
        const pos = V(wd.x, 60 + wd.y);
        const axle = world.createBody({ type: 'dynamic', position: pos, allowSleep: false });
        axle.setMassData({ mass: wd.mass * 0.3, center: V(0, 0), I: 0.02 * wd.mass });
        const wheel = world.createBody({ type: 'dynamic', position: pos, allowSleep: false, angularDamping: 0.02 });
        wheel.createFixture(new pl.Circle(wd.r), {
          density: wd.mass / (Math.PI * wd.r * wd.r), friction: this.p.grip, restitution: 0.04,
          filterGroupIndex: -1, userData: { kind: 'wheel', idx: i },
        });
        const pj = world.createJoint(new pl.PrismaticJoint({
          enableLimit: true, lowerTranslation: -this.p.suspDown, upperTranslation: this.p.suspUp, enableMotor: false,
        }, ch, axle, pos, V(0, 1)));
        const rj = world.createJoint(new pl.RevoluteJoint({ enableMotor: true, maxMotorTorque: 0, motorSpeed: 0 }, axle, wheel, pos));
        // Federanteil nach Schwerpunktlage
        let share = 0.5;
        if (def.wheels.length > 2) share = 1 / def.wheels.length;
        else {
          if (xf - xr > 0.01) share = wd.x === xr ? (xf - nc.x) / (xf - xr) : (nc.x - xr) / (xf - xr);
          share = U.clamp(share, 0.2, 0.8);
        }
        const m = def.chassis.mass * share;
        const k = m * omega * omega;
        const cDamp = 2 * this.p.suspDamp * Math.sqrt(k * m);
        const dxw = wd.x - nc.x, dyw = wd.y - nc.y;
        Isys += wd.mass * 1.3 * (dxw * dxw + dyw * dyw);
        this.wheels.push({
          def: wd, axle, body: wheel, pj, rj, k, c: cDamp, pre: m * P.gravity,
          mount: V(wd.x, wd.y), contact: false, compress: 0, spin: 0,
        });
      }
      this.Isys = Isys;
      // Schwerpunkthöhe über dem Boden (für die Gewichtsverlagerung)
      let low = 0;
      for (const wd of def.wheels) low = Math.min(low, wd.y - wd.r);
      this.comHeight = nc.y - low;
      this.wheelSpan = Math.max(0.5, xf - xr);
      this.rearL = Math.max(0.2, nc.x - xr);
      const rAvgAll = def.wheels.reduce((a, w) => a + w.r, 0) / def.wheels.length;
      this.rollFactor = def.look === 'tracked' ? C.physics.rollTracked : U.clamp(C.physics.rollRef / rAvgAll, 0.55, 1.4);
      this.frontL = Math.max(0.2, xf - nc.x);

      // Zustand
      this.crashed = false;
      this.crashReason = '';
      this.grounded = false;
      this.bothGrounded = false;
      this.groundTime = 0;
      this.airTimer = 0;
      this.inAir = false;
      this.takeoffAngle = 0;
      this.lastAirVel = { x: 0, y: 0 };
      this.maxAirHeight = 0;
      this.pending = null;
      this.flippedTimer = 0;
      this.rpm = 0;
      this.slip = 0;
      this.brakingHard = false;
      this.noFuel = false;          // Tank leer → kein Antrieb (Bremse und Luftkontrolle bleiben)
      this.launchRpm = 0;           // Drehzahl im Countdown (Startfenster)
      this.launchMul = 1;           // Motorkraft-Faktor direkt nach dem Start (abgewürgt)
      this.launchMulT = 0;
      if (opts.x !== undefined) this.placeAt(opts.x);
    }

    /** absolute Neigung, ab der das Fahrzeug um eine Achse (Abstand L, Schwerpunkthöhe h) kippt,
        wenn es mit a beschleunigt bzw. bremst: L·cos t − h·sin t = a·h/g */
    _tipTilt(L, h, a) {
      const R = Math.hypot(L, h);
      const k = (a * h) / C.physics.gravity;
      return Math.acos(U.clamp(k / R, -1, 1)) - Math.atan2(h, L);
    }

    get x() { return this.chassis.getPosition().x; }
    get y() { return this.chassis.getPosition().y; }
    get angle() { return this.chassis.getAngle(); }
    get vel() { return this.chassis.getLinearVelocity(); }
    get speed() { const v = this.chassis.getLinearVelocity(); return Math.hypot(v.x, v.y); }

    /** Fahrzeug auf die Strecke setzen (Start/Respawn) */
    placeAt(x) {
      const V = this.pl.Vec2;
      const tr = this.phys.track;
      const def = this.def;
      const span = Math.max(1, (def.wheels[def.wheels.length - 1].x - def.wheels[0].x) / 2);
      const a = Math.atan((tr.heightAt(x + span) - tr.heightAt(x - span)) / (2 * span));
      const ca = Math.cos(a), sa = Math.sin(a);
      let oy = -Infinity;
      for (const w of def.wheels) {
        const wx = x + ca * w.x - sa * w.y;
        const need = tr.heightAt(wx) + w.r - (sa * w.x + ca * w.y);
        oy = Math.max(oy, need);
      }
      oy += 0.06;
      const ch = this.chassis;
      ch.setTransform(V(x, oy), a);
      ch.setLinearVelocity(V(0, 0));
      ch.setAngularVelocity(0);
      for (const w of this.wheels) {
        const p = ch.getWorldPoint(w.mount);
        w.axle.setTransform(p, a);
        w.axle.setLinearVelocity(V(0, 0));
        w.axle.setAngularVelocity(0);
        w.body.setTransform(p, w.body.getAngle());
        w.body.setLinearVelocity(V(0, 0));
        w.body.setAngularVelocity(0);
      }
      this.crashed = false;
      this.crashReason = '';
      this.inAir = false;
      this.airTimer = 0;
      this.pending = null;
      this.flippedTimer = 0;
      this.tailTimer = 0;
      this.groundTime = 0;
      this.input.gas = false;
      this.input.brake = false;
      this.launchMul = 1; this.launchMulT = 0;
    }

    /**
     * Start nach dem Countdown: Drehzahl im Band → Kupplung greift sauber (Startschwung),
     * zu niedrig → abgewürgt (wenig Kraft), zu hoch → Räder drehen durch. Gleiche Regeln für alle Fahrer.
     */
    launch() {
      const L = C.launch;
      const r = this.launchRpm;
      let q;
      if (r >= L.band[0] && r <= L.band[1]) q = 'perfect';
      else if (r >= L.band[0] - L.good && r <= L.band[1] + L.good) q = 'good';
      else q = r < L.band[0] ? 'low' : 'high';
      const V = this.pl.Vec2;
      const ch = this.chassis;
      const a = ch.getAngle();
      const tx = Math.cos(a), ty = Math.sin(a);
      if (q === 'perfect' || q === 'good') {
        const sp = q === 'perfect' ? L.perfectSpeed : L.goodSpeed;
        for (const b of [ch].concat(this.wheels.map((w) => w.axle), this.wheels.map((w) => w.body))) b.setLinearVelocity(V(tx * sp, ty * sp));
        for (const w of this.wheels) w.body.setAngularVelocity(-sp / w.def.r);
      } else if (q === 'low') {
        this.launchMul = L.bogMul; this.launchMulT = L.bogTime;
      } else {
        // überdreht: Antriebsräder drehen beim Einkuppeln hoch → Schlupf, Front steigt
        for (const w of this.wheels) if (w.def.drive > 0) w.body.setAngularVelocity(-(this.p.topSpeed * 0.75) / w.def.r);
        this.launchMul = 0.75; this.launchMulT = L.spinTime; this.spinT = L.spinTime;
      }
      this.launchQuality = q;
      return q;
    }

    destroy() {
      const w = this.world;
      for (const wh of this.wheels) { w.destroyBody(wh.body); w.destroyBody(wh.axle); }
      w.destroyBody(this.chassis);
      this.wheels = [];
    }

    /* ---------- vor dem Physikschritt: Kräfte & Motoren ---------- */
    preStep(dt) {
      const pl = this.pl;
      const V = pl.Vec2;
      const P = C.physics;
      const p = this.p;
      const ch = this.chassis;
      const ok = !this.crashed && this.controlEnabled;
      const gas = ok && this.input.gas && !this.noFuel;
      const brake = ok && this.input.brake;
      const airGas = ok && this.input.gas;    // Luftkontrolle (Gewicht verlagern) geht auch ohne Sprit
      if (this.launchMulT > 0) { this.launchMulT -= dt; if (this.launchMulT <= 0) this.launchMul = 1; }
      if (this.spinT > 0) {
        // durchdrehende Räder: Gleitreibung statt Haftreibung (weniger Vortrieb)
        this.spinT -= dt;
        for (const w of this.wheels) {
          if (w.def.drive <= 0) continue;
          for (let ce = w.body.getContactList(); ce; ce = ce.next) {
            if (this.spinT > 0) ce.contact.setFriction(this.p.grip * 0.45); else ce.contact.resetFriction();
          }
        }
      }
      const up = ch.getWorldVector(V(0, 1));

      // Feder + Dämpfer
      for (const w of this.wheels) {
        const x = w.pj.getJointTranslation();
        const v = w.pj.getJointSpeed();
        const F = w.pre + w.k * x + w.c * v;
        // Durchschlagen: am oberen Anschlag mit Tempo → Energieverlust (kurze Federwege leiden mehr)
        if (v > P.bottomSpeed && x > this.p.suspUp * 0.96 && (w.bottomT || 0) <= 0 && w.contact) {
          const loss = Math.min(P.bottomMax, (v - P.bottomSpeed) * P.bottomLoss);
          const cv = ch.getLinearVelocity();
          ch.setLinearVelocity(V(cv.x * (1 - loss), cv.y));
          w.bottomT = 0.15;
        }
        if (w.bottomT > 0) w.bottomT -= dt;
        w.compress = x;
        w.load = F > 0 ? F : 0;
        const f = V(up.x * F, up.y * F);
        ch.applyForce(f, ch.getWorldPoint(w.mount), true);
        w.axle.applyForce(V(-f.x, -f.y), w.axle.getWorldCenter(), true);
      }

      // Gewichtsverlagerung: die im letzten Schritt übertragene Antriebs-/Bremskraft hebt bzw.
      // senkt die Front. Wirkt nur am Boden und lässt ab einer Neigung nach.
      if (!this.crashed && p.lift > 0 && this.grounded) {
        const tr = this.phys.track;
        let Fx = 0, Fm = 0;
        for (const w of this.wheels) {
          if (!w.contact || !w.rj.isMotorEnabled()) continue;
          // Antriebs-/Bremskraft = Motormoment / Radius, höchstens die real übertragene Reibkraft
          const f = -w.rj.getMotorTorque(1 / dt) / w.def.r;   // Moment auf das Rad (vorwärts negativ)
          Fx += Math.sign(f) * Math.min(Math.abs(f), w.traction || 0);
          Fm += f;   // volles Motormoment (durchdrehende Räder richten zusätzlich auf)
        }
        if (Fx !== 0) {
          const slopeA = tr.angleAt(ch.getPosition().x);
          const pitch = U.wrapAngle(ch.getAngle() - slopeA);
          let tau = p.lift * Fx * this.comHeight * (Fx > 0 ? 1 : P.brakeDive);
          // Kippgrenze: Neigung, ab der Antrieb/Bremse das Fahrzeug von selbst weiter kippen würde
          // (Schwerpunkt über der Hinter- bzw. Vorderachse). Die Gewichtsverlagerung bleibt darunter.
          const wv = ch.getAngularVelocity();
          const aLong = Fm / p.totalMass - P.gravity * Math.sin(slopeA);
          const h = this.comHeight;
          const tipUp = this._tipTilt(this.rearL, h, Math.max(0, aLong)) - slopeA;
          const tipDown = this._tipTilt(this.frontL, h, Math.max(0, -aLong)) + slopeA;
          const limUp = Math.min(p.liftAngle, tipUp * P.liftTipShare);
          const limDown = Math.min(p.liftAngle, tipDown * P.liftTipShare);
          // Gewichtsverlagerung entlastet eine Achse bis auf null. Anheben darüber hinaus nur bei
          // niedrigem Tempo (volles Motormoment: Anfahren, steile Anstiege) – bei Tempo nicht.
          let nOther = 0;
          for (const w of this.wheels) if ((tau > 0) === (w.def.x > this.com.x)) nOther += w.normal || 0;
          const vel = ch.getLinearVelocity();
          const spd = Math.hypot(vel.x, vel.y);
          const low = U.clamp(1 - spd / (P.liftLowSpeed * p.topSpeed), 0, 1);
          // bei Tempo: entlastete Front (Kuppe, Buckel) lässt sich unter Gas leichter anheben
          const high = P.liftHighSpeed * U.clamp(spd / p.topSpeed, 0, 1);
          const over = tau > 0 ? P.liftOvershoot * p.liftOver * Math.max(low, high) : 0;
          const cap = (nOther + over * p.totalMass * P.gravity * 0.5) * this.wheelSpan;
          tau = U.clamp(tau, -cap, cap);
          const band = P.liftFadeBand;
          // Neigung in Kürze (aktueller Drehschwung), damit der Schwung nicht über die Grenze trägt
          const pPred = pitch + wv * P.liftLookahead;
          if (tau > 0) {
            // volle Wirkung bis kurz vor dem Grenzwinkel, dann auslaufend
            tau *= U.clamp((limUp - Math.max(pitch, pPred)) / band, 0, 1);
            // Dämpfer bremsen schnelles Aufbäumen (nimmt nur Hebewirkung weg, stabilisiert nie darüber hinaus)
            if (wv > 0) tau = Math.max(0, tau - P.liftDamping * this.Isys * wv);
          } else {
            tau *= U.clamp((limDown + Math.min(pitch, pPred)) / band, 0, 1);
            if (wv < 0) tau = Math.min(0, tau - P.liftDamping * this.Isys * wv);
          }
          this.liftTorque = tau;
          ch.applyTorque(tau, true);
        } else this.liftTorque = 0;
      } else this.liftTorque = 0;

      // Antrieb & Bremse
      let rpm = 0;
      let rAvg = 0;
      for (const w of this.wheels) rAvg += w.def.r;
      rAvg /= this.wheels.length;
      this.brakingHard = false;
      for (const w of this.wheels) {
        const wd = w.def;
        const rj = w.rj;
        const fwd = -rj.getJointSpeed();            // Vorwärts-Drehrate (rad/s)
        const wMax = p.topSpeed / wd.r;
        if (wd.drive > 0) rpm = Math.max(rpm, Math.abs(fwd) / wMax);
        if (this.crashed) {
          rj.enableMotor(true); rj.setMotorSpeed(0); rj.setMaxMotorTorque(p.torque * 0.02);
          continue;
        }
        if (gas && !brake) {
          if (wd.drive > 0 && fwd < wMax) {
            const u = U.clamp(fwd / wMax, 0, 1);
            const curve = u < 0.55 ? 1 : 1 - ((u - 0.55) / 0.45) * 0.5;
            rj.enableMotor(true);
            rj.setMotorSpeed(-wMax);
            rj.setMaxMotorTorque(p.torque * wd.drive * curve * this.launchMul);
          } else {
            rj.enableMotor(false);
          }
        } else if (brake) {
          if (fwd > 1.2) {
            rj.enableMotor(true);
            rj.setMotorSpeed(0);
            rj.setMaxMotorTorque((p.brakeTorque / this.wheels.length) * (wd.r / rAvg));
            this.brakingHard = true;
          } else if (wd.drive > 0) {
            rj.enableMotor(true);
            rj.setMotorSpeed(p.reverse / wd.r);
            rj.setMaxMotorTorque(p.torque * wd.drive * 0.75);
          } else {
            rj.enableMotor(false);
          }
        } else {
          rj.enableMotor(true);
          rj.setMotorSpeed(0);
          rj.setMaxMotorTorque(p.torque * P.coastDrag * (wd.drive > 0 ? 1 : 0.25));
        }
      }
      this.rpm = U.damp(this.rpm, gas ? Math.max(rpm, 0.15) : rpm * 0.8, 10, dt);

      // Rotation in der Luft / Kippen am Boden
      const dir = (airGas ? 1 : 0) - (brake ? 1 : 0);
      if (dir !== 0) {
        let accMax = 0, spin = 0;
        if (this.inAir) { accMax = p.airAccel; spin = p.airSpin; }
        else if (this.grounded && !this.bothGrounded) {
          // Am Boden nur korrigierend kippen (Wheelie abfangen / Nase anheben), nie weiter aufschaukeln
          const tr = this.phys.track;
          const pitch = U.wrapAngle(ch.getAngle() - tr.angleAt(ch.getPosition().x));
          if ((dir < 0 && pitch > 0.05) || (dir > 0 && pitch < -0.05)) { accMax = p.airAccel * p.groundTilt; spin = p.airSpin * 0.6; }
        }
        if (accMax > 0) {
          const wv = ch.getAngularVelocity();
          const target = dir * spin;
          // Gegensteuern (Drehung abbremsen) greift kräftiger als Aufbauen
          const lim = wv * dir < 0 ? accMax * 1.6 : accMax;
          const acc = U.clamp((target - wv) * 7, -lim, lim);
          ch.applyTorque(acc * this.Isys, true);
        }
      }

      // Luftwiderstand & Rollwiderstand
      const vel = ch.getLinearVelocity();
      const sp = Math.hypot(vel.x, vel.y);
      const m = p.totalMass;
      let fx = -P.airDrag * p.drag * m * sp * vel.x;
      let fy = -P.airDrag * p.drag * m * sp * vel.y;
      if (this.grounded) {
        const rr = this.phys.track.env.rolling * this.rollFactor;
        fx -= rr * m * vel.x;
        fy -= rr * m * vel.y * 0.3;
      }
      ch.applyForceToCenter(V(fx, fy), true);

      // Stabilität: leichte Rotationsdämpfung nur am Boden
      ch.setAngularDamping(this.bothGrounded ? p.angDamp : 0.02);
    }

    /* ---------- nach dem Physikschritt: Kontakte, Stunts, Unfälle ---------- */
    postStep(dt) {
      this.time += dt;
      const P = C.physics;
      const S = C.stunts;
      const ch = this.chassis;
      const tr = this.phys.track;

      // Radkontakte
      let n = 0;
      for (const w of this.wheels) {
        w.contact = false;
        let tImp = 0, nImp = 0;
        for (let ce = w.body.getContactList(); ce; ce = ce.next) {
          if (ce.contact.isTouching() && isTerrain(ce.other)) {
            w.contact = true;
            const m = ce.contact.getManifold();
            for (let i = 0; i < m.pointCount; i++) { tImp += Math.abs(m.points[i].tangentImpulse); nImp += m.points[i].normalImpulse; }
          }
        }
        w.traction = tImp / dt;   // tatsächlich übertragene Reibkraft (N)
        w.normal = nImp / dt;     // tatsächliche Radlast (N)
        if (w.contact) n++;
        w.spin = w.body.getAngularVelocity();
      }
      const grounded = n > 0;
      this.grounded = grounded;
      this.bothGrounded = n === this.wheels.length;

      // Kopf / Dach berührt den Boden → Unfall
      let bodyTouch = false;
      if (!this.crashed) {
        for (let ce = ch.getContactList(); ce; ce = ce.next) {
          const c = ce.contact;
          if (!c.isTouching()) continue;
          const fa = c.getFixtureA(), fb = c.getFixtureB();
          const mine = fa.getBody() === ch ? fa : fb;
          const other = mine === fa ? fb : fa;
          const ud = mine.getUserData();
          if (!isTerrain(other)) continue;
          if (ud && ud.kind === 'crash') { this._crash('head'); break; }
          if (ud && ud.kind === 'body') bodyTouch = true;
        }
      }

      const pos = ch.getPosition();
      const vel = ch.getLinearVelocity();
      const ang = ch.getAngle();

      // Luft / Landung
      if (!grounded) {
        this.airTimer += dt;
        if (!this.inAir && this.airTimer >= P.airborneDelay) {
          this.inAir = true;
          this.takeoffAngle = ang - ch.getAngularVelocity() * this.airTimer;
          this.takeoffX = pos.x - vel.x * this.airTimer;
          this.maxAirHeight = 0;
          this.events.push({ type: 'takeoff' });
        }
        if (this.inAir) {
          this.lastAirVel.x = vel.x; this.lastAirVel.y = vel.y;
          const hg = pos.y - tr.heightAt(pos.x);
          if (hg > this.maxAirHeight) this.maxAirHeight = hg;
        }
        this.groundTime = 0;
      } else {
        this.groundTime += dt;
        if (this.inAir) {
          const air = this.airTimer;
          const rot = ang - this.takeoffAngle;
          const ga = tr.angleAt(pos.x);
          const nx = -Math.sin(ga), ny = Math.cos(ga);
          const impact = -(this.lastAirVel.x * nx + this.lastAirVel.y * ny);
          const pitch = U.wrapAngle(ang - ga);
          this.events.push({ type: 'land', air, impact, x: pos.x, y: pos.y });
          if (!this.crashed && air >= P.landMinAir) this._landing(pitch, impact, ga, air);
          if (!this.crashed && air >= S.minAir) {
            const flips = Math.floor((Math.abs(rot) + S.flipTolerance) / (2 * Math.PI));
            const perfect = air >= S.perfectMinAir && Math.abs(pitch) < S.perfectAngle;
            if (flips > 0 || perfect || air >= S.airtimeMin) {
              this.pending = { flips, dir: rot > 0 ? 'back' : 'front', air, perfect, t: S.confirmTime, both: this.bothGrounded, dist: Math.abs(pos.x - (this.takeoffX || pos.x)) };
            }
          }
          this.inAir = false;
        }
        this.airTimer = 0;
      }

      if (this.pending) {
        if (this.bothGrounded) this.pending.both = true;
        this.pending.t -= dt;
        if (this.crashed) this.pending = null;
        else if (this.pending.t <= 0) {
          const st = this.pending;
          this.pending = null;
          if (!st.both) st.perfect = false;
          if (st.flips > 0 || st.perfect || st.air >= S.airtimeMin) this.events.push(Object.assign({ type: 'stunt' }, st));
        }
      }

      // Umgekippt und liegengeblieben
      if (!this.crashed) {
        const upright = Math.cos(ang - tr.angleAt(pos.x));
        const sp = Math.hypot(vel.x, vel.y);
        if (!grounded && upright < 0.35 && sp < 1.2 && Math.abs(ch.getAngularVelocity()) < 1.2) this.flippedTimer += dt;
        else if (grounded && upright < -0.2 && sp < 1.2) this.flippedTimer += dt;
        else this.flippedTimer = Math.max(0, this.flippedTimer - dt * 2);
        if (this.flippedTimer > 1.6) this._crash('flip');
        // Fahrzeug steht (fast) senkrecht auf dem Heck: nach kurzer Zeit als Überschlag werten
        if ((bodyTouch || grounded) && upright < 0.26) this.tailTimer = (this.tailTimer || 0) + dt;
        else this.tailTimer = Math.max(0, (this.tailTimer || 0) - dt * 2);
        if (this.tailTimer > 1.0) this._crash('flip');
        if (pos.y < tr.heightAt(pos.x) - 25) this._crash('fall');
      }

      // Antriebsschlupf (für Staub)
      let slip = 0;
      for (const w of this.wheels) {
        if (!w.contact || w.def.drive <= 0) continue;
        const surf = -w.spin * w.def.r;
        slip = Math.max(slip, Math.abs(surf - vel.x));
      }
      this.slip = slip;
    }

    /**
     * Landequalität wirkt auf das Tempo: Schräg aufsetzen (Nase/Heck zuerst) und sehr harte Aufschläge
     * kosten Geschwindigkeit; eine saubere Landung behält sie (Räder werden an die Fahrbahn angeglichen,
     * statt die Fahrt beim Aufsetzen abzubremsen).
     */
    _landing(pitch, impact, ga, air) {
      const P = C.physics;
      const V = this.pl.Vec2;
      const ap = Math.abs(pitch);
      const tx = Math.cos(ga), ty = Math.sin(ga);
      let loss = 0;
      if (ap > P.landGoodAngle) loss += U.clamp((ap - P.landGoodAngle) / (P.landBadAngle - P.landGoodAngle), 0, 1) * P.landAngleLoss;
      const hard = (impact - P.landHardImpact * (1 + this.p.suspUp * 2)) / 8;
      if (hard > 0) loss += U.clamp(hard, 0, 1) * P.landHardLoss;
      loss = U.clamp(loss, 0, P.landMaxLoss);
      const ch = this.chassis;
      const v0 = ch.getLinearVelocity();
      const along = v0.x * tx + v0.y * ty;
      const bodies = [ch];
      for (const w of this.wheels) bodies.push(w.axle, w.body);
      if (loss > 0.01) {
        for (const b of bodies) {
          const v = b.getLinearVelocity();
          const a2 = v.x * tx + v.y * ty;
          b.setLinearVelocity(V(v.x - tx * a2 * loss, v.y - ty * a2 * loss));
        }
      } else if (along > 1) {
        // sauber gelandet: rollende Räder passend zur Fahrt (kein Abbremsen durch stehende Räder)
        for (const w of this.wheels) {
          const target = -along / w.def.r;
          if (Math.abs(w.body.getAngularVelocity()) < Math.abs(target)) w.body.setAngularVelocity(target);
        }
      }
      this.lastLanding = { loss, pitch: ap, impact, good: loss <= 0.01 && ap < P.landGoodAngle, t: this.time };
      this.events.push({ type: 'landq', loss, speed: Math.abs(along), good: this.lastLanding.good, air });
    }

    _crash(reason) {
      if (this.crashed) return;
      this.crashed = true;
      this.crashReason = reason;
      this.pending = null;
      this.events.push({ type: 'crash', reason });
    }
  }

  GS.Vehicle = Vehicle;
  GS.VP = VP;
})(window.GS = window.GS || {});

</script>
<script>
/* =====================================================================
   KI-Fahrer: bedient nur Gas/Bremse – genau wie der Spieler.
   Kein Schummeln: gleiche Physik, gleiche Fahrzeugwerte.
   ===================================================================== */
'use strict';
(function (GS) {
  const C = GS.CONFIG;
  const U = GS.U;

  class AIDriver {
    constructor(vehicle, track, skill, seed, style) {
      const A = C.ai;
      const s = U.clamp(skill, 0, 1);
      const st = style || { crest: 1, wheelie: 1, mistakes: 1, jump: 1, speed: 1 };
      this.style = st;
      this.v = vehicle;
      this.track = track;
      this.skill = s;
      this.reaction = U.lerp(A.reaction[0], A.reaction[1], s);
      this.airNoise = U.lerp(A.airNoise[0], A.airNoise[1], s);
      // Fahrstil verändert Risiko, Mut an Kuppen und Fehlerneigung
      this.wheelieLimit = U.lerp(A.wheelieLimit[0], A.wheelieLimit[1], s) * st.wheelie;
      this.crestBold = U.lerp(A.crestBoldness[0], A.crestBoldness[1], s) * st.crest;
      this.mistakeRate = U.lerp(A.mistakeRate[0], A.mistakeRate[1], s) * st.mistakes;
      this.liftRate = U.lerp(A.liftRate[0], A.liftRate[1], s);
      this.speedCap = Math.min(1, U.lerp(A.speedCap[0], A.speedCap[1], s) * st.speed);
      this.jumpError = U.clamp(U.lerp(A.jumpError[0], A.jumpError[1], s) * st.jump, 0, 0.6);
      this.rng = U.rng(seed || 1);
      this.timer = 0;
      this.gas = false;
      this.brake = false;
      this.mode = 'drive';
      this.modeTimer = 0;
      this.stall = 0;
      this.plan = null;
      this.mistake = null;
      this.mistakeTimer = 0;
      // Abstand Karosserie-Ursprung → Boden in Ruhe
      let c = 0;
      for (const w of vehicle.def.wheels) c = Math.max(c, w.r - w.y);
      this.clearance = c;
    }

    update(dt) {
      const v = this.v;
      if (v.crashed) { v.input.gas = false; v.input.brake = false; this.plan = null; return; }
      if (this.mistakeTimer > 0) { this.mistakeTimer -= dt; if (this.mistakeTimer <= 0) this.mistake = null; }
      this.timer -= dt;
      if (this.timer <= 0) {
        this.timer = this.reaction * this.rng.range(0.7, 1.3);
        this._decide();
      }
      v.input.gas = this.gas;
      v.input.brake = this.brake;
    }

    _decide() {
      const v = this.v;
      const r = this.rng;
      if (!this.mistake && r() < this.mistakeRate * this.reaction) {
        this.mistake = r.pick(['overgas', 'late', 'lift']);
        this.mistakeTimer = r.range(0.25, 0.6);
      }
      if (v.inAir) this._air(); else this._ground();
      if (this.mistake === 'overgas') { this.gas = true; this.brake = false; }
      else if (this.mistake === 'lift') { this.gas = false; this.brake = false; }
      else if (this.mistake === 'late' && v.inAir) { this.gas = false; this.brake = false; }
    }

    _ground() {
      const v = this.v;
      const tr = this.track;
      const g = C.physics.gravity;
      const x = v.x;
      const vel = v.vel;
      const ang = v.angle;
      const w = v.chassis.getAngularVelocity();
      const ga = tr.angleAt(x);
      const pitch = U.wrapAngle(ang - ga);
      const fwd = vel.x * Math.cos(ga) + vel.y * Math.sin(ga);
      this.plan = null;

      if (this.mode === 'backoff') {
        this.modeTimer -= this.reaction;
        this.gas = false;
        this.brake = true;
        if (this.modeTimer <= 0 || pitch < -0.5) this.mode = 'drive';
        return;
      }
      // festgefahren am Hang → kurz zurückrollen und mit Schwung neu anfahren
      if (fwd < 0.5 && tr.slopeAt(x) > 0.22) this.stall += this.reaction; else this.stall = Math.max(0, this.stall - this.reaction);
      if (this.stall > 1.3) {
        this.mode = 'backoff';
        this.modeTimer = this.rng.range(1.0, 2.0);
        this.stall = 0;
      }

      let gas = true, brake = false;
      // Kuppen voraus: Geschwindigkeit anpassen
      const look = U.clamp(fwd * 1.1, 4, 26);
      let kMax = 0;
      for (let d = 2; d <= look; d += 1) {
        const xx = x + d;
        const k = -(tr.slopeAt(xx + 1) - tr.slopeAt(xx - 1)) / 2;
        if (k > kMax) kMax = k;
      }
      let vTarget = kMax > 0.02 ? Math.sqrt(g / kMax) * this.crestBold : 99;
      vTarget = Math.min(vTarget, v.p.topSpeed * this.speedCap + (this.speedCap >= 0.999 ? 5 : 0));
      // geschlossenes/schließendes Tor voraus: rechtzeitig davor anhalten
      if (tr.live) {
        const gd = tr.live.gateAhead(x, Math.max(10, fwd * 1.6 + 6));
        if (gd !== null) vTarget = Math.min(vTarget, Math.sqrt(2 * 4 * Math.max(0, gd - 3.2)));
        // kippender Baum: mit etwas Glück/Können rechtzeitig vom Gas (Reaktion hängt vom Können ab)
        const td = tr.live.treeAhead(x, 26);
        if (td !== null && this.rng() < 0.4 + 0.6 * this.skill) vTarget = Math.min(vTarget, Math.sqrt(2 * 4 * Math.max(0, td - 4)));
      }
      if (fwd > vTarget) { gas = false; brake = fwd > vTarget + (vTarget < 3 ? 0.5 : 5); }

      // Wheelie-Kontrolle
      if (pitch > this.wheelieLimit) { gas = false; brake = pitch > this.wheelieLimit + 0.22 || w > 1.4; }
      else if (pitch > this.wheelieLimit * 0.65 && w > 0.7) gas = false;
      if (pitch < -0.55) { gas = true; brake = false; }

      if (!this.mistake && this.rng() < this.liftRate * this.reaction) {
        this.mistake = 'lift';
        this.mistakeTimer = this.rng.range(0.2, 0.45);
      }
      this.gas = gas;
      this.brake = brake;
    }

    _air() {
      const v = this.v;
      const tr = this.track;
      const g = C.physics.gravity;
      const pos = v.chassis.getPosition();
      const vel = v.vel;
      const ang = v.angle;
      const w = v.chassis.getAngularVelocity();
      if (!this.plan) {
        const bad = this.rng() < this.jumpError;
        this.plan = { noise: this.rng.normal() * this.airNoise * (bad ? 5 : 1), freeze: bad ? this.rng.range(0.25, 0.8) : 0, panic: bad && this.rng() < 0.5 };
      }
      // grober Fehler: zu spät reagiert
      if (this.plan.freeze > 0) { this.plan.freeze -= this.reaction; this.gas = this.plan.panic; this.brake = false; return; }
      // ballistische Landevorhersage
      let t = 0.05, px = pos.x, py = pos.y;
      for (; t < 4; t += 0.05) {
        px = pos.x + vel.x * t;
        py = pos.y + vel.y * t - 0.5 * g * t * t;
        if (py - this.clearance <= tr.heightAt(px)) break;
      }
      const landAng = Math.atan((tr.heightAt(px + 1.2) - tr.heightAt(px - 1.2)) / 2.4);
      const target = landAng + this.plan.noise - 0.04;
      const err = U.wrapAngle(target - ang);
      const desiredW = U.clamp((err * 1.4) / Math.max(t, 0.22), -v.p.airSpin, v.p.airSpin);
      const dw = desiredW - w;
      const dead = U.lerp(0.55, 0.25, this.skill);
      this.gas = dw > dead;
      this.brake = dw < -dead;
    }
  }

  GS.AIDriver = AIDriver;
})(window.GS = window.GS || {});

</script>
<script>
/* =====================================================================
   Spielsitzung: Rennen, Adventure oder Menü-Hintergrund ("attract").
   Enthält Countdown, Positionen, Checkpoints, Ziel, Unfälle, Respawn,
   Münzen und Stunt-Belohnungen. Kein DOM – läuft auch headless.
   ===================================================================== */
'use strict';
(function (GS) {
  const C = GS.CONFIG;
  const U = GS.U;

  class Session {
    /**
     * cfg: { mode, track:{env,seed,length,difficulty}, trackName,
     *        player:{vehicleId, levels, name}, opponents:[{vehicleId, levels, skill, name, color}] }
     */
    constructor(cfg) {
      this.cfg = cfg;
      this.mode = cfg.mode;
      this.isRace = cfg.mode === 'race';
      this.isAdventure = cfg.mode === 'adventure';
      this.isAttract = cfg.mode === 'attract';
      this.track = new GS.Track(Object.assign({ mode: cfg.mode }, cfg.track));
      this.phys = new GS.Physics(this.track);
      this.phys.sync(0, this.track.startX + 220);
      this.obst = new GS.Obstacles(this);
      this.racers = [];
      this.events = [];
      this.time = 0;
      this.raceTime = 0;
      this.state = this.isAttract ? 'running' : 'countdown';
      this.countdown = C.race.countdown + 0.75;
      this.lastCount = 4;
      this.doneTimer = 0;
      this.coinIndex = 0;
      this.playerStuck = false;
      this.endReason = '';
      this.syncTimer = 0;
      this.lastOpponentFinish = null;

      const sx = this.track.startX - 6;
      if (cfg.player) {
        const p = this._addRacer({
          name: cfg.player.name || 'Du', color: '#ffd23f', isPlayer: true,
          vehicleId: cfg.player.vehicleId, levels: cfg.player.levels, x: sx,
          skill: this.isAttract ? 0.75 : (cfg.player.aiSkill !== undefined ? cfg.player.aiSkill : null),
        });
        this.player = p;
      }
      (cfg.opponents || []).forEach((o, i) => {
        this._addRacer({ name: o.name, color: o.color, isPlayer: false, vehicleId: o.vehicleId, levels: o.levels, x: sx, skill: o.skill, style: o.style, seed: i * 977 + (cfg.track.seed | 0) });
      });
      for (const r of this.racers) r.vehicle.controlEnabled = this.isAttract;
    }

    _addRacer(o) {
      const def = GS.VP.def(o.vehicleId);
      const vehicle = new GS.Vehicle(this.phys, def, o.levels, { x: o.x });
      const r = {
        name: o.name, color: o.color, isPlayer: o.isPlayer, vehicle, def,
        ai: null, finished: false, finishTime: null, place: 0, cp: 0, cpTimes: [],
        crashTimer: 0, safe: [], bestX: o.x, lastProgress: 0,
        fuel: 1, fuelTaken: new Set(), fuelEmptyT: 0, fuelOut: false, dnf: false, launch: null,
        stats: { coins: 0, coinValue: 0, stuntCoins: 0, flips: 0, backflips: 0, frontflips: 0, bestCombo: 0, maxAir: 0, perfect: 0, crashes: 0 },
      };
      if (o.skill !== null && o.skill !== undefined) {
        r.ai = new GS.AIDriver(vehicle, this.track, o.skill, o.seed || 7, o.style);
      }
      this.racers.push(r);
      return r;
    }

    setPlayerInput(gas, brake) {
      if (!this.player || this.player.ai) return;
      this.player.vehicle.input.gas = !!gas;
      this.player.vehicle.input.brake = !!brake;
    }

    /** Spieler manuell zurücksetzen (z. B. festgefahren) */
    requestReset() {
      const p = this.player;
      if (!p || p.finished || p.vehicle.crashed) return;
      this._respawn(p, 0);
      this.playerStuck = false;
    }

    /* ---------------- Hauptschritt ---------------- */
    step(dt) {
      this.time += dt;
      const tr = this.track;

      if (this.state === 'countdown') {
        this.countdown -= dt;
        // Startdrehzahl: Gas hebt, Loslassen senkt (Spieler); KI legt sich kurz vor „Los!“ fest
        const L = C.launch;
        for (const r of this.racers) {
          const v = r.vehicle;
          if (!r.ai) v.launchRpm = U.clamp(v.launchRpm + (v.input.gas ? L.rise * (1.15 - v.launchRpm * 0.3) : -L.fall) * dt, 0, 1);
          else if (this.countdown < 0.6 && r.aiLaunch === undefined) {
            const c = (L.band[0] + L.band[1]) / 2;
            r.aiLaunch = U.clamp(c + r.ai.rng.normal() * (1 - r.ai.skill) * 0.2 + (r.ai.style && r.ai.style.launchBias || 0), 0, 1);
          }
          if (r.ai && r.aiLaunch !== undefined) v.launchRpm += (r.aiLaunch - v.launchRpm) * Math.min(1, dt * 6);
        }
        const n = Math.ceil(this.countdown);
        if (n < this.lastCount && n >= 1 && n <= 3) { this.events.push({ type: 'count', n }); }
        this.lastCount = Math.min(this.lastCount, n);
        if (this.countdown <= 0) {
          this.state = 'running';
          for (const r of this.racers) {
            r.vehicle.controlEnabled = true;
            if (!this.isAttract) {
              r.launch = r.vehicle.launch();
              if (r.isPlayer) this.events.push({ type: 'launch', quality: r.launch, rpm: r.vehicle.launchRpm });
            }
          }
          this.events.push({ type: 'go' });
        }
      } else if (this.state === 'running' || this.state === 'finished') {
        this.raceTime += dt;
      }

      // KI
      for (const r of this.racers) if (r.ai && this.state !== 'countdown') r.ai.update(dt);

      // Physik-Strecke nachladen
      this.syncTimer -= dt;
      if (this.syncTimer <= 0) {
        this.syncTimer = 0.15;
        let minX = Infinity, maxX = -Infinity;
        for (const r of this.racers) {
          const x = r.vehicle.x;
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
        }
        this.phys.sync(minX - C.terrain.keepBehind, maxX + C.terrain.buildAhead);
        this.obst.sync(minX - C.terrain.keepBehind, maxX + C.terrain.buildAhead);
      }

      for (const r of this.racers) r.vehicle.preStep(dt);
      if (this.state !== 'countdown') this.obst.step(dt);
      this.phys.step(dt);
      for (const r of this.racers) {
        r.vehicle.postStep(dt);
        this._racerLogic(r, dt);
      }
      if (this.player && !this.isAttract) this._coins(this.player);
      if (!this.isAttract && this.state === 'running') for (const r of this.racers) this._fuel(r, dt);
      this._positions();
      this._endConditions(dt);
    }

    _racerLogic(r, dt) {
      const v = r.vehicle;
      const tr = this.track;
      const x = v.x;

      // Fahrzeug-Ereignisse
      for (const e of v.events) this._vehicleEvent(r, e);
      v.events.length = 0;

      // Sichere Position merken
      if (!v.crashed && v.bothGrounded && v.groundTime > 0.3) {
        const pitch = Math.abs(U.wrapAngle(v.angle - tr.angleAt(x)));
        const last = r.safe[r.safe.length - 1];
        if (pitch < 0.35 && (!last || this.time - last.t > 0.5) && Math.abs(tr.slopeAt(x)) < C.race.safeSlope) {
          r.safe.push({ x, t: this.time });
          if (r.safe.length > 12) r.safe.shift();
        }
      }

      // Fortschritt
      if (x > r.bestX + 1) { r.bestX = x; r.lastProgress = this.time; }

      // Unfall → Respawn (Rennen / Attract) bzw. Ende (Adventure)
      if (v.crashed) {
        r.crashTimer += dt;
        if (this.isAdventure && r.isPlayer) {
          if (r.crashTimer > 1.6 && this.state === 'running') this._finishAdventure(v.crashReason === 'flip' ? 'flip' : 'crash');
        } else if (r.crashTimer > C.race.respawnDelay && !r.finished) {
          this._respawn(r, 1.0);
        } else if (r.finished && r.crashTimer > C.race.respawnDelay) {
          this._respawn(r, 0);
        }
        return;
      }

      if (this.state === 'countdown') { r.lastProgress = this.time; return; }

      // Festgefahren
      const idle = this.time - r.lastProgress;
      if (r.isPlayer && !r.ai) {
        if (this.isRace && !r.finished) this.playerStuck = idle > C.race.stuckPlayerHint;
        if (this.isAdventure && this.state === 'running' && idle > C.adventure.stuckTime) this._finishAdventure('stuck');
      } else if (!r.finished && idle > C.race.stuckAIRespawn) {
        this._respawn(r, 2.0);
        r.lastProgress = this.time;
      }

      if (!this.isRace) return;
      // Checkpoints
      if (r.cp < tr.checkpoints.length && x >= tr.checkpoints[r.cp]) {
        r.cpTimes[r.cp] = this.raceTime;
        if (r.isPlayer) {
          // Abstand zum Fahrer davor (der den Checkpoint vor uns erreicht hat)
          let ahead = null;
          for (const o of this.racers) {
            if (o === r || o.cpTimes[r.cp] === undefined) continue;
            if (!ahead || o.cpTimes[r.cp] > ahead.cpTimes[r.cp]) ahead = o;
          }
          const placeAt = 1 + this.racers.filter((o) => o !== r && o.cpTimes[r.cp] !== undefined).length;
          this.events.push({ type: 'checkpoint', idx: r.cp + 1, total: tr.checkpoints.length + 1, place: placeAt, gap: ahead ? this.raceTime - ahead.cpTimes[r.cp] : null });
        }
        r.cp++;
      }
      // Ziel
      if (!r.finished && x >= tr.finishX) {
        r.finished = true;
        r.finishTime = this.raceTime;
        r.place = 1 + this.racers.filter((o) => o !== r && o.finished).length;
        if (r.isPlayer) {
          this.state = 'finished';
          this.endReason = 'finish';
          this.events.push({ type: 'finish', place: r.place, time: r.finishTime });
        } else {
          this.lastOpponentFinish = this.raceTime;
          this.events.push({ type: 'opponentFinish', name: r.name, place: r.place });
        }
      }
    }

    _vehicleEvent(r, e) {
      if (e.type === 'crash') {
        r.crashTimer = 0;
        r.stats.crashes++;
        if (r.isPlayer) this.events.push({ type: 'crash', reason: e.reason, adventure: this.isAdventure });
        return;
      }
      if (e.type === 'land') {
        if (r.isPlayer || e.impact > 6) this.events.push({ type: 'land', impact: e.impact, x: e.x, y: e.y, player: r.isPlayer, air: e.air });
        return;
      }
      if (e.type === 'landq') {
        if (r.isPlayer && e.loss > 0.06 && e.speed * e.loss * 3.6 >= 3) this.events.push({ type: 'badLanding', kmh: Math.round(e.speed * e.loss * 3.6) });
        return;
      }
      if (e.type === 'takeoff') {
        if (r.isPlayer) this.events.push({ type: 'takeoff' });
        return;
      }
      if (e.type === 'stunt') {
        const S = C.stunts;
        const parts = [];
        let total = 0;
        if (e.flips > 0) {
          const base = e.dir === 'back' ? S.backflip : S.frontflip;
          const coins = Math.round(base * e.flips * (1 + S.multiBonus * (e.flips - 1)));
          const name = e.dir === 'back' ? 'Backflip' : 'Frontflip';
          parts.push({ label: (e.flips > 1 ? e.flips + '× ' : '') + name, coins });
          total += coins;
          r.stats.flips += e.flips;
          if (e.dir === 'back') r.stats.backflips += e.flips; else r.stats.frontflips += e.flips;
          r.stats.bestCombo = Math.max(r.stats.bestCombo, e.flips);
        }
        if (e.air >= S.airtimeMin && (e.dist || 0) >= S.airtimeMinDist) {
          // Flugzeit: nur echte Sprünge mit Weite und sauberer Landung; länger = überproportional mehr
          const a = Math.min(e.air, S.airtimeMax) - S.airtimeMin;
          const coins = Math.round(S.airtimeBase + S.airtimePerSec * Math.pow(a + 0.35, S.airtimeExp));
          parts.push({ label: 'Flugzeit ' + e.air.toFixed(1).replace('.', ',') + ' s', coins });
          total += coins;
        }
        if (e.perfect) {
          parts.push({ label: 'Saubere Landung', coins: S.perfectLanding });
          total += S.perfectLanding;
          r.stats.perfect++;
        }
        r.stats.maxAir = Math.max(r.stats.maxAir, e.air);
        r.stats.stuntCoins += total;
        if (r.isPlayer && total > 0) this.events.push({ type: 'stunt', parts, total });
      }
    }

    /** Verbrauch, Kanister, leerer Tank (für alle Fahrer gleich) */
    _fuel(r, dt) {
      if (r.finished || r.dnf) return;
      const v = r.vehicle;
      const F = C.fuel;
      if (!v.crashed && v.controlEnabled) {
        const thr = v.input.gas ? 0.45 + 0.55 * U.clamp(v.rpm, 0, 1) : 0;
        r.fuel = Math.max(0, r.fuel - (F.idle + F.gas * thr) * v.p.fuelUse * dt);
      }
      // Kanister aufnehmen (jeder Fahrer hat seine eigenen – Geisterfahrer nehmen niemandem etwas weg)
      const fs = this.track.fuels;
      const x = v.x;
      const pts = [v.chassis.getPosition()];
      for (const w of v.wheels) pts.push(w.body.getPosition());
      for (let i = 0; i < fs.length; i++) {
        const f = fs[i];
        if (f.x < x - 4) continue;
        if (f.x > x + 4) break;
        if (r.fuelTaken.has(i)) continue;
        for (const p of pts) {
          const dx = p.x - f.x, dy = p.y - f.y;
          if (dx * dx + dy * dy < F.pickup * F.pickup) {
            r.fuelTaken.add(i);
            r.fuel = 1;
            if (r.isPlayer) this.events.push({ type: 'fuel', x: f.x, y: f.y });
            break;
          }
        }
      }
      v.noFuel = r.fuel <= 0;
      if (v.noFuel && v.speed < 0.6) r.fuelEmptyT += dt; else r.fuelEmptyT = 0;
      if (r.fuelEmptyT > F.emptyStop && !r.fuelOut) {
        r.fuelOut = true;
        if (r.isPlayer) {
          this.events.push({ type: 'fuelOut' });
          if (this.isAdventure) this._finishAdventure('fuel');
          else if (this.isRace) { this.state = 'done'; this.endReason = 'fuel'; }
        } else {
          r.dnf = true;   // KI bleibt ohne Sprit liegen → ausgeschieden
          if (r.ai) { r.ai = null; v.input.gas = false; v.input.brake = false; }
          this.events.push({ type: 'opponentOut', name: r.name, why: 'fuel' });
        }
      }
    }

    _respawn(r, back) {
      const v = r.vehicle;
      const tr = this.track;
      let x = null;
      for (let i = r.safe.length - 1; i >= 0; i--) {
        if (this.time - r.safe[i].t >= back) { x = r.safe[i].x; break; }
      }
      if (x === null) x = r.safe.length ? r.safe[0].x : Math.max(tr.startX - 6, Math.min(v.x, r.bestX) - 6);
      x = Math.max(4, x);
      v.placeAt(x);
      r.crashTimer = 0;
      r.lastProgress = this.time;
      if (r.isPlayer) this.events.push({ type: 'respawn' });
    }

    _coins(r) {
      const coins = this.track.coins;
      const v = r.vehicle;
      if (v.crashed) return;
      const x = v.x;
      while (this.coinIndex < coins.length && coins[this.coinIndex].x < x - 8) this.coinIndex++;
      const R = C.terrain.coinPickup;
      const pts = [v.chassis.getPosition()];
      for (const w of v.wheels) pts.push(w.body.getPosition());
      for (let i = this.coinIndex; i < coins.length; i++) {
        const c = coins[i];
        if (c.x > x + 6) break;
        if (c.taken) continue;
        for (const p of pts) {
          const dx = p.x - c.x, dy = p.y - c.y;
          if (dx * dx + dy * dy < R * R) {
            c.taken = true;
            r.stats.coins++;
            r.stats.coinValue += c.v;
            this.events.push({ type: 'coin', value: c.v, x: c.x, y: c.y });
            break;
          }
        }
      }
    }

    _positions() {
      const list = this.racers.slice().sort((a, b) => {
        if (a.finished && b.finished) return a.finishTime - b.finishTime;
        if (a.finished) return -1;
        if (b.finished) return 1;
        return b.vehicle.x - a.vehicle.x;
      });
      list.forEach((r, i) => { if (!r.finished) r.place = i + 1; });
      this.order = list;
    }

    _endConditions(dt) {
      if (this.isRace) {
        if (this.state === 'finished') {
          this.doneTimer += dt;
          if (this.doneTimer > C.race.finishDelay) this.state = 'done';
          return;
        }
        if (this.state !== 'running') return;
        const opps = this.racers.filter((r) => !r.isPlayer);
        const allOpp = opps.length > 0 && opps.every((r) => r.finished || r.dnf);
        if ((allOpp && this.raceTime - (this.lastOpponentFinish || 0) > C.race.endAfterOpponents) || this.raceTime > C.race.maxTime) {
          this.state = 'done';
          this.endReason = 'timeout';
          this.player.place = this.racers.length;
        }
      }
      if (this.isAdventure && this.state === 'over') {
        this.doneTimer += dt;
        if (this.doneTimer > 0.4) this.state = 'done';
      }
    }

    _finishAdventure(reason) {
      if (this.state !== 'running') return;
      this.state = 'over';
      this.endReason = reason;
      this.events.push({ type: 'advEnd', reason });
    }

    /** Distanz des Spielers in Metern (ab Start) */
    distance() {
      if (!this.player) return 0;
      return Math.max(0, this.player.bestX - this.track.startX);
    }

    result() {
      const p = this.player;
      const res = {
        mode: this.mode, endReason: this.endReason,
        time: p.finished ? p.finishTime : this.raceTime,
        coins: p.stats.coinValue, coinCount: p.stats.coins, stuntCoins: p.stats.stuntCoins,
        stats: Object.assign({}, p.stats), distance: this.distance(),
      };
      if (this.isRace) {
        res.finished = p.finished;
        // Rennende: nicht auf alle warten – verbleibende KI-Zeiten aus ihrem bisherigen Tempo hochrechnen
        const tr = this.track;
        const rows = this.racers.map((r) => {
          const dist = Math.max(0, Math.min(tr.length, r.bestX - tr.startX));
          const o = { name: r.name, isPlayer: r.isPlayer, vehicle: r.def.name, color: r.color, finished: r.finished,
            time: r.finished ? r.finishTime : null, dist, dnf: false, why: null };
          if (!r.finished && !r.isPlayer) {
            const avg = dist / Math.max(1, this.raceTime);
            const rr = U.rng((this.track.seed | 0) * 7 + r.name.length * 131 + Math.round(dist));
            if (r.dnf) { o.dnf = true; o.why = r.fuelOut ? 'Tank leer' : 'ausgeschieden'; }
            else if (avg < C.race.dnfSpeed || r.fuel <= 0) { o.dnf = true; o.why = r.fuel <= 0 ? 'Tank leer' : 'ausgeschieden'; }
            else {
              // restliche Strecke mit eigenem Schnitt ± Streuung, Unfallneigung kostet etwas Zeit
              const est = this.raceTime + (tr.length - dist) / (avg * rr.range(0.94, 1.06)) + r.stats.crashes * rr.range(0, 1.2);
              if (est > C.race.maxTime) { o.dnf = true; o.why = 'ausgeschieden'; } else o.estTime = est;
            }
          }
          return o;
        });
        const key = (o) => (o.finished ? o.time : o.estTime !== undefined ? o.estTime : 1e6 - o.dist);
        rows.sort((a, b) => key(a) - key(b));
        res.order = rows;
        res.place = p.finished ? rows.findIndex((o) => o.isPlayer) + 1 : this.racers.length;
      }
      if (this.isAdventure) {
        res.score = Math.round(res.distance + res.stuntCoins * C.adventure.scorePerStuntCoin);
      }
      return res;
    }
  }

  GS.Session = Session;
})(window.GS = window.GS || {});

</script>
<script>
/* =====================================================================
   Speicherung (localStorage, Autosave mit Entprellung).

   Grundsätze (für alle künftigen Versionen verbindlich):
   - Fester Schlüssel C.SAVE_KEY ('gipfelsturm.save.v1') – NIE ändern, sonst
     verlieren alle Spieler ihren Stand. Neue Datenformate werden über
     SCHEMA + MIGRATIONS eingeführt, nicht über einen neuen Schlüssel.
   - Beim Laden: suchen → lesen/validieren → migrieren → fehlende Werte
     ergänzen → laden. Ungültige oder alte Stände werden vorher unter
     eigenen Schlüsseln gesichert, nie einfach überschrieben.
   - Daten, die diese Spielversion nicht kennt (z. B. Fahrzeug einer neueren
     Version), werden aufbewahrt und beim Speichern wieder mitgeschrieben.
   - Jeder Spieler hat seinen eigenen Stand im eigenen Browser (localStorage
     ist pro Browser und Website getrennt). Kein Konto, keine Cloud.
   Fällt ohne localStorage auf Arbeitsspeicher zurück.
   ===================================================================== */
'use strict';
(function (GS) {
  const C = GS.CONFIG;

  /** aktuelle Version des Datenformats; bei Strukturänderungen erhöhen + Migration ergänzen */
  const SCHEMA = 2;
  const KEY = C.SAVE_KEY;
  const KEY_BACKUP = KEY + '.backup';        // letzter gültiger Stand vor dem jüngsten Speichern
  const KEY_PRE = KEY + '.vor-update-v';     // + alte Schemaversion: Originalstand vor einer Migration
  const KEY_BROKEN = KEY + '.defekt';        // unlesbarer Stand, unverändert aufbewahrt
  const KEY_RESET = KEY + '.vor-reset';      // Stand vor „Fortschritt zurücksetzen“
  const KEY_NEWER = KEY + '.neuere-version'; // Original eines Stands aus einer neueren Spielversion

  function defaults() {
    const upgrades = {};
    upgrades[C.vehicles[0].id] = GS.VP.uniformLevels(1);
    return {
      v: SCHEMA,
      rev: 0,                             // Schreibzähler (Abgleich zwischen Tabs)
      savedAt: 0,
      coins: C.economy.startCoins,
      owned: [C.vehicles[0].id],
      selected: C.vehicles[0].id,
      upgrades,
      stars: { tracks: {}, cups: {} },
      best: { tracks: {} },              // beste Zeit je Strecke
      records: {},                        // Adventure je Umgebung: { dist, score }
      stats: { races: 0, wins: 0, flips: 0, backflips: 0, frontflips: 0, bestCombo: 0, maxAir: 0, coinsCollected: 0, cupWins: 0, coinsEarned: 0 },
      achievements: {},
      settings: { sound: true, volume: C.audio.defaults.volume, musicVolume: C.audio.defaults.musicVolume, sfxVolume: C.audio.defaults.sfxVolume, ai: 'medium', quality: 'high', hints: true },
      tutorialSeen: false,
      cupRun: null,                       // laufender Cup (wird nach Neuladen fortgesetzt)
      keep: {},                           // Daten unbekannter IDs (aus neueren/älteren Versionen)
    };
  }

  /* ---------- Migrationen: MIGRATIONS[n] hebt einen Stand von Version n auf n+1 ---------- */
  const MIGRATIONS = {
    // v1 → v2: Schreibzähler, Cup-Fortschritt, Ablage für unbekannte IDs (fehlende Felder ergänzt sanitize)
    1: (d) => { d.rev = d.rev || 0; d.cupRun = null; d.keep = d.keep || {}; return d; },
  };

  function migrate(raw) {
    let d = raw;
    let from = Math.floor(Number(d.v));
    if (!isFinite(from) || from < 1) from = 1;  // Stände ohne Versionsangabe = v1
    for (let n = from; n < SCHEMA; n++) if (MIGRATIONS[n]) d = MIGRATIONS[n](d) || d;
    return d;
  }

  const num = (v, d, min, max) => {
    if (v === null || v === undefined || v === '' || typeof v === 'boolean') return d;
    v = Number(v);
    if (!isFinite(v)) return d;
    if (min !== undefined && v < min) v = min;
    if (max !== undefined && v > max) v = max;
    return v;
  };
  const isObj = (o) => !!o && typeof o === 'object' && !Array.isArray(o);
  const safeId = (k) => typeof k === 'string' && k.length > 0 && k.length < 64 && !/^(__proto__|constructor|prototype)$/.test(k);
  const clone = (o) => { try { return JSON.parse(JSON.stringify(o)); } catch (_) { return undefined; } };

  /**
   * Validiert einen (migrierten) Stand und ergänzt fehlende Werte mit Standardwerten.
   * Ungültige Einzelwerte werden ersetzt; gültige bleiben erhalten. Einträge für
   * IDs, die diese Version nicht kennt, landen in d.keep und gehen nicht verloren.
   */
  function sanitize(raw) {
    const d = defaults();
    if (!isObj(raw)) return d;
    const vIds = C.vehicles.map((v) => v.id);
    const tIds = C.tracks.map((t) => t.id);
    const cIds = C.cups.map((c) => c.id);
    const eIds = Object.keys(C.environments);
    const aIds = C.achievements.map((a) => a.id);

    // aufbewahrte Daten früherer Ladevorgänge zuerst einlesen (Hauptdaten haben Vorrang)
    const oldKeep = isObj(raw.keep) ? raw.keep : {};
    const merged = (coll, sub) => {
      const k = oldKeep[coll] && (sub ? oldKeep[coll][sub] : oldKeep[coll]);
      const m = sub ? (raw[coll] && raw[coll][sub]) : raw[coll];
      return Object.assign({}, isObj(k) ? k : {}, isObj(m) ? m : {});
    };
    const keep = {};
    const stash = (path, id, val) => {
      let o = keep;
      for (const p of path) o = o[p] = o[p] || {};
      o[id] = clone(val);
    };

    d.coins = Math.floor(num(raw.coins, d.coins, 0, 1e9));

    // Fahrzeuge (Besitz) – unbekannte IDs bleiben in keep.owned
    const ownRaw = (Array.isArray(raw.owned) ? raw.owned : []).concat(Array.isArray(oldKeep.owned) ? oldKeep.owned : []);
    const own = [];
    const ownUnknown = [];
    for (const id of ownRaw) {
      if (!safeId(id)) continue;
      if (vIds.includes(id)) { if (!own.includes(id)) own.push(id); } else if (!ownUnknown.includes(id)) ownUnknown.push(id);
    }
    if (!own.includes(vIds[0])) own.unshift(vIds[0]);
    d.owned = own;
    if (ownUnknown.length) keep.owned = ownUnknown;
    d.selected = d.owned.includes(raw.selected) ? raw.selected : d.owned[0];
    // Auswahl aus einer Version, die das Fahrzeug kannte, wiederherstellen (wird bei neuer Auswahl verworfen)
    if (typeof oldKeep.selected === 'string' && d.owned.includes(oldKeep.selected)) d.selected = oldKeep.selected;
    if (typeof raw.selected === 'string' && !vIds.includes(raw.selected) && safeId(raw.selected)) keep.selected = raw.selected;
    else if (typeof oldKeep.selected === 'string' && !vIds.includes(oldKeep.selected)) keep.selected = oldKeep.selected;

    // Upgrades
    const ups = merged('upgrades');
    for (const id of d.owned) d.upgrades[id] = GS.VP.levelsOf(isObj(ups[id]) ? ups[id] : {});
    for (const id of Object.keys(ups)) if (safeId(id) && !vIds.includes(id) && isObj(ups[id])) stash(['upgrades'], id, ups[id]);

    // Sterne
    const st = merged('stars', 'tracks');
    for (const id of Object.keys(st)) {
      if (!safeId(id)) continue;
      const val = Math.floor(num(st[id], 0, 0, 3));
      if (tIds.includes(id)) d.stars.tracks[id] = val; else stash(['stars', 'tracks'], id, val);
    }
    const sc = merged('stars', 'cups');
    for (const id of Object.keys(sc)) {
      if (!safeId(id)) continue;
      const val = Math.floor(num(sc[id], 0, 0, 3));
      if (cIds.includes(id)) d.stars.cups[id] = val; else stash(['stars', 'cups'], id, val);
    }

    // Bestzeiten
    const bt = merged('best', 'tracks');
    for (const id of Object.keys(bt)) {
      if (!safeId(id)) continue;
      const val = num(bt[id], null, 0, 1e5);
      if (val === null) continue;
      if (tIds.includes(id)) d.best.tracks[id] = val; else stash(['best', 'tracks'], id, val);
    }

    // Adventure-Rekorde
    const rec = merged('records');
    for (const id of Object.keys(rec)) {
      const r = rec[id];
      if (!safeId(id) || !isObj(r)) continue;
      const val = { dist: num(r.dist, 0, 0, 1e7), score: num(r.score, 0, 0, 1e9) };
      if (eIds.includes(id)) d.records[id] = val; else stash(['records'], id, val);
    }

    // Statistik (unbekannte Zähler aufbewahren)
    const stats = merged('stats');
    for (const k of Object.keys(stats)) {
      if (!safeId(k)) continue;
      if (k in d.stats) d.stats[k] = num(stats[k], 0, 0, 1e12);
      else if (isFinite(Number(stats[k]))) stash(['stats'], k, Number(stats[k]));
    }

    // Leistungen
    const ach = merged('achievements');
    for (const id of Object.keys(ach)) {
      if (!safeId(id) || !ach[id]) continue;
      if (aIds.includes(id)) d.achievements[id] = true; else stash(['achievements'], id, true);
    }

    // Einstellungen inkl. Audio
    if (isObj(raw.settings) || isObj(oldKeep.settings)) {
      const s = Object.assign({}, isObj(oldKeep.settings) ? oldKeep.settings : {}, isObj(raw.settings) ? raw.settings : {});
      d.settings.sound = s.sound !== false;
      d.settings.volume = num(s.volume, C.audio.defaults.volume, 0, 1);
      d.settings.musicVolume = num(s.musicVolume, C.audio.defaults.musicVolume, 0, 1);
      d.settings.sfxVolume = num(s.sfxVolume, C.audio.defaults.sfxVolume, 0, 1);
      d.settings.ai = typeof s.ai === 'string' && C.ai.levels[s.ai] ? s.ai : 'medium';
      d.settings.quality = s.quality === 'low' ? 'low' : 'high';
      d.settings.hints = s.hints !== false;
      for (const k of Object.keys(s)) if (!(k in d.settings) && safeId(k)) stash(['settings'], k, s[k]);
    }
    d.tutorialSeen = !!raw.tutorialSeen;

    // laufender Cup
    d.cupRun = sanitizeCupRun(raw.cupRun);

    // unbekannte Felder der obersten Ebene (z. B. aus einer neueren Version) unverändert behalten
    for (const k of Object.keys(raw)) if (!(k in d) && safeId(k)) keep['top.' + k] = clone(raw[k]);
    for (const k of Object.keys(oldKeep)) if (k.indexOf('top.') === 0 && !(k in keep) && !(k.slice(4) in d)) keep[k] = clone(oldKeep[k]);

    d.rev = Math.floor(num(raw.rev, 0, 0, 1e12));
    d.savedAt = num(raw.savedAt, 0, 0, 1e15);
    d.keep = keep;
    return d;
  }

  function sanitizeCupRun(r) {
    if (!isObj(r) || typeof r.id !== 'string') return null;
    const def = C.cups.find((c) => c.id === r.id);
    if (!def) return null;
    const idx = Math.floor(num(r.idx, -1, -1, def.races.length));
    if (idx < 1 || idx >= def.races.length) return null;     // nur sinnvoll zwischen Rennen 1 und dem letzten
    if (!Array.isArray(r.opponents) || r.opponents.length !== def.opponents.length) return null;
    const opponents = [];
    for (const o of r.opponents) {
      if (!isObj(o) || typeof o.name !== 'string' || !GS.VP.def(o.vehicleId)) return null;
      const op = { vehicleId: o.vehicleId, levels: GS.VP.levelsOf(isObj(o.levels) ? o.levels : {}), skill: num(o.skill, 0.5, 0, 1), name: o.name.slice(0, 40), color: typeof o.color === 'string' ? o.color.slice(0, 20) : '#888' };
      // Fahrstil der KI (seit Version 8) über seine ID wiederherstellen
      const sid = isObj(o.style) ? o.style.id : o.style;
      const st = C.ai.styles && C.ai.styles.find((x) => x.id === sid);
      if (st) op.style = st;
      opponents.push(op);
    }
    const points = {};
    if (isObj(r.points)) for (const k of Object.keys(r.points)) if (safeId(k)) points[k] = Math.floor(num(r.points[k], 0, 0, 1e4));
    const places = Array.isArray(r.places) ? r.places.slice(0, idx).map((p) => Math.floor(num(p, 4, 1, 8))) : [];
    const lastOrder = Array.isArray(r.lastOrder) ? r.lastOrder.filter((n) => typeof n === 'string').slice(0, 8) : [];
    return { id: def.id, idx, opponents, points, places, lastOrder };
  }

  /* ---------- Speicherzugriff (alle Fehler abgefangen) ---------- */
  const store = {
    get(k) { try { return window.localStorage.getItem(k); } catch (_) { return null; } },
    set(k, v) { try { window.localStorage.setItem(k, v); return true; } catch (_) { return false; } },
    ok() {
      try { const t = KEY + '.test'; window.localStorage.setItem(t, '1'); window.localStorage.removeItem(t); return true; } catch (_) { return false; }
    },
  };

  /** liest einen Schlüssel: { state: 'none' | 'ok' | 'broken', raw, text } */
  function read(k) {
    const text = store.get(k);
    if (text === null || text === undefined) return { state: 'none' };
    try {
      const raw = JSON.parse(text);
      if (!isObj(raw)) return { state: 'broken', text };
      return { state: 'ok', raw, text };
    } catch (_) {
      return { state: 'broken', text };
    }
  }

  const Save = {
    data: defaults(),
    persistent: true,
    status: 'neu',        // neu | geladen | migriert | repariert | aus-backup | defekt-gesichert | kein-speicher
    _timer: null,
    _lastText: null,      // zuletzt geschriebener/gelesener Hauptstand (für Backup)
    onExternalChange: null,

    /** Start: suchen → validieren → migrieren → ergänzen → laden */
    load() {
      this.persistent = store.ok();
      // auch wenn nicht geschrieben werden kann (Speicher voll), vorhandenen Stand lesen

      let main = read(KEY);
      let raw = null;
      if (main.state === 'ok') {
        raw = main.raw;
        this.status = 'geladen';
      } else if (main.state === 'broken') {
        // unlesbaren Stand unverändert sichern (nie überschreiben), dann Backup versuchen
        if (store.get(KEY_BROKEN) !== main.text) store.set(KEY_BROKEN, main.text);
        const bak = read(KEY_BACKUP);
        if (bak.state === 'ok') { raw = bak.raw; this.status = 'aus-backup'; } else this.status = 'defekt-gesichert';
      } else {
        // kein Hauptstand: evtl. Backup vorhanden (z. B. abgebrochener Schreibvorgang)
        const bak = read(KEY_BACKUP);
        if (bak.state === 'ok') { raw = bak.raw; this.status = 'aus-backup'; }
      }

      if (raw) {
        const from = Math.floor(Number(raw.v)) || 1;
        if (from < SCHEMA) {
          // Originalstand vor der Migration einmalig aufbewahren
          const k = KEY_PRE + from;
          if (store.get(k) === null) store.set(k, JSON.stringify(raw));
          raw = migrate(clone(raw));
          if (this.status === 'geladen') this.status = 'migriert';
        } else if (from > SCHEMA) {
          // Stand einer neueren Spielversion (z. B. nach Rückkehr zu einer älteren Kopie): Original aufbewahren
          store.set(KEY_NEWER, JSON.stringify(raw));
        }
        this.data = sanitize(raw);
      } else {
        this.data = defaults();
      }
      this._lastText = main.state === 'ok' ? main.text : null;
      // Der bereinigte Stand wird sofort geschrieben – alte/defekte Originale sind vorher gesichert.
      if (raw && this.persistent) this.flush();
      if (!this.persistent && main.state === 'none' && !raw) this.status = 'kein-speicher';
      this._watchOtherTabs();
      this._requestPersistence();
      return this.data;
    },

    /** entprelltes Speichern (Autosave) */
    save() {
      if (this._timer) clearTimeout(this._timer);
      this._timer = setTimeout(() => this.flush(), 250);
    },

    /** sofort speichern; vorheriger gültiger Stand wird zum Backup */
    flush() {
      if (this._timer) { clearTimeout(this._timer); this._timer = null; }
      // Hat ein anderer Tab inzwischen neuer gespeichert, dessen Stand nicht blind überschreiben
      const cur = read(KEY);
      if (cur.state === 'ok' && Number(cur.raw.rev) > this.data.rev && cur.text !== this._lastText) this._adopt(cur.raw, cur.text, false);
      if (cur.state === 'ok') store.set(KEY_BACKUP, cur.text);
      else if (cur.state === 'broken' && store.get(KEY_BROKEN) !== cur.text) store.set(KEY_BROKEN, cur.text);
      this.data.v = SCHEMA;
      this.data.rev = (this.data.rev || 0) + 1;
      this.data.savedAt = Date.now();
      const text = JSON.stringify(this.data);
      const ok = store.set(KEY, text);
      if (ok) this._lastText = text; else this.data.rev -= 1;
      this.persistent = ok;
      return ok;
    },

    reset() {
      const cur = store.get(KEY);
      if (cur !== null) store.set(KEY_RESET, cur);
      const settings = Object.assign({}, this.data.settings);
      const rev = this.data.rev;
      this.data = defaults();
      this.data.settings = settings;
      this.data.rev = rev;
      this.flush();
    },

    /** Stand eines anderen Tabs übernehmen */
    _adopt(raw, text, notify) {
      let r = clone(raw);
      if ((Math.floor(Number(r.v)) || 1) < SCHEMA) r = migrate(r);
      this.data = sanitize(r);
      this._lastText = text;
      if (notify && typeof this.onExternalChange === 'function') { try { this.onExternalChange(); } catch (_) { /* ignorieren */ } }
    },
    _watchOtherTabs() {
      if (this._watching) return;
      this._watching = true;
      try {
        window.addEventListener('storage', (e) => {
          if (e.key !== KEY || !e.newValue || e.newValue === this._lastText) return;
          const r = read(KEY);
          if (r.state === 'ok' && Number(r.raw.rev) >= this.data.rev) this._adopt(r.raw, r.text, true);
        });
      } catch (_) { /* ignorieren */ }
    },
    /** Browser bitten, den Speicher nicht automatisch zu räumen (wo unterstützt) */
    _requestPersistence() {
      try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (_) { /* ignorieren */ }
    },
  };
  Save.SCHEMA = SCHEMA;
  Save.KEYS = { main: KEY, backup: KEY_BACKUP, pre: KEY_PRE, broken: KEY_BROKEN, reset: KEY_RESET, newer: KEY_NEWER };
  Save.defaults = defaults;
  Save.sanitize = sanitize;
  Save.migrate = migrate;

  GS.Save = Save;

<script>
/* =====================================================================
   Progression: Sterne, Freischaltungen, Belohnungen, Käufe, Upgrades,
   Leistungen. Liest/schreibt nur GS.Save.data.
   ===================================================================== */
'use strict';
(function (GS) {
  const C = GS.CONFIG;
  const U = GS.U;
  const D = () => GS.Save.data;

  const P = {};

  P.stars = () => {
    const s = D().stars;
    let n = 0;
    for (const k in s.tracks) n += s.tracks[k];
    for (const k in s.cups) n += s.cups[k];
    return n;
  };
  P.maxStars = () => C.tracks.length * 3 + C.cups.length * 3;
  P.trackUnlocked = (t) => P.stars() >= t.reqStars;
  P.cupUnlocked = (c) => P.stars() >= c.reqStars;
  P.vehicleUnlocked = (v) => P.stars() >= v.reqStars;
  P.owned = (id) => D().owned.includes(id);
  P.levels = (id) => D().upgrades[id] || GS.VP.uniformLevels(1);
  P.envUnlocked = (env) => C.tracks.some((t) => t.env === env && P.trackUnlocked(t));

  /** Menge aller freigeschalteten Inhalte (für "Neu freigeschaltet"-Hinweise) */
  P.unlockSet = () => {
    const out = new Set();
    for (const t of C.tracks) if (P.trackUnlocked(t)) out.add('track:' + t.id);
    for (const c of C.cups) if (P.cupUnlocked(c)) out.add('cup:' + c.id);
    for (const v of C.vehicles) if (P.vehicleUnlocked(v)) out.add('veh:' + v.id);
    return out;
  };
  P.describeUnlocks = (before, after) => {
    const msgs = [];
    for (const k of after) {
      if (before.has(k)) continue;
      const [type, id] = k.split(':');
      if (type === 'track') { const t = C.tracks.find((x) => x.id === id); msgs.push('Neue Strecke: ' + t.name + ' (' + C.environments[t.env].name + ')'); }
      if (type === 'cup') msgs.push('Neuer Cup: ' + C.cups.find((x) => x.id === id).name);
      if (type === 'veh') msgs.push('Fahrzeug kaufbar: ' + C.vehicles.find((x) => x.id === id).name);
    }
    return msgs;
  };

  /* ---------- Käufe ---------- */
  P.upgradeCost = (vid, cat) => {
    const lvl = P.levels(vid)[cat];
    if (lvl >= C.upgrades.maxLevel) return null;
    const def = GS.VP.def(vid);
    return Math.round((def.upgradeCost * C.upgrades.costFactors[lvl - 1]) / 10) * 10;
  };
  P.buyUpgrade = (vid, cat) => {
    if (!P.owned(vid)) return false;
    const cost = P.upgradeCost(vid, cat);
    if (cost === null || D().coins < cost) return false;
    D().coins -= cost;
    D().upgrades[vid][cat] += 1;
    GS.Save.save();
    return true;
  };
  P.buyVehicle = (vid) => {
    const def = GS.VP.def(vid);
    if (P.owned(vid) || !P.vehicleUnlocked(def) || D().coins < def.price) return false;
    D().coins -= def.price;
    D().owned.push(vid);
    D().upgrades[vid] = GS.VP.uniformLevels(1);
    D().selected = vid;
    if (D().keep) delete D().keep.selected;
    GS.Save.save();
    return true;
  };
  P.select = (vid) => {
    if (!P.owned(vid)) return false;
    D().selected = vid;
    if (D().keep) delete D().keep.selected;   // bewusste Auswahl ersetzt eine aufbewahrte
    GS.Save.save();
    return true;
  };

  /* ---------- Gegner ---------- */
  /** Spielfortschritt 0..1 (Sterne, Upgrades, Fahrzeuge, Rennen, Cups) – bestimmt die KI-Stärke */
  P.progress = () => {
    const d = D(), W = C.ai.progressWeights;
    let lv = 0, n = 0;
    for (const id of d.owned) { const l = P.levels(id); for (const c in l) { lv += l[c] - 1; n++; } }
    const up = n ? lv / (n * (C.upgrades.maxLevel - 1)) : 0;
    let cupStars = 0; for (const k in d.stars.cups) cupStars += d.stars.cups[k];
    const p = W.stars * (P.stars() / P.maxStars())
      + W.upgrades * up
      + W.vehicles * ((d.owned.length - 1) / Math.max(1, C.vehicles.length - 1))
      + W.races * Math.min(1, d.stats.races / C.ai.racesForFull)
      + W.cups * (cupStars / Math.max(1, C.cups.length * 3));
    return U.clamp(p, 0, 1);
  };
  /** mittlere Upgrade-Stufe eines Fahrzeugs (1..5) */
  P.power = (vid) => { const l = P.levels(vid); let a = 0, n = 0; for (const c in l) { a += l[c]; n++; } return a / n; };
  P.aiBase = () => ({ skill: U.lerp(C.ai.skillRange[0], C.ai.skillRange[1], P.progress()), rewardMul: 1 });
  /**
   * Gegner für ein Rennen: Fahrzeug aus der Streckenliste, virtuelle Upgrades relativ zum Spieler,
   * Fahrstil und Können aus dem Fortschritt. Keine versteckten Vorteile – nur echte Fahrzeugwerte.
   */
  P.opponentsFor = (list, seed) => {
    const r = U.rng(seed * 7 + 3);
    const A = C.ai;
    const names = A.names.slice();
    const out = [];
    const base = P.aiBase().skill;
    const pl = P.power(D().selected);
    const cats = C.upgrades.categories.map((c) => c.id);
    list.forEach((o, i) => {
      const ni = Math.floor(r() * names.length);
      const sr = U.rng(seed * 13 + i * 101 + 7);
      const style = A.styles[Math.floor(sr() * 997) % A.styles.length];
      const rel = (A.relLevels[i] !== undefined ? A.relLevels[i] : 0) + r.range(-0.4, 0.4);
      const target = U.clamp(U.lerp(o.lvl, pl, A.playerLevelBlend) + rel, 1, C.upgrades.maxLevel);
      // virtuelle Upgrades: um die Zielstufe gestreut (jeder Gegner setzt andere Schwerpunkte)
      const levels = {};
      for (const c of cats) levels[c] = U.clamp(Math.round(target + r.range(-0.7, 0.7)), 1, C.upgrades.maxLevel);
      const strong = rel > 0.5 ? A.strongSkillCut : 0;
      out.push({
        vehicleId: o.v, levels, style,
        skill: U.clamp(base + o.skill + style.skill - strong, 0.1, 0.97), name: names.splice(ni, 1)[0], color: A.colors[i % A.colors.length],
      });
    });
    return out;
  };

  /* ---------- Rennergebnis ---------- */
  P.raceRewards = (tier, res) => {
    const E = C.economy;
    const mul = P.aiBase().rewardMul;
    const placeIdx = U.clamp(res.place - 1, 0, 3);
    const placeCoins = res.finished ? Math.round((E.trackReward[tier] * E.placeShare[placeIdx] * mul) / 5) * 5 : 0;
    return { placeCoins, coins: res.coins, stunts: res.stuntCoins, mul, total: placeCoins + res.coins + res.stuntCoins };
  };

  function applyStats(res) {
    const st = D().stats;
    st.flips += res.stats.flips;
    st.backflips += res.stats.backflips;
    st.frontflips += res.stats.frontflips;
    st.bestCombo = Math.max(st.bestCombo, res.stats.bestCombo);
    st.maxAir = Math.max(st.maxAir, res.stats.maxAir);
    st.coinsCollected += res.coinCount;
  }

  /** Einzelrennen auswerten */
  P.applyRace = (track, res) => {
    const before = P.unlockSet();
    const rw = P.raceRewards(track.tier, res);
    const d = D();
    d.coins += rw.total;
    d.stats.coinsEarned += rw.total;
    applyStats(res);
    d.stats.races += 1;
    if (res.finished && res.place === 1) d.stats.wins += 1;
    const starsNow = res.finished ? C.economy.raceStars[U.clamp(res.place - 1, 0, 3)] : 0;
    const prevStars = d.stars.tracks[track.id] || 0;
    let starGain = 0;
    if (starsNow > prevStars) { starGain = starsNow - prevStars; d.stars.tracks[track.id] = starsNow; }
    let bestTime = false;
    if (res.finished && (d.best.tracks[track.id] == null || res.time < d.best.tracks[track.id])) { d.best.tracks[track.id] = res.time; bestTime = true; }
    const unlocks = P.describeUnlocks(before, P.unlockSet());
    GS.Save.save();
    return { rewards: rw, stars: starsNow, prevStars, starGain, unlocks, bestTime };
  };

  /** Cup-Rennen: Münzen + Statistik, Sterne erst am Cup-Ende */
  P.applyCupRace = (res) => {
    const d = D();
    const rw = { placeCoins: 0, coins: res.coins, stunts: res.stuntCoins, mul: 1, total: res.coins + res.stuntCoins };
    d.coins += rw.total;
    d.stats.coinsEarned += rw.total;
    applyStats(res);
    d.stats.races += 1;
    if (res.finished && res.place === 1) d.stats.wins += 1;
    GS.Save.save();
    return { rewards: rw };
  };
  P.applyCupEnd = (cup, place) => {
    const before = P.unlockSet();
    const d = D();
    const idx = U.clamp(place - 1, 0, 3);
    const coins = Math.round((cup.reward * C.cupRewardShare[idx] * P.aiBase().rewardMul) / 10) * 10;
    d.coins += coins;
    d.stats.coinsEarned += coins;
    if (place === 1) d.stats.cupWins += 1;
    const s = C.cupStars[idx];
    const prev = d.stars.cups[cup.id] || 0;
    let starGain = 0;
    if (s > prev) { starGain = s - prev; d.stars.cups[cup.id] = s; }
    const unlocks = P.describeUnlocks(before, P.unlockSet());
    GS.Save.save();
    return { coins, stars: s, prevStars: prev, starGain, unlocks };
  };

  /** Adventure auswerten */
  P.applyAdventure = (env, res) => {
    const d = D();
    const total = res.coins + res.stuntCoins;
    d.coins += total;
    d.stats.coinsEarned += total;
    applyStats(res);
    const rec = d.records[env] || { dist: 0, score: 0 };
    const newDist = Math.floor(res.distance) > rec.dist;
    const newScore = res.score > rec.score;
    d.records[env] = { dist: Math.max(rec.dist, Math.floor(res.distance)), score: Math.max(rec.score, res.score) };
    GS.Save.save();
    return { total, newDist, newScore, prev: rec };
  };

  /* ---------- Leistungen ---------- */
  P.statValue = (stat) => {
    const d = D();
    switch (stat) {
      case 'bestDistance': { let m = 0; for (const k in d.records) m = Math.max(m, d.records[k].dist); return m; }
      case 'vehiclesOwned': return d.owned.length;
      case 'maxUpgrade': { let m = 1; for (const id in d.upgrades) for (const c in d.upgrades[id]) m = Math.max(m, d.upgrades[id][c]); return m; }
      default: return d.stats[stat] || 0;
    }
  };
  /** neu erreichte Leistungen vergeben (Münzen), Liste zurückgeben */
  P.checkAchievements = () => {
    const d = D();
    const got = [];
    for (const a of C.achievements) {
      if (d.achievements[a.id]) continue;
      if (P.statValue(a.stat) >= a.goal) {
        d.achievements[a.id] = true;
        d.coins += a.reward;
        got.push(a);
      }
    }
    if (got.length) GS.Save.save();
    return got;
  };

  GS.Progress = P;
})(window.GS = window.GS || {});

</script>
