/* =====================================================================
   Kamera: folgt weich, schaut voraus, zoomt bei Tempo/Sprüngen heraus,
   hält das Fahrzeug immer sicher im Bild.
   ===================================================================== */
'use strict';
(function (GS) {
  const C = GS.CONFIG;
  const U = GS.U;

  class Camera {
    constructor() {
      this.x = 0; this.y = 0;
      this.w = 800; this.h = 450;
      this.baseScale = 40;
      this.scale = 40;
      this.zoom = 1;
      this.look = 0;
      this.ready = false;
    }
    resize(w, h) {
      this.w = w; this.h = h;
      const K = C.camera;
      const portrait = h > w * 1.05;
      this.portrait = portrait;
      const vw = portrait ? K.portraitWidth : K.landscapeWidth;
      this.baseScale = Math.min(w / vw, h / K.minHeight);
      this.scale = this.baseScale / this.zoom;
    }
    get viewW() { return this.w / this.scale; }
    get viewH() { return this.h / this.scale; }
    get left() { return this.x - this.viewW / 2; }
    get right() { return this.x + this.viewW / 2; }
    get top() { return this.y + this.viewH / 2; }
    get bottom() { return this.y - this.viewH / 2; }

    sx(wx) { return (wx - this.x) * this.scale + this.w / 2; }
    sy(wy) { return this.h / 2 - (wy - this.y) * this.scale; }

    /** einem Fahrzeug folgen; snap = sofort springen */
    follow(vehicle, track, dt, snap) {
      const K = C.camera;
      const pos = vehicle.chassis.getPosition();
      const vel = vehicle.chassis.getLinearVelocity();
      const sp = Math.hypot(vel.x, vel.y);
      const hg = vehicle.inAir ? Math.max(0, pos.y - track.heightAt(pos.x) - 1) : 0;
      const zt = 1 + Math.min(K.maxZoomOut - 1, sp * K.zoomOutPerSpeed + Math.min(hg, 8) * K.zoomOutAir * 0.5);
      this.zoom = snap ? zt : U.damp(this.zoom, zt, 1.3, dt);
      this.scale = this.baseScale / this.zoom;
      const lookT = U.clamp(vel.x * K.lookAhead, -3, K.lookAheadMax);
      this.look = snap ? lookT : U.damp(this.look, lookT, 1.6, dt);
      const vw = this.viewW, vh = this.viewH;
      const sxT = this.portrait ? K.screenX - 0.08 : K.screenX;
      const syT = this.portrait ? K.screenY + 0.06 : K.screenY;
      const tx = pos.x + (0.5 - sxT) * vw + this.look * 0.6;
      const ahead = track.heightAt(pos.x + this.look + 5) - track.heightAt(pos.x);
      const ty = pos.y + (syT - 0.5) * vh + U.clamp(ahead, -6, 6) * 0.3;
      if (snap || !this.ready) { this.x = tx; this.y = ty; this.ready = true; }
      else {
        this.x = U.damp(this.x, tx, K.followX, dt);
        this.y = U.damp(this.y, ty, K.followY, dt);
      }
      // Fahrzeug niemals aus dem Bild verlieren
      const minX = pos.x - (K.edgeX[1] - 0.5) * vw, maxX = pos.x - (K.edgeX[0] - 0.5) * vw;
      this.x = U.clamp(this.x, minX, maxX);
      const minY = pos.y - (0.5 - K.edgeY[0]) * vh, maxY = pos.y + (K.edgeY[1] - 0.5) * vh;
      this.y = U.clamp(this.y, minY, maxY);
    }
  }

  GS.Camera = Camera;
})(window.GS = window.GS || {});

</script>

  function poly(ctx, pts) {

    ctx.moveTo(pts[0][0], pts[0][1]);

      ctx.fillStyle = '#9aa1a8'; ctx.fillRect(0.9, 0.9, 0.08, 1.1);
      ctx.fillStyle = '#fff6c9'; rrect(ctx, 2.24, 0.42, 0.12, 0.16, 0.03); ctx.fill();
      ctx.fillStyle = '#2b2f36'; rrect(ctx, -2.34, -0.06, 4.74, 0.1, 0.04); ctx.fill();
    },
    glider(ctx, col) {
      // Leitwerk
      ctx.fillStyle = col.accent;
      poly(ctx, [[-1.22, 0.44], [-0.9, 0.44], [-1.25, 1.18], [-1.45, 1.2]]); ctx.fill();
      ctx.fillStyle = col.dark; poly(ctx, [[-1.62, 1.12], [-1.0, 1.14], [-1.02, 1.22], [-1.6, 1.22]]); ctx.fill();
      // Wanne
      ctx.fillStyle = col.main;
      ctx.beginPath();
      ctx.moveTo(-1.22, 0.02); ctx.lineTo(1.24, 0.02); ctx.quadraticCurveTo(1.36, 0.06, 1.32, 0.26);
      ctx.lineTo(0.72, 0.42); ctx.lineTo(-1.22, 0.46); ctx.closePath(); ctx.fill();
      ctx.fillStyle = col.accent; poly(ctx, [[-1.2, 0.2], [1.3, 0.14], [1.3, 0.2], [-1.2, 0.28]]); ctx.fill();
      // Käfig
      ctx.strokeStyle = '#2b2e33'; ctx.lineWidth = 0.06; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.moveTo(-0.6, 0.44); ctx.lineTo(-0.45, 1.28); ctx.lineTo(0.1, 1.28); ctx.lineTo(0.55, 0.42); ctx.stroke();
      ctx.fillStyle = '#fff6c9'; circle(ctx, 1.22, 0.24, 0.06); ctx.fill();
    },
  });

  /** Teile, die über den Rädern liegen (z. B. Kette) */
  const LOOKS_AFTER = {
    tracked(ctx, col, def, wheels) {
      const r = def.wheels[0].r + 0.06;
      const ws = wheels.map((w) => ({ x: w.x, y: w.y })).sort((a, b) => a.x - b.x);
      const L = ws[0], Rw = ws[ws.length - 1];
      const pts = [];
      const N = 8;
      for (let k = 0; k <= N; k++) { const a = Math.PI / 2 - (Math.PI * k) / N; pts.push([Rw.x + Math.cos(a) * r, Rw.y + Math.sin(a) * r]); }
      for (let i = ws.length - 2; i >= 1; i--) pts.push([ws[i].x, ws[i].y - r]);
      for (let k = 0; k <= N; k++) { const a = -Math.PI / 2 - (Math.PI * k) / N; pts.push([L.x + Math.cos(a) * r, L.y + Math.sin(a) * r]); }
      ctx.beginPath();
      pts.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])));
      ctx.closePath();
      ctx.lineJoin = 'round';
      ctx.strokeStyle = '#26282c'; ctx.lineWidth = 0.12; ctx.stroke();
      // Kettenglieder laufen mit der Raddrehung
      ctx.setLineDash([0.08, 0.1]);
      ctx.lineDashOffset = wheels[0].rot * r;
      ctx.strokeStyle = '#4a4e55'; ctx.lineWidth = 0.05; ctx.stroke();
      ctx.setLineDash([]);
      ctx.lineDashOffset = 0;
    },
  };
  // Federbein-Höhe über der Radachse je Design (null = keine sichtbaren Federbeine)
  const STRUT_TOP = { bike: null, tracked: null, monster: 0.75, trophy: 0.98, buggy: 0.5, glider: 0.5 };
  // Designs ohne Radkästen (freistehende Räder)
  const NO_ARCH = { monster: 1, buggy: 1, trophy: 1, glider: 1, dragster: 1, tracked: 1 };

  function drawWheel(ctx, wd, lx, ly, rot, col, big) {
    const r = wd.r;
    ctx.save();
    ctx.translate(lx, ly);
    ctx.rotate(rot);
    ctx.fillStyle = '#1c1d20';
    circle(ctx, 0, 0, r); ctx.fill();
    // Profil
    ctx.fillStyle = '#2c2e33';
    const n = big ? 14 : 10;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU;
      ctx.save(); ctx.rotate(a);
      ctx.fillRect(r * 0.86, -r * 0.09, r * 0.16, r * 0.18);
      ctx.restore();
    }
    ctx.fillStyle = col.rim;
    circle(ctx, 0, 0, r * 0.56); ctx.fill();
    ctx.strokeStyle = shade(col.rim, -0.35);
    ctx.lineWidth = r * 0.09;
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * TAU;
      ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * r * 0.5, Math.sin(a) * r * 0.5);
    }
    ctx.stroke();
    ctx.fillStyle = shade(col.rim, -0.5);
    circle(ctx, 0, 0, r * 0.14); ctx.fill();
    ctx.restore();
  }

  /** Rollkörper und Brocken (lokal, Meter) */
  function drawRoller(ctx, look, r, t) {
    if (look === 'hay') {
      ctx.fillStyle = '#d9b44a'; circle(ctx, 0, 0, r); ctx.fill();
      ctx.strokeStyle = '#b08a2c'; ctx.lineWidth = 0.04;
      for (let k = 1; k < 4; k++) { ctx.beginPath(); ctx.arc(0, 0, (r * k) / 4, k, k + 4.6); ctx.stroke(); }
      ctx.strokeStyle = '#8a6a22'; ctx.lineWidth = 0.05; ctx.beginPath(); ctx.moveTo(-r, 0); ctx.lineTo(r, 0); ctx.stroke();
    } else if (look === 'boulder' || look === 'rock') {
      ctx.fillStyle = look === 'rock' ? '#7d7268' : '#b58a5a';
      ctx.beginPath();
      for (let k = 0; k < 9; k++) { const a = (k / 9) * TAU; const rr = r * (0.86 + 0.14 * Math.sin(k * 2.7 + 1)); ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.beginPath(); ctx.arc(0, 0, r * 0.85, Math.PI * 1.1, Math.PI * 1.9); ctx.lineTo(0, 0); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 0.035; ctx.beginPath(); ctx.moveTo(-r * 0.3, r * 0.2); ctx.lineTo(r * 0.1, -r * 0.1); ctx.lineTo(r * 0.35, r * 0.15); ctx.stroke();
    } else if (look === 'snowball') {
      ctx.fillStyle = '#f4f8fb'; circle(ctx, 0, 0, r); ctx.fill();
      ctx.fillStyle = 'rgba(150,175,200,0.35)'; ctx.beginPath(); ctx.arc(0, 0, r, Math.PI * 1.05, Math.PI * 1.95); ctx.fill();
      ctx.fillStyle = 'rgba(160,180,200,0.6)'; circle(ctx, r * 0.3, r * 0.25, r * 0.12); ctx.fill(); circle(ctx, -r * 0.35, -r * 0.1, r * 0.09); ctx.fill();
    } else if (look === 'barrel') {
      ctx.fillStyle = '#b8322a'; circle(ctx, 0, 0, r); ctx.fill();
      ctx.strokeStyle = '#7a1d17'; ctx.lineWidth = 0.05; circle(ctx, 0, 0, r * 0.72); ctx.stroke(); circle(ctx, 0, 0, r * 0.36); ctx.stroke();
      ctx.fillStyle = '#e8e0d0'; circle(ctx, r * 0.5, 0, r * 0.1); ctx.fill();
    } else if (look === 'lava') {
      ctx.fillStyle = '#2a1d1a';
      ctx.beginPath();
      for (let k = 0; k < 8; k++) { const a = (k / 8) * TAU; const rr = r * (0.85 + 0.15 * Math.sin(k * 3.1)); ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(255,' + Math.round(110 + 60 * Math.sin((t || 0) * 6)) + ',40,0.9)'; ctx.lineWidth = 0.05;
      ctx.beginPath(); ctx.moveTo(-r * 0.5, 0); ctx.lineTo(0, r * 0.2); ctx.lineTo(r * 0.4, -r * 0.3); ctx.moveTo(0, r * 0.2); ctx.lineTo(r * 0.1, r * 0.6); ctx.stroke();
    }
  }

  function drawHead(ctx, h, helmet) {
    // Fahrerkopf mit Helm und Visier
    ctx.fillStyle = shade(helmet, -0.2);
    rrect(ctx, h.x - h.r * 1.1, h.y - h.r * 2.1, h.r * 2.1, h.r * 1.4, h.r * 0.4); ctx.fill();
    ctx.fillStyle = helmet;
    circle(ctx, h.x, h.y, h.r); ctx.fill();
    ctx.fillStyle = '#20252b';
    ctx.beginPath(); ctx.ellipse(h.x + h.r * 0.42, h.y - h.r * 0.05, h.r * 0.52, h.r * 0.36, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath(); ctx.ellipse(h.x + h.r * 0.5, h.y + h.r * 0.05, h.r * 0.2, h.r * 0.1, -0.3, 0, TAU); ctx.fill();
  }

  /** Fahrzeug in lokalen Koordinaten zeichnen (ctx bereits transformiert, y nach oben) */
  function drawVehicleLocal(ctx, def, wheels, opts) {
    opts = opts || {};
    const col = opts.colors || def.colors;
    const helmet = opts.helmet || '#f5f1e6';
    const look = def.look;
    // Federbeine
    ctx.lineCap = 'round';
    for (let i = 0; i < def.wheels.length; i++) {
      const wd = def.wheels[i], w = wheels[i];
      const st = Object.prototype.hasOwnProperty.call(STRUT_TOP, look) ? STRUT_TOP[look] : 0.36;
      if (st === null) continue;
      const top = [wd.x, wd.y + st];
      ctx.strokeStyle = '#3a3e45'; ctx.lineWidth = look === 'monster' ? 0.16 : 0.09;
      ctx.beginPath(); ctx.moveTo(top[0], top[1]); ctx.lineTo(w.x, w.y); ctx.stroke();
      // Feder
      ctx.strokeStyle = col.accent; ctx.lineWidth = look === 'monster' ? 0.06 : 0.04;
      ctx.beginPath();
      const n = 5, len = top[1] - w.y;
      for (let k = 0; k <= n * 2; k++) {
        const yy = w.y + (len * k) / (n * 2);
        const xx = top[0] + (k % 2 ? 0.08 : -0.08) * (look === 'monster' ? 1.8 : 1);
        if (k === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
      }
      ctx.stroke();
    }
    if (look === 'bike') {
      for (let i = 0; i < def.wheels.length; i++) drawWheel(ctx, def.wheels[i], wheels[i].x, wheels[i].y, wheels[i].rot, col, false);
      LOOKS.bike(ctx, col);
      LOOKS.bikeRider(ctx, col, helmet);
      drawHead(ctx, def.head, helmet);
      return;
    }
    // Fahrer hinter den Scheiben
    if (look !== 'suv') drawHead(ctx, def.head, helmet);
    LOOKS[look](ctx, col);
    if (look === 'suv') { drawHead(ctx, def.head, helmet); LOOKS.suvTop(ctx, col); }
    // Radkästen
    ctx.fillStyle = 'rgba(20,20,24,0.55)';
    for (const wd of def.wheels) {
      if (NO_ARCH[look]) continue;
      ctx.beginPath(); ctx.arc(wd.x, wd.y + 0.02, wd.r + 0.07, 0.15, Math.PI - 0.15); ctx.fill();
    }
    for (let i = 0; i < def.wheels.length; i++) drawWheel(ctx, def.wheels[i], wheels[i].x, wheels[i].y, wheels[i].rot, col, look === 'monster');
    if (LOOKS_AFTER[look]) LOOKS_AFTER[look](ctx, col, def, wheels);
  }

  /* ---------------- Renderer ---------------- */
  class Renderer {
    constructor(canvas) {
      this.cv = canvas;
      this.ctx = canvas.getContext('2d', { alpha: false });
      this.w = 1; this.h = 1; this.dpr = 1;
      this.time = 0;
      this.particles = [];
      this.flakes = [];
      this.skyKey = '';
      this.sky = null;
      this.quality = 'high';
      this.wheelBuf = [{}, {}];
    }
    resize(w, h, dpr) {
      this.w = w; this.h = h; this.dpr = dpr;
      this.cv.width = Math.max(1, Math.round(w * dpr));
      this.cv.height = Math.max(1, Math.round(h * dpr));
      this.skyKey = '';
    }

    /* ---------- Partikel ---------- */
    spawn(x, y, vx, vy, life, size, color, grav, kind) {
      const max = this.quality === 'low' ? 50 : 160;
      if (this.particles.length >= max) return;
      // kind 'dust': bremst schnell ab, wächst und verblasst weich; sonst Splitter/Funken (fallen, schrumpfen)
      this.particles.push({ x, y, vx, vy, life, max: life, size, color, grav: grav === undefined ? 4 : grav, dust: kind !== 'debris' && (grav === undefined || grav < 3) });
    }
    burst(x, y, n, color, speed, size) {
      if (this.quality === 'low') n = Math.ceil(n / 2);
      for (let i = 0; i < n; i++) {
        const a = Math.PI * (0.1 + 0.8 * Math.random());
        const s = speed * (0.4 + Math.random() * 0.8);
        // Staubwolke (weich, bleibt hängen) + ein paar Brocken (fallen zurück)
        if (i % 3 === 2) this.spawn(x, y, Math.cos(a) * s * (Math.random() < 0.5 ? -1 : 1), Math.sin(a) * s * 1.2, 0.35 + Math.random() * 0.3, size * 0.45, shade(color.startsWith('#') ? color : '#888888', -0.35), 9, 'debris');
        else this.spawn(x, y, Math.cos(a) * s * 0.7 * (Math.random() < 0.5 ? -1 : 1), Math.sin(a) * s * 0.5, 0.6 + Math.random() * 0.6, size * (0.7 + Math.random() * 0.8), color, 0.6);
      }
    }
    clearParticles() { this.particles.length = 0; }

    /** Staub von Antriebsrädern */
    vehicleFx(v, env, dt) {
      if (v.crashed || !v.controlEnabled) return;
      const look = env.look;
      for (const w of v.wheels) {
        if (!w.contact || w.def.drive <= 0) continue;
        const sp = Math.abs(v.vel.x);
        const slipK = U.clamp((v.slip - 1.5) / 6, 0, 1);
        const strong = slipK > 0 || (v.input.gas && sp < 6) || (v.input.brake && v.brakingHard && sp > 4);
        if (!strong) continue;
        const rate = (this.quality === 'low' ? 0.25 : 0.6) * (0.5 + 0.5 * Math.max(slipK, sp < 6 ? 0.6 : 0.4));
        if (Math.random() > rate) continue;
        const p = w.body.getPosition();
        // Staub löst sich hinter dem Reifen am Boden, wird nach hinten/oben geworfen und bleibt hängen
        const back = -Math.sign(v.vel.x || 1);
        this.spawn(p.x + back * w.def.r * 0.5, p.y - w.def.r * 0.85, back * (1.2 + Math.random() * 1.8 + slipK * 2) + v.vel.x * 0.25, 0.5 + Math.random() * 1.2, 0.7 + Math.random() * 0.5, 0.16 + Math.random() * 0.2, look.dust, 0.4);
      }
    }

    /* ---------- Hauptzeichnen ---------- */
    frame(session, cam, dt, opts) {
      opts = opts || {};
      this.time += dt;
      const ctx = this.ctx;
      const tr = session.track;
      const env = tr.env;
      ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
      this._sky(env, tr.envId);
      this._parallax(tr.envId, env.look, cam);
      if (env.look.haze) { ctx.fillStyle = env.look.haze; ctx.fillRect(0, 0, this.w, this.h); }
      this._decos(tr, cam);
      this._terrain(tr, cam);
      this._gates(session, cam);
      if (session.obst) this._obstacles(session, cam);
      this._coins(tr, cam);
      if (!session.isAttract && session.player) this._fuels(tr, cam, session.player);
      // Fahrzeuge: Gegner zuerst, Spieler zuletzt
      const racers = session.racers;
      for (const r of racers) if (!r.isPlayer || opts.playerAsGhost) this._vehicle(r, cam, r.isPlayer ? 1 : 0.92);
      for (const r of racers) if (r.isPlayer && !opts.playerAsGhost) this._vehicle(r, cam, 1);
      if (session.isRace) for (const r of racers) if (!r.isPlayer) this._tag(r, cam);
      if (session.obst && !session.isAttract) this._hazardHints(session, cam);
      this._particles(cam, dt);
      this._weather(env.look, dt, cam);
    }

    _sky(env, envId) {
      const ctx = this.ctx;
      const key = envId + this.w + 'x' + this.h;
      if (key !== this.skyKey) {
        const g = ctx.createLinearGradient(0, 0, 0, this.h);
        g.addColorStop(0, env.look.skyTop);
        g.addColorStop(0.75, env.look.skyBottom);
        g.addColorStop(1, env.look.skyBottom);
        this.sky = g;
        this.skyKey = key;
      }
      ctx.fillStyle = this.sky;
      ctx.fillRect(0, 0, this.w, this.h);
      if (env.look.sun) {
        const x = this.w * 0.78, y = this.h * 0.18, r = Math.min(this.w, this.h) * 0.06;
        ctx.fillStyle = 'rgba(255,255,255,0.18)';
        circle(ctx, x, y, r * 2.2); ctx.fill();
        ctx.fillStyle = env.look.sun;
        circle(ctx, x, y, r); ctx.fill();
      }
      if (env.look.lava) {
        const g2 = ctx.createRadialGradient(this.w * 0.5, this.h * 0.95, 10, this.w * 0.5, this.h * 0.95, this.w * 0.7);
        g2.addColorStop(0, 'rgba(255,110,40,0.35)');
        g2.addColorStop(1, 'rgba(255,110,40,0)');
        ctx.fillStyle = g2; ctx.fillRect(0, 0, this.w, this.h);
      }
    }

    _parallax(envId, look, cam) {
      const ctx = this.ctx;
      const W = this.w, H = this.h;
      const layers = LAYERS[envId] || LAYERS.meadow;
      for (const L of layers) {
        const [kind, f, base, amp, colKey] = L;
        const color = look[colKey];
        const scale = cam.baseScale * 0.9;
        const u0 = cam.x * f;
        const vshift = U.clamp(cam.y * scale * f * 0.08, -H * 0.08, H * 0.22);
        const by = H * base + vshift;
        const A = H * amp;
        const uAt = (px) => u0 + (px - W / 2) / scale;
        ctx.fillStyle = color;
        if (kind === 'hills' || kind === 'dunes' || kind === 'peaks' || kind === 'bushes') {
          ctx.beginPath();
          ctx.moveTo(-2, H + 2);
          // an festen Weltpositionen abtasten (sonst „schwimmen“ Kanten und Spitzen beim Mitfahren)
          const du = 8 / scale;
          const uStart = Math.floor(uAt(-10) / du) * du;
          for (let u = uStart; ; u += du) {
            const px = W / 2 + (u - u0) * scale;
            let y;
            if (kind === 'hills') y = 0.55 * Math.sin(u * 0.045 + 1) + 0.3 * Math.sin(u * 0.11 + 2.3) + 0.15 * Math.sin(u * 0.27);
            else if (kind === 'dunes') y = 0.7 * Math.sin(u * 0.05 + 0.5) + 0.3 * Math.sin(u * 0.12 + 1.1);
            else if (kind === 'bushes') y = 0.4 * Math.sin(u * 0.08) + 0.6 * Math.abs(Math.sin(u * 0.6 + Math.sin(u * 0.2)));
            else y = Math.max(tri(u * 0.042 + f), 0.78 * tri(u * 0.071 + 0.37), 0.55 * tri(u * 0.13 + 0.1)) * 2 - 1;
            ctx.lineTo(px, by - A * (0.5 + 0.5 * y));
            if (px > W + 10) break;
          }
          ctx.lineTo(W + 2, H + 2);
          ctx.closePath();
          ctx.fill();
          if (kind === 'peaks' && (envId === 'snow' || envId === 'mountain')) {
            ctx.save();
            ctx.clip();
            ctx.fillStyle = 'rgba(255,255,255,0.85)';
            ctx.fillRect(0, 0, W, by - A * 0.72);
            ctx.restore();
          }
          // Grund unter der Silhouette
          ctx.fillRect(-2, by, W + 4, H - by + 2);
        } else if (kind === 'trees') {
          ctx.fillRect(-2, by - A * 0.25, W + 4, H - by + A * 0.25 + 2);
          const sp = 2.2;
          const i0 = Math.floor(uAt(-40) / sp), i1 = Math.ceil(uAt(W + 40) / sp);
          const snowy = envId === 'snow';
          for (let i = i0; i <= i1; i++) {
            const hr = hash(i * 1.3 + f * 10);
            const px = W / 2 + (i * sp + hr * 1.2 - u0) * scale;
            const th = A * (0.55 + 0.45 * hash(i * 2.7 + 3));
            const tw = th * 0.42;
            ctx.beginPath();
            ctx.moveTo(px - tw / 2, by - A * 0.2);
            ctx.lineTo(px, by - A * 0.2 - th);
            ctx.lineTo(px + tw / 2, by - A * 0.2);
            ctx.closePath();
            ctx.fill();
            if (snowy) {
              ctx.fillStyle = 'rgba(255,255,255,0.7)';
              ctx.beginPath(); ctx.moveTo(px - tw * 0.18, by - A * 0.2 - th * 0.62); ctx.lineTo(px, by - A * 0.2 - th); ctx.lineTo(px + tw * 0.18, by - A * 0.2 - th * 0.62); ctx.closePath(); ctx.fill();
              ctx.fillStyle = color;
            }
          }
        } else if (kind === 'mesas') {
          ctx.fillRect(-2, by, W + 4, H - by + 2);
          const sp = 60;
          const i0 = Math.floor(uAt(-200) / sp), i1 = Math.ceil(uAt(W + 200) / sp);
          for (let i = i0; i <= i1; i++) {
            const px = W / 2 + (i * sp + hash(i) * 25 - u0) * scale;
            const wd = (14 + hash(i + 7) * 22) * scale;
            const ht = A * (0.4 + 0.6 * hash(i + 3));
            ctx.beginPath();
            ctx.moveTo(px - wd / 2 - ht * 0.3, by);
            ctx.lineTo(px - wd / 2, by - ht);
            ctx.lineTo(px + wd / 2, by - ht);
            ctx.lineTo(px + wd / 2 + ht * 0.3, by);
            ctx.closePath(); ctx.fill();
          }
        } else if (kind === 'factory') {
          ctx.fillRect(-2, by, W + 4, H - by + 2);
          const sp = 7;
          const i0 = Math.floor(uAt(-60) / sp), i1 = Math.ceil(uAt(W + 60) / sp);
          for (let i = i0; i <= i1; i++) {
            const hr = hash(i * 3.1 + f * 7);
            const px = W / 2 + (i * sp - u0) * scale;
            const bw = (4 + hr * 3) * scale;
            const bh = A * (0.35 + 0.55 * hash(i * 5.3 + 1));
            ctx.fillRect(px, by - bh, bw, bh + 1);
            if (hr > 0.55) {
              const cw = Math.max(3, bw * 0.12);
              const ch = bh * 0.7;
              ctx.fillRect(px + bw * 0.6, by - bh - ch, cw, ch);
              // Rauchfahne: 7 Schwaden je Schlot, gleichmäßig über den Lebenslauf verteilt; Aufstieg bremst ab,
              // Wind treibt seitlich, Schwaden wachsen und verblassen weich (keine sichtbaren Sprünge)
              const cx = px + bw * 0.6 + cw / 2, cy = by - bh - ch;
              const seed = hash(i * 1.7 + 3);
              const rate = 0.16 + 0.08 * seed;
              const N = 7;
              for (let k = 0; k < N; k++) {
                const age = ((((this.time * rate + k / N + seed) % 1) + 1) % 1);
                const rise = (1 - Math.pow(1 - age, 2)) * (34 + 18 * seed) * scale * 0.9;
                const drift = age * age * (26 + 10 * seed) * scale * 0.9 + Math.sin(this.time * 0.7 + k * 1.9 + i) * 2.5 * age;
                const rad = (2.2 + age * 13) * scale * 0.9 + 2;
                const alpha = 0.32 * Math.min(1, age * 7) * Math.pow(1 - age, 1.6);
                ctx.fillStyle = 'rgba(214,214,208,' + alpha.toFixed(3) + ')';
                circle(ctx, cx + drift, cy - rise, rad); ctx.fill();
                ctx.fillStyle = 'rgba(240,240,235,' + (alpha * 0.55).toFixed(3) + ')';
                circle(ctx, cx + drift - rad * 0.25, cy - rise - rad * 0.2, rad * 0.62); ctx.fill();
              }
              ctx.fillStyle = color;
            } else if (hr < 0.2) {
              // Sheddach
              ctx.beginPath();
              for (let k = 0; k < 3; k++) {
                const x0 = px + (bw * k) / 3;
                ctx.moveTo(x0, by - bh); ctx.lineTo(x0 + bw / 3, by - bh - bw * 0.12); ctx.lineTo(x0 + bw / 3, by - bh);
              }
              ctx.fill();
            }
          }
        } else if (kind === 'volcano') {
          ctx.fillRect(-2, by, W + 4, H - by + 2);
          const sp = 260;
          const i0 = Math.floor(uAt(-400) / sp), i1 = Math.ceil(uAt(W + 400) / sp);
          for (let i = i0; i <= i1; i++) {
            const px = W / 2 + (i * sp + 60 - u0) * scale;
            const wd = 120 * scale;
            ctx.beginPath();
            ctx.moveTo(px - wd / 2, by);
            ctx.lineTo(px - wd * 0.08, by - A);
            ctx.lineTo(px + wd * 0.08, by - A);
            ctx.lineTo(px + wd / 2, by);
            ctx.closePath(); ctx.fill();
            const g = ctx.createRadialGradient(px, by - A, 2, px, by - A, wd * 0.2);
            g.addColorStop(0, 'rgba(255,140,50,0.75)');
            g.addColorStop(1, 'rgba(255,90,30,0)');
            ctx.fillStyle = g;
            circle(ctx, px, by - A, wd * 0.2); ctx.fill();
            ctx.fillStyle = color;
          }
        }
      }
    }

    _terrain(tr, cam) {
      const ctx = this.ctx;
      const look = tr.env.look;
      const s = cam.scale;
      const dx = tr.dx;
      const h = tr.h;
      const i0 = Math.max(0, Math.floor((cam.left - 2) / dx));
      const i1 = Math.min(h.length - 1, Math.ceil((cam.right + 2) / dx));
      if (i1 <= i0) return;
      const H = this.h;
      const surf = () => {
        ctx.beginPath();
        ctx.moveTo(cam.sx(i0 * dx), cam.sy(h[i0]));
        for (let i = i0 + 1; i <= i1; i++) ctx.lineTo(cam.sx(i * dx), cam.sy(h[i]));
      };
      // Erdreich
      surf();
      ctx.lineTo(cam.sx(i1 * dx), H + 10);
      ctx.lineTo(cam.sx(i0 * dx), H + 10);
      ctx.closePath();
      ctx.fillStyle = look.soil;
      ctx.fill();
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      // Gesteinsschichten
      ctx.save();
      ctx.globalAlpha = 0.45;
      ctx.strokeStyle = look.soilDark;
      ctx.lineWidth = 0.9 * s;
      ctx.translate(0, 1.6 * s);
      surf(); ctx.stroke();
      ctx.globalAlpha = 0.3;
      ctx.lineWidth = 1.6 * s;
      ctx.translate(0, 2.4 * s);
      surf(); ctx.stroke();
      ctx.restore();
      if (look.lava) {
        ctx.save();
        ctx.strokeStyle = 'rgba(255,96,32,0.55)';
        ctx.lineWidth = 0.12 * s;
        ctx.setLineDash([2.5 * s, 4 * s]);
        // an der Welt verankert (Startpunkt des Pfads) + langsames Fließen
        ctx.lineDashOffset = (i0 * dx + this.time * 0.25) * s;
        ctx.translate(0, 2.6 * s);
        surf(); ctx.stroke();
        ctx.restore();
      }
      // Grasnarbe / Oberfläche
      ctx.save();
      ctx.strokeStyle = look.grassDark;
      ctx.lineWidth = 0.55 * s;
      ctx.translate(0, 0.2 * s);
      surf(); ctx.stroke();
      ctx.restore();
      ctx.save();
      ctx.strokeStyle = look.grass;
      ctx.lineWidth = 0.3 * s;
      ctx.translate(0, 0.11 * s);
      surf(); ctx.stroke();
      ctx.restore();
      if (look.stripes) {
        // Fahrbahnmarkierung: feste Striche in Weltkoordinaten (1,4 m Raster), folgen der Oberfläche
        // entlang ihrer Normalen – kein Rutschen/Flackern beim Mitfahren der Kamera
        const P = 1.4, Ld = 0.7, off = 0.36;
        ctx.save();
        ctx.strokeStyle = 'rgba(233,181,44,0.9)';
        ctx.lineWidth = Math.max(1, 0.08 * s);
        ctx.lineCap = 'butt';
        ctx.beginPath();
        for (let x0 = Math.floor((cam.left - 1) / P) * P; x0 < cam.right + 1; x0 += P) {
          for (let k = 0; k <= 4; k++) {
            const x = x0 + (Ld * k) / 4;
            const a = Math.atan(tr.slopeAt(x));
            const px = x + Math.sin(a) * off, py = tr.heightAt(x) - Math.cos(a) * off;
            if (k === 0) ctx.moveTo(cam.sx(px), cam.sy(py)); else ctx.lineTo(cam.sx(px), cam.sy(py));
          }
        }
        ctx.stroke();
        ctx.restore();
      }
    }

    _decos(tr, cam) {
      const ctx = this.ctx;
      const s = cam.scale;
      const L = cam.left - 6, R = cam.right + 6;
      const d = tr.decos;
      for (let i = lowerBound(d, L); i < d.length; i++) {
        const o = d[i];
        if (o.x > R) break;
        // fest im Boden: Breite Objekte auf den tiefsten Punkt ihrer Grundfläche setzen (kein Schweben am Hang)
        const hw = (DECO_W[o.kind] || 0.4) * o.s;
        const gy = Math.min(tr.heightAt(o.x - hw), tr.heightAt(o.x), tr.heightAt(o.x + hw));
        if (DECO_W[o.kind] && Math.abs(tr.heightAt(o.x + hw) - tr.heightAt(o.x - hw)) > hw * 0.9) continue;
        ctx.fillStyle = 'rgba(0,0,0,0.13)';
        ctx.beginPath(); ctx.ellipse(cam.sx(o.x), cam.sy(tr.heightAt(o.x)) + 0.06 * s, Math.max(0.3, hw) * s, 0.09 * s, 0, 0, TAU); ctx.fill();
        ctx.save();
        ctx.translate(cam.sx(o.x), cam.sy(gy) + 0.12 * s);
        const k = s * o.s;
        ctx.scale(o.flip ? -k : k, -k);
        DECO[o.kind] && DECO[o.kind](ctx, this.time, o, tr.env.look);
        ctx.restore();
      }
      // Distanzmarken (Adventure)
      for (let i = lowerBound(tr.markers, L); i < tr.markers.length; i++) {
        const m = tr.markers[i];
        if (m.x > R) break;
        const x = cam.sx(m.x), y = cam.sy(tr.heightAt(m.x));
        ctx.fillStyle = '#3b3027';
        ctx.fillRect(x - 0.05 * s, y - 1.6 * s, 0.1 * s, 1.6 * s);
        ctx.fillStyle = '#ffc629';
        rrect(ctx, x - 0.75 * s, y - 2.05 * s, 1.5 * s, 0.55 * s, 0.08 * s); ctx.fill();
        ctx.fillStyle = '#16232b';
        ctx.font = '700 ' + Math.round(0.36 * s) + 'px "Barlow Condensed", "Arial Narrow", sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(m.label, x, y - 1.77 * s);
      }
    }

    _gates(session, cam) {
      const tr = session.track;
      const ctx = this.ctx;
      const s = cam.scale;
      const font = (px) => '800 italic ' + Math.round(px) + 'px "Barlow Condensed", "Arial Narrow", sans-serif';
      const post = (x, hgt) => {
        const gx = cam.sx(x), gy = cam.sy(tr.heightAt(x));
        ctx.fillStyle = '#2b2f36';
        ctx.fillRect(gx - 0.07 * s, gy - hgt * s, 0.14 * s, hgt * s);
        return [gx, gy];
      };
      if (tr.startX >= cam.left - 4 && tr.startX <= cam.right + 4 && !session.isAttract) {
        const [gx, gy] = post(tr.startX, 3.2);
        ctx.fillStyle = '#f3f0e6';
        rrect(ctx, gx - 1.1 * s, gy - 3.6 * s, 2.2 * s, 0.7 * s, 0.1 * s); ctx.fill();
        ctx.fillStyle = '#16232b'; ctx.font = font(0.5 * s); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('START', gx, gy - 3.25 * s);
      }
      if (session.isRace) {
        tr.checkpoints.forEach((cx, i) => {
          if (cx < cam.left - 4 || cx > cam.right + 4) return;
          const [gx, gy] = post(cx, 3.0);
          ctx.fillStyle = '#ffc629';
          ctx.beginPath(); ctx.moveTo(gx + 0.07 * s, gy - 3.0 * s); ctx.lineTo(gx + 1.5 * s, gy - 2.62 * s); ctx.lineTo(gx + 0.07 * s, gy - 2.24 * s); ctx.closePath(); ctx.fill();
          ctx.fillStyle = '#16232b'; ctx.font = font(0.42 * s); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText((i + 1) + '/' + (tr.checkpoints.length + 1), gx + 0.62 * s, gy - 2.62 * s);
        });
        const fx = tr.finishX;
        if (fx >= cam.left - 8 && fx <= cam.right + 8) {
          const [ax, ay] = post(fx - 2.6, 4.2);
          const [bx, by] = post(fx + 2.6, 4.2);
          const top = Math.min(ay, by) - 4.2 * s;
          const bw = bx - ax, bh = 0.9 * s;
          const cell = bh / 2;
          for (let c = 0; c * cell < bw; c++) {
            for (let r = 0; r < 2; r++) {
              ctx.fillStyle = (c + r) % 2 ? '#16232b' : '#f3f0e6';
              ctx.fillRect(ax + c * cell, top + r * cell, Math.min(cell, bw - c * cell), cell);
            }
          }
          ctx.fillStyle = '#ffc629';
          rrect(ctx, (ax + bx) / 2 - 1.1 * s, top - 0.8 * s, 2.2 * s, 0.75 * s, 0.1 * s); ctx.fill();
          ctx.fillStyle = '#16232b'; ctx.font = font(0.56 * s); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText('ZIEL', (ax + bx) / 2, top - 0.42 * s);
          // Ziellinie am Boden
          const gx = cam.sx(fx), gy = cam.sy(tr.heightAt(fx));
          for (let k = 0; k < 4; k++) { ctx.fillStyle = k % 2 ? '#16232b' : '#f3f0e6'; ctx.fillRect(gx - 0.15 * s, gy + k * 0.15 * s - 0.05 * s, 0.3 * s, 0.15 * s); }
        }
      }
    }

    _coins(tr, cam) {
      const ctx = this.ctx;
      const s = cam.scale;
      const L = cam.left - 1, R = cam.right + 1;
      const r = C.terrain.coinRadius * s;
      for (let i = lowerBound(tr.coins, L); i < tr.coins.length; i++) {
        const c = tr.coins[i];
        if (c.x > R) break;
        if (c.taken) continue;
        const x = cam.sx(c.x), y = cam.sy(c.y);
        const big = c.v >= 25;
        const rr = big ? r * 1.25 : r;
        const sq = Math.abs(Math.cos(this.time * 3 + c.x * 0.7));
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(Math.max(0.15, sq), 1);
        ctx.fillStyle = big ? '#c97d14' : '#d99a12';
        circle(ctx, 0, 0, rr); ctx.fill();
        ctx.fillStyle = big ? '#ffb347' : '#ffd23f';
        circle(ctx, 0, 0, rr * 0.8); ctx.fill();
        ctx.fillStyle = big ? '#c97d14' : '#e3a614';
        ctx.fillRect(-rr * 0.12, -rr * 0.45, rr * 0.24, rr * 0.9);
        ctx.restore();
      }
    }

    /** Hindernisse (Baum, Rolltor, Rollkörper, Steinschlag/Lavabrocken) */
    _obstacles(session, cam) {
      const ctx = this.ctx, s = cam.scale, tr = session.track, look = tr.env.look;
      for (const o of session.obst.list) {
        if (o.x < cam.left - 12 || o.x > cam.right + 14 || o.gone) continue;
        if (o.kind === 'tree') {
          const gy = tr.heightAt(o.x);
          const f = o.fall || 0;                         // 0 = steht, 1 = liegt quer (zum Betrachter gekippt)
          const phi = f * Math.PI / 2;
          const shake = o.state === 'shake' ? Math.sin(o.t * 34) * 0.04 * Math.min(1, o.t / o.shake + 0.3) : 0;
          const near = 1 + 0.35 * Math.sin(phi);         // kommt näher → wirkt größer
          const hp = o.h * Math.cos(phi);                // sichtbare Höhe
          ctx.save();
          ctx.translate(cam.sx(o.x), cam.sy(gy));
          ctx.scale(s, -s);
          if (f < 1) {
            ctx.rotate(shake);
            const w0 = o.r * near, w1 = o.r * 0.7 * near;
            ctx.fillStyle = '#6e4a2b';
            ctx.beginPath(); ctx.moveTo(-w0, 0); ctx.lineTo(-w1, hp); ctx.lineTo(w1, hp); ctx.lineTo(w0, 0); ctx.closePath(); ctx.fill();
            ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fillRect(w0 * 0.15, 0, w0 * 0.8, hp);
            const cr = o.crown * near, cy = hp + cr * 0.25 * Math.cos(phi);
            ctx.fillStyle = '#2f6b33'; circle(ctx, 0, cy, cr); ctx.fill();
            ctx.fillStyle = '#3c7f3d'; circle(ctx, -cr * 0.55, cy - cr * 0.35, cr * 0.75); ctx.fill(); circle(ctx, cr * 0.6, cy - cr * 0.25, cr * 0.7); ctx.fill();
            ctx.fillStyle = '#4b9446'; circle(ctx, -cr * 0.2, cy + cr * 0.4, cr * 0.55); ctx.fill();
          } else {
            // liegt quer über der Straße: Krone als flacher Laubhügel dahinter, abgeknickte Äste,
            // vorn der Stamm (Bruchfläche mit Jahresringen) – genau dieser Stamm ist das Hindernis
            const r = o.logR;
            ctx.fillStyle = '#2f6b33';
            ctx.beginPath(); ctx.ellipse(0.4, 0.55, 2.4, 0.85, 0, 0, TAU); ctx.fill();
            ctx.fillStyle = '#3c7f3d'; circle(ctx, -1.2, 0.55, 0.7); ctx.fill(); circle(ctx, 1.7, 0.5, 0.75); ctx.fill(); circle(ctx, 0.5, 1.0, 0.65); ctx.fill();
            ctx.fillStyle = '#4b9446'; circle(ctx, -0.3, 1.05, 0.45); ctx.fill(); circle(ctx, 1.2, 0.95, 0.4); ctx.fill();
            ctx.strokeStyle = '#5a3c22'; ctx.lineWidth = 0.09;
            ctx.beginPath(); ctx.moveTo(-0.1, r); ctx.lineTo(-0.9, 0.95); ctx.moveTo(0.15, r); ctx.lineTo(1.0, 1.1); ctx.moveTo(0, r); ctx.lineTo(0.2, 1.35); ctx.stroke();
            ctx.fillStyle = '#5a3c22'; circle(ctx, 0, r * 0.8, r * 1.2); ctx.fill();
            ctx.fillStyle = '#d8b07a'; circle(ctx, 0, r * 0.8, r * 0.98); ctx.fill();
            ctx.strokeStyle = '#a77a45'; ctx.lineWidth = 0.025;
            for (let k = 1; k < 4; k++) { ctx.beginPath(); ctx.arc(0, r * 0.8, (r * 0.98 * k) / 4, 0, TAU); ctx.stroke(); }
            ctx.fillStyle = '#7c5432'; ctx.fillRect(-0.36, -0.15, 0.72, 0.18);   // Stumpf daneben
          }
          ctx.restore();
        } else if (o.kind === 'gate') {
          const gy = tr.heightAt(o.x);
          const x = cam.sx(o.x), top = cam.sy(gy + o.openY + o.h + 0.5);
          // Stahlportal (Säule hinter der Fahrbahn) und Rollkasten
          ctx.fillStyle = '#3d434b'; ctx.fillRect(x - 0.32 * s, top, 0.64 * s, cam.sy(gy) - top);
          ctx.fillStyle = '#555c66'; rrect(ctx, x - 0.55 * s, top - 0.15 * s, 1.1 * s, 0.75 * s, 0.08 * s); ctx.fill();
          // Torblatt mit Warnstreifen
          const yb = cam.sy(gy + (o.made ? o.y : o.openY)), yt = cam.sy(gy + (o.made ? o.y : o.openY) + o.h);
          ctx.save();
          ctx.beginPath(); ctx.rect(x - 0.2 * s, yt, 0.4 * s, yb - yt); ctx.clip();
          ctx.fillStyle = '#d9a514'; ctx.fillRect(x - 0.2 * s, yt, 0.4 * s, yb - yt);
          ctx.fillStyle = '#23262b';
          for (let k = -2; k < 14; k++) { const y0 = yt + k * 0.35 * s; ctx.beginPath(); ctx.moveTo(x - 0.2 * s, y0); ctx.lineTo(x + 0.2 * s, y0 - 0.25 * s); ctx.lineTo(x + 0.2 * s, y0 - 0.08 * s); ctx.lineTo(x - 0.2 * s, y0 + 0.17 * s); ctx.fill(); }
          ctx.restore();
          ctx.strokeStyle = '#23262b'; ctx.lineWidth = 0.05 * s; ctx.strokeRect(x - 0.2 * s, yt, 0.4 * s, yb - yt);
          // Warnleuchte: grün offen, blinkend gelb vor/beim Schließen, rot zu
          const st = o.state || 'open';
          const blink = Math.sin(this.time * 14) > 0;
          const col = st === 'open' ? '#3fcf6f' : st === 'closed' ? '#ff4b3e' : (blink ? '#ffc629' : '#6b5a1e');
          ctx.fillStyle = col; circle(ctx, x, top - 0.3 * s, 0.17 * s); ctx.fill();
          if (st !== 'open') { ctx.fillStyle = col.replace(')', ',0.25)').replace('rgb', 'rgba'); ctx.globalAlpha = 0.35; circle(ctx, x, top - 0.3 * s, 0.45 * s); ctx.fill(); ctx.globalAlpha = 1; }
        } else if (o.kind === 'roller') {
          const b = o.body;
          const p = b ? b.getPosition() : { x: o.x, y: tr.heightAt(o.x) + o.r };
          const a = b ? b.getAngle() : 0;
          ctx.save();
          ctx.translate(cam.sx(p.x), cam.sy(p.y));
          ctx.scale(s, -s);
          ctx.rotate(a);
          drawRoller(ctx, o.look, o.r);
          ctx.restore();
        } else if (o.kind === 'fall') {
          if (o.state === 'warn' && Math.random() < 0.5) {
            // Vorwarnung: Staub und Steinchen rieseln von oben bzw. Rauch steigt aus dem Schlot
            const px = o.x + (o.lava ? 6 : Math.random() * 5 - 1);
            const py = tr.heightAt(px) + (o.lava ? 0.5 : o.height);
            this.spawn(px, py, (Math.random() - 0.5) * 1.5, o.lava ? 2 + Math.random() * 2 : -1.5, 0.9, o.lava ? 0.4 : 0.22, o.lava ? 'rgba(90,70,60,0.8)' : look.dust, o.lava ? -1.5 : 3);
          }
          for (const rk of o.rocks || []) {
            const p = rk.body.getPosition();
            if (p.x < cam.left - 2 || p.x > cam.right + 2) continue;
            ctx.save();
            ctx.translate(cam.sx(p.x), cam.sy(p.y));
            ctx.scale(s, -s);
            ctx.rotate(rk.body.getAngle());
            drawRoller(ctx, o.lava ? 'lava' : 'rock', rk.r, this.time);
            ctx.restore();
          }
        }
      }
    }

    /** Warnsymbol am rechten Bildrand für aktive Gefahren, die noch außer Sicht sind (fair: immer vorgewarnt) */
    _hazardHints(session, cam) {
      const ctx = this.ctx, tr = session.track;
      for (const o of session.obst.list) {
        if (!o.made || o.gone || o.x <= cam.right - 0.5 || o.x > cam.right + 70) continue;
        const active = (o.kind === 'tree' && (o.state === 'shake' || o.state === 'fall')) || (o.kind === 'fall' && (o.state === 'warn' || o.state === 'drop'))
          || (o.kind === 'gate' && o.state !== 'open') || (o.kind === 'roller' && o.state === 'roll');
        if (!active) continue;
        const y = U.clamp(cam.sy(tr.heightAt(Math.min(o.x, cam.right))) - 40, 70, this.h - 110);
        const x = this.w - 34;
        const k = 0.75 + 0.25 * Math.abs(Math.sin(this.time * 6));
        ctx.save();
        ctx.translate(x, y); ctx.scale(k, k);
        ctx.fillStyle = 'rgba(16,26,32,0.75)';
        ctx.beginPath(); ctx.moveTo(0, -22); ctx.lineTo(21, 15); ctx.lineTo(-21, 15); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#ffc629';
        ctx.beginPath(); ctx.moveTo(0, -17); ctx.lineTo(16, 11); ctx.lineTo(-16, 11); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#16232b'; ctx.fillRect(-2, -8, 4, 11); ctx.fillRect(-2, 5, 4, 3.5);
        ctx.restore();
      }
    }

    /** Kanister: roter Benzinkanister mit Griff, leicht schwebend; mit Schatten am Boden */
    _fuels(tr, cam, player) {
      const ctx = this.ctx;
      const s = cam.scale;
      const fs = tr.fuels;
      for (let i = lowerBound(fs, cam.left - 2); i < fs.length; i++) {
        const f = fs[i];
        if (f.x > cam.right + 2) break;
        if (player.fuelTaken.has(i)) continue;
        const bob = Math.sin(this.time * 2.4 + f.x) * 0.06;
        const gx = cam.sx(f.x), gy = cam.sy(tr.heightAt(f.x));
        ctx.fillStyle = 'rgba(0,0,0,0.18)';
        ctx.beginPath(); ctx.ellipse(gx, gy - 0.04 * s, 0.34 * s, 0.07 * s, 0, 0, TAU); ctx.fill();
        ctx.save();
        ctx.translate(cam.sx(f.x), cam.sy(f.y + bob));
        ctx.scale(s, -s);
        ctx.rotate(-0.08);
        ctx.fillStyle = '#b8231c';
        rrect(ctx, -0.27, -0.36, 0.54, 0.66, 0.07); ctx.fill();
        ctx.fillStyle = '#e2332f';
        rrect(ctx, -0.24, -0.33, 0.48, 0.58, 0.06); ctx.fill();
        ctx.strokeStyle = '#8a1712'; ctx.lineWidth = 0.035;
        ctx.beginPath(); ctx.moveTo(-0.17, -0.22); ctx.lineTo(0.17, 0.16); ctx.moveTo(0.17, -0.22); ctx.lineTo(-0.17, 0.16); ctx.stroke();
        ctx.fillStyle = '#2b2f36';
        rrect(ctx, -0.2, 0.3, 0.24, 0.1, 0.03); ctx.fill();                // Griff
        rrect(ctx, 0.1, 0.28, 0.1, 0.14, 0.02); ctx.fill();                // Ausgießer
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.fillRect(-0.2, -0.28, 0.05, 0.42);
        ctx.restore();
      }
    }

    _vehicle(r, cam, alpha) {
      const v = r.vehicle;
      const ctx = this.ctx;
      const ch = v.chassis;
      const p = ch.getPosition();
      if (p.x < cam.left - 6 || p.x > cam.right + 6) return;
      const a = ch.getAngle();
      const s = cam.scale;
      const wl = this.wheelBuf;
      for (let i = 0; i < v.wheels.length; i++) {
        const w = v.wheels[i];
        const lp = ch.getLocalPoint(w.body.getPosition());
        wl[i] = wl[i] || {};
        wl[i].x = lp.x; wl[i].y = lp.y; wl[i].rot = w.body.getAngle() - a;
      }
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(cam.sx(p.x), cam.sy(p.y));
      ctx.rotate(-a);
      ctx.scale(s, -s);
      let colors = v.def.colors;
      if (!r.isPlayer && r.color) {
        colors = r._colors || (r._colors = Object.assign({}, v.def.colors, { main: r.color, dark: shade(r.color, -0.4) }));
      }
      drawVehicleLocal(ctx, v.def, wl, { colors, helmet: r.isPlayer ? '#ffc629' : '#f5f1e6' });
      ctx.restore();
    }

    _tag(r, cam) {
      const v = r.vehicle;
      const p = v.chassis.getPosition();
      if (p.x < cam.left - 3 || p.x > cam.right + 3) return;
      const ctx = this.ctx;
      const s = cam.scale;
      const x = cam.sx(p.x), y = cam.sy(p.y) - 2.1 * s;
      ctx.font = '600 ' + Math.max(11, Math.round(0.36 * s)) + 'px Barlow, "Segoe UI", sans-serif';
      const name = r.name.split(' ')[0];
      const tw = ctx.measureText(name).width;
      const ph = Math.max(16, 0.55 * s);
      ctx.fillStyle = 'rgba(16,24,29,0.72)';
      rrect(ctx, x - tw / 2 - ph * 0.7, y - ph / 2, tw + ph * 1.1, ph, ph / 2); ctx.fill();
      ctx.fillStyle = r.color;
      circle(ctx, x - tw / 2 - ph * 0.2, y, ph * 0.2); ctx.fill();
      ctx.fillStyle = '#f3f0e6'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText(name, x - tw / 2 + ph * 0.1, y + 1);
    }

    _particles(cam, dt) {
      const ctx = this.ctx;
      const s = cam.scale;
      const ps = this.particles;
      let j = 0;
      for (let i = 0; i < ps.length; i++) {
        const p = ps[i];
        p.life -= dt;
        if (p.life <= 0) continue;
        p.vy -= p.grav * dt;
        const drag = Math.exp(-(p.dust ? 2.6 : 0.6) * dt);   // Luftwiderstand: Staub bremst stark ab
        p.vx *= drag; p.vy *= p.dust ? drag : 1;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        ps[j++] = p;
        const t = p.life / p.max;                            // 1 → 0
        const age = 1 - t;
        // Staub: wächst und blendet weich aus; Brocken: bleiben klein und verschwinden am Ende
        ctx.globalAlpha = p.dust ? Math.min(1, age * 6) * Math.pow(t, 1.3) * 0.6 : Math.min(1, t * 3) * 0.9;
        ctx.fillStyle = p.color;
        circle(ctx, cam.sx(p.x), cam.sy(p.y), Math.max(0.5, p.size * s * (p.dust ? 0.7 + age * 1.6 : 1 - age * 0.4))); ctx.fill();
      }
      ps.length = j;
      ctx.globalAlpha = 1;
    }

    _weather(look, dt, cam) {
      if (!look.snowfall && !look.embers) return;
      // Flocken/Glut bewegen sich mit der Welt (leichte Tiefe), statt am Bildschirm zu kleben
      if (cam) {
        const dxs = this.lastCamX !== undefined ? (cam.x - this.lastCamX) * cam.scale : 0;
        const dys = this.lastCamY !== undefined ? (cam.y - this.lastCamY) * cam.scale : 0;
        this.lastCamX = cam.x; this.lastCamY = cam.y;
        if (Math.abs(dxs) < this.w * 0.5 && Math.abs(dys) < this.h * 0.5) for (const f of this.flakes) { const d = 0.35 + f.s * 0.2; f.x -= dxs * d; f.y += dys * d; }
      }
      const ctx = this.ctx;
      const n = this.quality === 'low' ? 30 : 70;
      const W = this.w, H = this.h;
      while (this.flakes.length < n) this.flakes.push({ x: Math.random() * W, y: Math.random() * H, s: 1 + Math.random() * 2.5, v: 0.4 + Math.random() });
      if (this.flakes.length > n) this.flakes.length = n;
      ctx.fillStyle = look.snowfall ? 'rgba(255,255,255,0.85)' : 'rgba(255,150,70,0.85)';

        else { f.y -= (20 + 30 * f.v) * dt; f.x += Math.sin(this.time * 1.3 + f.s) * 10 * dt; }
        if (f.y > H + 5) { f.y = -5; f.x = Math.random() * W; }
        if (f.y < -5) { f.y = H + 5; f.x = Math.random() * W; }
        if (f.x < -5) f.x = W + 5;
        if (f.x > W + 5) f.x = -5;
        ctx.globalAlpha = look.embers ? 0.4 + 0.6 * Math.abs(Math.sin(this.time * 4 + f.s)) : 1;
        circle(ctx, f.x, f.y, look.embers ? f.s * 0.7 : f.s); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

  /* halbe Breite breiter Deko-Objekte (m) – für die Bodenauflage am Hang */
  const DECO_W = { container: 1.3, crates: 0.7, fence: 0.9, bones: 0.5, snowrock: 0.6, rock: 0.5, lavarock: 0.6, pipe: 1.0, stump: 0.35, cairn: 0.4, bush: 0.6 };

  /* ---------------- Deko (lokal, Meter, y nach oben) ---------------- */

    tree(ctx) {
      ctx.fillStyle = '#6b4a2b'; ctx.fillRect(-0.15, 0, 0.3, 2.2);
      ctx.fillStyle = '#3f8f3a'; circle(ctx, 0, 2.8, 1.25); ctx.fill();
      ctx.fillStyle = '#4fa548'; circle(ctx, -0.55, 2.4, 0.85); ctx.fill(); circle(ctx, 0.6, 2.5, 0.8); ctx.fill();
      ctx.fillStyle = '#62b85a'; circle(ctx, -0.2, 3.3, 0.7); ctx.fill();
    },
    oak(ctx) {

      ctx.fillStyle = '#3c7f3d'; circle(ctx, -0.9, 3.0, 1.1); ctx.fill(); circle(ctx, 0.9, 3.1, 1.1); ctx.fill();
    },
    bush(ctx) {
      ctx.fillStyle = '#3d8a35'; circle(ctx, -0.4, 0.35, 0.5); ctx.fill(); circle(ctx, 0.35, 0.4, 0.55); ctx.fill();
      ctx.fillStyle = '#4fa548'; circle(ctx, 0, 0.6, 0.55); ctx.fill();
    },
    flowers(ctx, t, o) {
      const cols = ['#f25f5c', '#ffe066', '#ffffff', '#c77dff'];
      for (let i = 0; i < 5; i++) {

    rock(ctx) {

    },
    stump(ctx) {

      ctx.fillStyle = '#c49a6c'; ctx.beginPath(); ctx.ellipse(0, 0.55, 0.35, 0.1, 0, 0, TAU); ctx.fill();
    },
    mushroom(ctx) {

    },
    cactus(ctx) {

    deadbush(ctx) {

      for (let i = 0; i < 6; i++) { const a = 0.4 + i * 0.4; ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * 0.8, Math.sin(a) * 0.7); }

    },
    bones(ctx) {

    },
    snowrock(ctx) {

      ctx.fillStyle = '#f4f8fb'; poly(ctx, [[-0.62, 0.55], [0.2, 0.8], [0.5, 0.55], [-0.2, 0.5]]); ctx.fill();
    },
    snowman(ctx) {
      ctx.fillStyle = '#f7fafc'; circle(ctx, 0, 0.45, 0.45); ctx.fill(); circle(ctx, 0, 1.1, 0.32); ctx.fill();
      ctx.fillStyle = '#2b2e33'; circle(ctx, -0.1, 1.18, 0.04); ctx.fill(); circle(ctx, 0.1, 1.18, 0.04); ctx.fill();
      ctx.fillStyle = '#f08a24'; poly(ctx, [[0, 1.1], [0.32, 1.06], [0, 1.02]]); ctx.fill();
    },
    pole(ctx) {
      ctx.fillStyle = '#d83b2f';
      for (let i = 0; i < 4; i++) { ctx.fillStyle = i % 2 ? '#f4f8fb' : '#d83b2f'; ctx.fillRect(-0.06, i * 0.35, 0.12, 0.35); }

    container(ctx) {
      ctx.fillStyle = '#c0462f'; ctx.fillRect(-1.6, 0, 3.2, 1.4);

    },
    crates(ctx) {
      ctx.fillStyle = '#b48a55'; ctx.fillRect(-0.9, 0, 0.8, 0.8); ctx.fillRect(0, 0, 0.8, 0.8); ctx.fillRect(-0.5, 0.8, 0.8, 0.8);
      ctx.strokeStyle = '#7a5a32'; ctx.lineWidth = 0.05;

    },
    cone(ctx) {
      ctx.fillStyle = '#f07b1d'; poly(ctx, [[-0.25, 0], [0, 0.7], [0.25, 0]]); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.fillRect(-0.12, 0.25, 0.24, 0.1);
    },
    pipe(ctx) {
      ctx.fillStyle = '#5d6670'; ctx.fillRect(-0.9, 0, 0.12, 0.8); ctx.fillRect(0.8, 0, 0.12, 0.8);
      ctx.fillStyle = '#8994a0'; rrect(ctx, -1.4, 0.75, 2.8, 0.4, 0.2); ctx.fill();
    },
    cairn(ctx) {
      ctx.fillStyle = '#8b8f94';
      ctx.beginPath(); ctx.ellipse(0, 0.2, 0.5, 0.22, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#9ea3a8'; ctx.beginPath(); ctx.ellipse(0.05, 0.55, 0.38, 0.17, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#7c8086'; ctx.beginPath(); ctx.ellipse(-0.02, 0.84, 0.26, 0.13, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#a7acb1'; ctx.beginPath(); ctx.ellipse(0.02, 1.05, 0.15, 0.09, 0, 0, TAU); ctx.fill();
    },
    trailsign(ctx) {
      ctx.fillStyle = '#6b5a48'; ctx.fillRect(-0.06, 0, 0.12, 2.0);
      ctx.fillStyle = '#ffc629'; poly(ctx, [[-0.7, 1.55], [0.55, 1.55], [0.8, 1.75], [0.55, 1.95], [-0.7, 1.95]]); ctx.fill();
      ctx.fillStyle = '#16232b'; ctx.fillRect(-0.55, 1.72, 0.9, 0.06);
    },
    lavarock(ctx, t) {
      ctx.fillStyle = '#2a201e'; poly(ctx, [[-1.0, 0], [-0.7, 0.7], [0.1, 1.0], [0.8, 0.5], [1.0, 0]]); ctx.fill();
      ctx.strokeStyle = 'rgba(255,110,40,' + (0.5 + 0.4 * Math.sin(t * 2)) + ')'; ctx.lineWidth = 0.06;
      ctx.beginPath(); ctx.moveTo(-0.5, 0.2); ctx.lineTo(-0.2, 0.55); ctx.lineTo(0.2, 0.45); ctx.lineTo(0.5, 0.75); ctx.stroke();
    },
    deadtree(ctx) {
      ctx.strokeStyle = '#3a2c28'; ctx.lineWidth = 0.16; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0.1, 2.2); ctx.moveTo(0.05, 1.2); ctx.lineTo(-0.6, 1.8); ctx.moveTo(0.08, 1.6); ctx.lineTo(0.7, 2.3); ctx.stroke();
    },
    vent(ctx, t, o) {
      ctx.fillStyle = '#2a201e'; poly(ctx, [[-0.6, 0], [-0.2, 0.5], [0.2, 0.5], [0.6, 0]]); ctx.fill();
      ctx.fillStyle = 'rgba(120,110,105,0.35)';
      for (let k = 0; k < 3; k++) {

<script>
/* =====================================================================
   Eingabe: Touch/Maus (Pointer Events) auf zwei großen Hälften,
   Tastatur (Pfeile, A/D). Verhindert Zoom, Scrollen und Browsergesten.
   ===================================================================== */
'use strict';
(function (GS) {
  const Input = {
    touchGas: false, touchBrake: false,
    keyGas: false, keyBrake: false,
    pointers: new Map(),
    layer: null,
    onPause: null,
    onConfirm: null,
    get gas() { return this.touchGas || this.keyGas; },
    get brake() { return this.touchBrake || this.keyBrake; },

    attach(layer) {
      this.layer = layer;
      const upd = () => this._recompute();
      const side = (e) => {
        const r = layer.getBoundingClientRect();
        return (e.clientX - r.left) < r.width / 2 ? 'brake' : 'gas';
      };
      layer.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        try { layer.setPointerCapture(e.pointerId); } catch (_) { /* ignorieren */ }
        this.pointers.set(e.pointerId, side(e));
        upd();
        GS.Audio && GS.Audio.unlock();
      }, { passive: false });
      layer.addEventListener('pointermove', (e) => {
        if (!this.pointers.has(e.pointerId)) return;
        e.preventDefault();
        const s = side(e);
        if (this.pointers.get(e.pointerId) !== s) { this.pointers.set(e.pointerId, s); upd(); }
      }, { passive: false });
      const end = (e) => {
        if (this.pointers.delete(e.pointerId)) upd();
      };
      layer.addEventListener('pointerup', end);
      layer.addEventListener('pointercancel', end);
      layer.addEventListener('lostpointercapture', end);
      layer.addEventListener('contextmenu', (e) => e.preventDefault());

      window.addEventListener('keydown', (e) => this._key(e, true));
      window.addEventListener('keyup', (e) => this._key(e, false));
      window.addEventListener('blur', () => this.reset());
      document.addEventListener('visibilitychange', () => { if (document.hidden) this.reset(); });

      Input.guardPage();
    },

    _recompute() {
      let g = false, b = false;
      for (const s of this.pointers.values()) { if (s === 'gas') g = true; else b = true; }
      this.touchGas = g;
      this.touchBrake = b;
    },

    _key(e, down) {
      const k = e.key;
      const tag = (e.target && e.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'SELECT') return;
      let handled = true;
      if (k === 'ArrowRight' || k === 'd' || k === 'D' || k === 'ArrowUp' || k === 'w' || k === 'W') this.keyGas = down;
      else if (k === 'ArrowLeft' || k === 'a' || k === 'A' || k === 'ArrowDown' || k === 's' || k === 'S') this.keyBrake = down;
      else if (down && (k === 'Escape' || k === 'p' || k === 'P')) { if (this.onPause) this.onPause(); }
      else if (down && k === ' ') { if (this.onConfirm) this.onConfirm(); }
      else handled = false;
      if (handled && GS.Game && GS.Game.inRace()) e.preventDefault();
      if (down) GS.Audio && GS.Audio.unlock();
    },

    reset() {
      this.pointers.clear();
      this.touchGas = this.touchBrake = false;
      this.keyGas = this.keyBrake = false;
    },

    /** Browser-Zoom, Doppeltipp-Zoom, Scrollen und Gesten unterbinden */
    guardPage() {
      if (Input._guarded) return;
      Input._guarded = true;
      // Viewport hart setzen (auch falls die Seite eingebettet ausgeliefert wird)
      try {
        let m = document.querySelector('meta[name="viewport"]');
        if (!m) { m = document.createElement('meta'); m.name = 'viewport'; document.head.appendChild(m); }
        m.content = 'width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover';
      } catch (_) { /* ignorieren */ }
      const inScroller = (t) => !!(t && t.closest && t.closest('.scroll, input[type="range"]'));
      document.addEventListener('touchmove', (e) => {
        if (e.touches.length > 1 || !inScroller(e.target)) e.preventDefault();
      }, { passive: false });
      document.addEventListener('touchstart', (e) => {
        if (e.touches.length > 1) e.preventDefault();
      }, { passive: false });
      let lastTouchEnd = 0;
      document.addEventListener('touchend', (e) => {
        const now = Date.now();
        // Doppeltipp-Zoom verhindern (iOS), Klicks auf Knöpfe bleiben erhalten
        if (now - lastTouchEnd < 320 && !(e.target.closest && e.target.closest('button, input, label, select'))) e.preventDefault();
        lastTouchEnd = now;
      }, { passive: false });
      ['gesturestart', 'gesturechange', 'gestureend'].forEach((n) => document.addEventListener(n, (e) => e.preventDefault(), { passive: false }));
      document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });
      window.addEventListener('wheel', (e) => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
      document.addEventListener('selectstart', (e) => { if (!(e.target.closest && e.target.closest('input'))) e.preventDefault(); });
    },
  };

  GS.Input = Input;
})(window.GS = window.GS || {});

</script>
<script>
/* =====================================================================
   Audio: eigenes, vollständig synthetisches Web-Audio-System (keine Samples,
   keine fremden Klänge). Alle Werte zentral in CONFIG.audio.

   Busse:  Musik ─┐
           SFX ───┼─► Master ─► Kompressor ─► Ausgang
           (Atmosphäre und UI laufen über SFX)

   - Fahrgeräusche entstehen laufend aus den Physikwerten (Drehzahl, Gas,
     Tempo, Radkontakt, Federweg, Schlupf, Bremse, Luftzeit, Drehung).
   - KI-Fahrzeuge klingen mit, leiser und im Stereobild je nach Entfernung.
   - Kurze Klänge sind gedrosselt (Ratenbegrenzung + Höchstzahl gleichzeitig).
   - Musik: Sequenzer mit Vorausplanung (sauberer Loop, Überblendung).
   - Mobil: wird bei der ersten Berührung/Taste aktiviert; im Hintergrund pausiert.
   ===================================================================== */
'use strict';
(function (GS) {
  const C = GS.CONFIG;
  const CA = C.audio;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

    /* =================== Grundgerüst =================== */

    /** nach erster Benutzerinteraktion aufrufen (iOS/Android verlangen das) */

    _installUnlock() {

    setEnabled(on) { this.enabled = on; if (on) this.unlock(); this._applyVol(); if (!on) this.stopDrive(); },
    setVolume(v) { this.vol.master = v; this._applyVol(); },
    setMusicVolume(v) { this.vol.music = v; this._applyVol(); },

    /* ---------- Begrenzung ---------- */

    _mdone(src) { src.onended = () => { this.mlive = Math.max(0, this.mlive - 1); }; },

    /* ---------- Bausteine für kurze Klänge ---------- */

    /** Ton mit Hüllkurve. o: f, f2 (Gleiten), dur, type, vol, delay, attack, bus, pan, q/filter, echo */

    /* =================== Fahrgeräusche =================== */

    _killVoice(v) {

    /**

    updateDrive(session, dt, info) {
      if (!this.ok() || !session || !info.run || this.paused) { if (this.drive && (!info || !info.run || this.paused)) this.stopDrive(); return; }
      if (!this.drive || this.drive.session !== session) {
        this.stopDrive();
        this.drive = { session, voices: new Map(), acc: 1, px: session.player.vehicle.x };
      }
      const D = this.drive;
      D.acc += dt;
      const step = 1 / CA.updateHz;
      if (D.acc < step) return;
      const udt = Math.min(0.2, D.acc);
      D.acc = 0;
      const envId = session.track.envId;
      const player = session.player;
      D.px = player.vehicle.x;
      D.py = player.vehicle.chassis.getPosition().y;
      // hörbare KI: die nächsten innerhalb der Reichweite
      const maxAi = this.lowPower ? CA.aiVoicesLow : CA.aiVoices;
      const ais = session.racers.filter((r) => r !== player)
        .map((r) => ({ r, d: Math.abs(r.vehicle.x - D.px) }))
        .filter((o) => o.d < CA.aiRange).sort((a, b) => a.d - b.d).slice(0, maxAi).map((o) => o.r);
      const want = new Set([player].concat(ais));
      for (const [r, v] of D.voices) if (!want.has(r)) { this._killVoice(v); D.voices.delete(r); }
      for (const r of want) {

    _updateVoice(v, session, dt) {
      const c = this.ctx, t = c.currentTime;
      const veh = v.r.vehicle, prof = v.prof, surf = v.surf, L = CA.levels;
      const pos = veh.chassis.getPosition();
      const vel = veh.chassis.getLinearVelocity();
      const speed = Math.hypot(vel.x, vel.y);
      const crashed = veh.crashed;
      const gas = !!veh.input.gas && !crashed;
      const brake = !!veh.input.brake && !crashed;

      // Entfernung (KI): Lautstärke und Stereo
      let att = 1;
      if (!v.isPlayer) {
        const dx = veh.x - this.drive.px, dy = pos.y - this.drive.py;

      }
      v.out.gain.setTargetAtTime(att, t, 0.12);

      // Gas glätten (schnell auf, langsamer zu) und Drehzahl
      v.thr += ((gas ? 1 : 0) - v.thr) * clamp(dt * (gas ? 14 : 7), 0, 1);
      let rpm;
      if (!veh.controlEnabled && !crashed) {
        // Countdown: Startdrehzahl (Gas hebt, Loslassen senkt) – dieselbe, die der Tacho zeigt
        rpm = Math.max(0.08, veh.launchRpm || 0);
      } else rpm = clamp(veh.rpm, 0, 1.15);
      v.rpm += (rpm - v.rpm) * clamp(dt * 12, 0, 1);
      const r = v.rpm;
      v.wob += dt * (2 + r * 5);
      const wobble = 1 + Math.sin(v.wob) * 0.012 + Math.sin(v.wob * 2.7) * 0.008;

      if (v.prevGas && !gas) v.liftT = 0; else v.liftT += dt;
